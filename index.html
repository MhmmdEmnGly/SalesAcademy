<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Satış Akademisi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F7; --surface:#FFFFFF; --ink:#13213C; --muted:#5B6474; --line:#DCE1E8;
  --accent:#0E7C66; --accent-ink:#FFFFFF; --accent-soft:#D5EEE6; --amber:#B7790B; --amber-soft:#FBEFD3; --crit:#B42318;
  --track:#C9D0DA;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --text:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1322; --surface:#141E33; --ink:#E6EAF2; --muted:#9AA4B8; --line:#25324D;
    --accent:#3CC4A2; --accent-ink:#06231C; --accent-soft:#12372F; --amber:#E9B44C; --amber-soft:#3A2E14; --crit:#F97066; --track:#2E3B57;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1322; --surface:#141E33; --ink:#E6EAF2; --muted:#9AA4B8; --line:#25324D;
  --accent:#3CC4A2; --accent-ink:#06231C; --accent-soft:#12372F; --amber:#E9B44C; --amber-soft:#3A2E14; --crit:#F97066; --track:#2E3B57;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15.5px/1.6 var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;height:60px}
.brand{font:800 19px/1 var(--display);letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font:500 12px/1.3 var(--text);color:var(--muted);letter-spacing:0;margin-top:3px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap;cursor:pointer}
nav.tabs button:hover{color:var(--ink);background:var(--surface)}
nav.tabs button[aria-selected="true"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 -2px 0 var(--accent)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:760px){.bar{flex-wrap:wrap;height:auto;padding:10px 0;gap:8px}.brand small{display:none}.sync{margin-left:auto}nav.tabs{order:3;flex-basis:100%}}

main{padding:28px 0 80px}
.view[hidden]{display:none}
h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;margin:0}
h2{font-size:26px;font-weight:700;line-height:1.15}
h3{font-size:18px;font-weight:700}
.lede{color:var(--muted);max-width:68ch;margin:8px 0 0}
.section{margin-top:44px}
.section > h2{margin-bottom:6px}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:end}
.hero h1{font-size:clamp(34px,5vw,56px);font-weight:800;line-height:1.02}
.hero p{color:var(--muted);max-width:56ch;margin:14px 0 0}
.big{display:flex;align-items:baseline;gap:14px;justify-content:flex-end}
.big .pct{font:800 clamp(64px,9vw,112px)/.9 var(--display);letter-spacing:-.04em;color:var(--accent)}
.big .lbl{color:var(--muted);font-size:14px;line-height:1.4;max-width:16ch}
@media (max-width:760px){.hero{grid-template-columns:1fr;gap:18px}.big{justify-content:flex-start}}

/* route track */
.route{margin-top:34px;overflow-x:auto;padding:6px 2px 10px}
.route ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(10,minmax(96px,1fr));min-width:980px;position:relative}
.route li{position:relative;padding-top:0}
.route li::before{content:"";position:absolute;top:21px;left:0;right:0;height:4px;background:var(--track)}
.route li:first-child::before{left:50%}
.route li:last-child::before{right:50%}
.route li.done-seg::before{background:var(--accent)}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;background:none;border:0;cursor:pointer;width:100%;padding:0 4px;color:var(--ink)}
.ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--track) 0);position:relative;z-index:1}
.ring span{width:36px;height:36px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font:700 13px/1 var(--display)}
.stop.full .ring span{background:var(--accent);color:var(--accent-ink)}
.stop b{font:600 13px/1.25 var(--text);max-width:15ch}
.stop i{font-style:normal;font-size:12px;color:var(--muted)}
.stop:hover b{color:var(--accent)}

/* next up */
.next{margin-top:30px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:18px 20px}
.next .k{font-size:13px;color:var(--muted)}
.next h3{font-size:19px;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (max-width:640px){.next{grid-template-columns:1fr}}

/* phase table */
.phases{margin-top:16px;border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:52px 1.3fr 2fr 170px;gap:18px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--ink)}
.prow:hover{background:var(--surface)}
.prow .code{font:800 20px/1 var(--display);color:var(--muted)}
.prow .nm{font-weight:600}
.prow .nm small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.prow .goal{color:var(--muted);font-size:14px}
.meter{height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.meterlbl{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
.tag-int{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--amber-soft);color:var(--amber);margin-left:6px;font-weight:500}
@media (max-width:760px){.prow{grid-template-columns:40px 1fr}.prow .goal{grid-column:2}.prow .m{grid-column:1/-1}}

/* weeks */
.weeks{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.week header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.week header b{font:700 15px var(--display)}
.week header span{font-size:12px;color:var(--muted)}
.week ul{list-style:none;margin:0;padding:0;font-size:13.5px}
.week li{padding:3px 0;display:flex;gap:8px;align-items:flex-start}
.week li button{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
.week li button:hover{color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--track);flex:none;margin-top:6px}
.dot.doing{border-color:var(--amber);background:var(--amber-soft)}
.dot.done{border-color:var(--accent);background:var(--accent)}
.week li.done button{color:var(--muted);text-decoration:line-through}

/* curriculum */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 8px}
.search{flex:1 1 240px;min-width:200px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px}
select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.count{font-size:13px;color:var(--muted);margin-top:4px}
.phase-block{margin-top:34px}
.phase-block > header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.phase-block > header .c{font:800 30px/1 var(--display);color:var(--accent)}
.phase-block > header h2{font-size:24px}
.phase-block > header .w{color:var(--muted);font-size:14px;margin-left:auto}
.mod{margin-top:18px}
.mod h4{margin:0 0 4px;font:600 14px/1.3 var(--text);color:var(--muted)}
.topic{border-bottom:1px solid var(--line)}
.trow{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:11px 2px}
.st{width:28px;height:28px;border-radius:50%;border:2px solid var(--track);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.st.doing{border-color:var(--amber);background:conic-gradient(var(--amber) 50%, var(--surface) 0)}
.st.done{border-color:var(--accent);background:var(--accent)}
.st svg{width:14px;height:14px;display:none}
.st.done svg{display:block}
.topen{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink);font-weight:500;font-size:15.5px}
.topen:hover{color:var(--accent)}
.topic.done .topen{color:var(--muted)}
.tmeta{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);white-space:nowrap}
.pr{padding:1px 8px;border-radius:99px;font-weight:500}
.pr.Kritik{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.pr.Önemli{background:var(--amber-soft);color:var(--amber)}
.pr.Destek{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.tdet{display:grid;grid-template-columns:1.25fr 1fr;gap:10px 28px;padding:4px 0 20px 46px}
.tdet[hidden]{display:none}
.tdet .blk h5{margin:10px 0 3px;font:600 13px/1.3 var(--text);color:var(--muted)}
.tdet .blk p{margin:0;max-width:72ch}
.tdet .full{grid-column:1/-1}
.practice{background:var(--accent-soft);border-radius:10px;padding:12px 14px}
.practice h5{color:var(--accent)!important;margin-top:0!important}
textarea.note{width:100%;min-height:70px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:8px 10px;resize:vertical}
.stsel{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
@media (max-width:760px){.tdet{grid-template-columns:1fr;padding-left:0}.trow{grid-template-columns:34px 1fr}.tmeta{grid-column:2}}

.lesson{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.lesson h4{margin:0 0 8px;font:700 18px/1.2 var(--display)}
.lesson p{margin:0 0 12px;max-width:72ch;line-height:1.7}
.daily{margin-top:6px;background:var(--amber-soft);border-left:4px solid var(--amber);border-radius:10px;padding:12px 16px;max-width:78ch}
.daily h5{margin:0 0 4px!important;font:600 13px/1.3 var(--text);color:var(--amber)!important}
.daily p{margin:0}
.nolesson{margin:14px 0 0;font-size:13.5px;color:var(--muted)}
.hasl{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500}
/* methods */
.matrix{margin-top:16px;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.matrix table{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
.matrix th,.matrix td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix thead th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--paper)}
.matrix td button{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);text-align:left;font-weight:500}
.matrix td button:hover{color:var(--accent)}
.fit2{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--accent)}
.fit1{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:8px;align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.mgrid{display:grid;grid-template-columns:260px 1fr;gap:28px;margin-top:26px;align-items:start}
.mlist{position:sticky;top:84px;display:flex;flex-direction:column;border-left:2px solid var(--line)}
.mlist button{background:none;border:0;text-align:left;padding:7px 12px;cursor:pointer;color:var(--muted);margin-left:-2px;border-left:2px solid transparent;font-size:14.5px}
.mlist button small{display:block;font-size:12px;opacity:.85}
.mlist button:hover{color:var(--ink)}
.mlist button[aria-current="true"]{color:var(--ink);border-left-color:var(--accent);font-weight:600}
.mdet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 28px}
.mdet h2{font-size:32px}
.mdet .cat{display:inline-block;margin-top:8px;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.mdet .origin{color:var(--muted);font-size:14px;margin-top:10px}
.mdet .sum{font-size:17px;line-height:1.6;margin:16px 0 0;max-width:70ch}
.mdet h3{margin:26px 0 10px;font-size:17px}
.comps{display:grid;gap:0;border-top:1px solid var(--line)}
.comp{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:18px;padding:12px 0;border-bottom:1px solid var(--line)}
.comp b{font-family:var(--display);font-weight:700;font-size:15.5px}
.comp p{margin:0}
.examples{margin:0;padding:0;list-style:none}
.examples li{padding:10px 14px;border-radius:10px;background:var(--paper);margin-bottom:8px;font-size:14.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two > div{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.two h4{margin:0 0 4px;font:600 14px var(--text)}
.two .g h4{color:var(--accent)} .two .z h4{color:var(--crit)}
.two p{margin:0;font-size:14.5px}
@media (max-width:860px){.mgrid{grid-template-columns:1fr}.mlist{position:static;flex-direction:row;overflow-x:auto;border-left:0;border-bottom:2px solid var(--line)}.mlist button{border-left:0;border-bottom:2px solid transparent;margin:0 0 -2px;white-space:nowrap}.mlist button small{display:none}.mlist button[aria-current="true"]{border-bottom-color:var(--accent)}.comp{grid-template-columns:1fr;gap:4px}.two{grid-template-columns:1fr}.mdet{padding:20px}}

/* calculator */
.calc{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:18px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.inputs label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.inputs input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums;color:var(--ink);font-size:15px}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.out{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.out .v{font:700 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.out .n{font-size:13px;color:var(--muted);margin-top:4px}
.out.warn .v{color:var(--crit)} .out.good .v{color:var(--accent)}
.gloss{margin-top:16px;border-top:1px solid var(--line)}
.gl{display:grid;grid-template-columns:230px 1fr 1fr;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.gl b{font-weight:600}
.gl code{font-family:var(--text);background:var(--paper);padding:2px 6px;border-radius:6px;font-size:13.5px}
.gl span{color:var(--muted)}
@media (max-width:860px){.calc{grid-template-columns:1fr}.gl{grid-template-columns:1fr;gap:4px}}
@media (max-width:480px){.inputs,.outs{grid-template-columns:1fr}}

/* projects */
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-top:18px}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.proj .pk{font:800 14px var(--display);color:var(--accent)}
.proj h3{font-size:20px;margin-top:2px}
.proj .area{font-size:13.5px;color:var(--muted);margin-top:4px}
.proj p{margin:10px 0 12px;font-size:14.5px}
.steps{list-style:none;margin:12px 0 0;padding:0}
.steps li{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14.5px;align-items:flex-start}
.steps input{margin-top:5px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.steps li.ok span{color:var(--muted);text-decoration:line-through}
.pfoot{font-size:13px;color:var(--muted);margin-top:12px}

/* resources */
.res{margin-top:16px;border-top:1px solid var(--line)}
.rrow{display:grid;grid-template-columns:110px 1.3fr 2fr;gap:18px;padding:14px 0;border-bottom:1px solid var(--line)}
.rrow .t{font-size:13px;font-weight:600;color:var(--muted)}
.rrow h4{margin:0;font:600 15.5px/1.35 var(--text)}
.rrow h4 a{color:var(--ink);text-decoration-color:var(--accent);text-underline-offset:3px}
.rrow h4 a:hover{color:var(--accent)}
.rrow .by{font-size:13px;color:var(--muted);margin-top:2px}
.rrow .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rrow .facts span{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.rrow p{margin:0;font-size:14.5px}
@media (max-width:760px){.rrow{grid-template-columns:1fr;gap:6px}}

.empty{padding:30px 0;color:var(--muted)}
.foot{margin-top:60px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <div class="brand">Satış Akademisi<small>Temelden stratejik iş geliştirmeye</small></div>
    <nav class="tabs" role="tablist" aria-label="Bölümler">
      <button role="tab" data-view="yol" aria-selected="true">Yol haritası</button>
      <button role="tab" data-view="mufredat" aria-selected="false">Müfredat</button>
      <button role="tab" data-view="metod" aria-selected="false">Metodolojiler</button>
      <button role="tab" data-view="metrik" aria-selected="false">Metrikler</button>
      <button role="tab" data-view="proje" aria-selected="false">Projeler</button>
      <button role="tab" data-view="kaynak" aria-selected="false">Kaynaklar</button>
    </nav>
    <div class="sync" id="sync" aria-live="polite">Yükleniyor…</div>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-yol"></section>
  <section class="view" id="v-mufredat" hidden></section>
  <section class="view" id="v-metod" hidden></section>
  <section class="view" id="v-metrik" hidden></section>
  <section class="view" id="v-proje" hidden></section>
  <section class="view" id="v-kaynak" hidden></section>
  <p class="foot">İlerlemen hesabınla kaydedilir; hesap bağlantısı yoksa bu tarayıcıda saklanır. Aynı içerik Excel dosyasında da var.</p>
</main>

<script>
/* İçerik data.json dosyasından yüklenir (bkz. boot) */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let DATA, TOP, PH;

/* ---------- state & persistence ---------- */
let state = { topics:{}, steps:{}, notes:{} };
const LS_KEY = "satis-akademisi-v1";
let dbRef = null, saveTimer = null;
function loadLocal(){ try{ const s = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if(s && typeof s === "object") state = Object.assign({topics:{},steps:{},notes:{}}, s); }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function setSync(t){ $("#sync").textContent = t; }
function persist(){
  saveLocal();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if(!dbRef){ setSync("Bu tarayıcıda kaydedildi"); return; }
    try{ await dbRef.set({ topics:state.topics, steps:state.steps, notes:state.notes, updatedAt:new Date().toISOString() }); setSync("Hesabına kaydedildi"); }
    catch(e){ setSync("Bu tarayıcıda kaydedildi"); }
  }, 700);
}
async function initStore(){
  const c = window.claude;
  if(!c || typeof c.use !== "function"){ setSync("Bu tarayıcıda saklanıyor"); return; }
  try{
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    if(!db || !user){ setSync("Bu tarayıcıda saklanıyor"); return; }
    const uid = await user.id();
    if(!uid){ setSync("Bu tarayıcıda saklanıyor"); return; }
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    if(snap.exists){
      const d = snap.data() || {};
      state = { topics: Object.assign({}, d.topics||{}), steps: Object.assign({}, d.steps||{}), notes: Object.assign({}, d.notes||{}) };
      saveLocal(); renderAll(); setSync("Hesabınla senkron");
    } else {
      const hasLocal = Object.keys(state.topics).length || Object.keys(state.steps).length || Object.keys(state.notes).length;
      if(hasLocal) persist(); else setSync("Hesabınla senkron");
    }
  }catch(e){ dbRef = null; setSync("Bu tarayıcıda saklanıyor"); }
}
const st = id => state.topics[id] || "todo";
function setStatus(id, s){ if(s === "todo") delete state.topics[id]; else state.topics[id] = s; persist(); }
const nextStatus = s => s === "todo" ? "doing" : s === "doing" ? "done" : "todo";
const LBL = { todo:"Başlamadı", doing:"Devam ediyor", done:"Tamamlandı" };

function phaseStats(kod){
  const ts = DATA.topics.filter(t => t.faz === kod);
  const done = ts.filter(t => st(t.id) === "done");
  const doing = ts.filter(t => st(t.id) === "doing").length;
  const h = ts.reduce((a,t)=>a+t.saat,0), hd = done.reduce((a,t)=>a+t.saat,0);
  return { n:ts.length, done:done.length, doing, h, hd, p: ts.length ? Math.round(done.length/ts.length*100) : 0 };
}
function overall(){
  const n = DATA.topics.length, d = DATA.topics.filter(t => st(t.id)==="done").length;
  const h = DATA.topics.reduce((a,t)=>a+t.saat,0), hd = DATA.topics.filter(t => st(t.id)==="done").reduce((a,t)=>a+t.saat,0);
  return { n, d, h, hd, p: Math.round(d/n*100) };
}

/* ---------- Müfredat ---------- */
const filt = { phase:"all", q:"", status:"all", prio:"all" };
const openSet = new Set();
const CHECK = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" style="color:var(--accent-ink)"><path d="M3.5 8.5l3 3 6-7"/></svg>`;
function topicMatch(t){
  if(filt.phase !== "all" && t.faz !== filt.phase) return false;
  if(filt.status !== "all" && st(t.id) !== filt.status) return false;
  if(filt.prio !== "all" && t.oncelik !== filt.prio) return false;
  if(filt.q){ const q = filt.q.toLocaleLowerCase("tr"); return [t.konu,t.hedef,t.teori,t.pratik,t.modul,t.kaynak,(t.anlatim||[]).join(" "),t.ornek||""].join(" ").toLocaleLowerCase("tr").includes(q); }
  return true;
}
function topicHTML(t){
  const s = st(t.id), open = openSet.has(t.id);
  return `<div class="topic ${s}" id="t-${t.id.replace('.','-')}">
    <div class="trow">
      <button class="st ${s}" data-cycle="${t.id}" aria-label="Durum: ${LBL[s]}. Değiştirmek için tıkla" title="${LBL[s]}">${CHECK}</button>
      <button class="topen" data-open="${t.id}" aria-expanded="${open}">${esc(t.konu)}</button>
      <span class="tmeta">${t.anlatim ? '<span class="hasl">Ders</span>' : ''}<span>${t.id}</span><span>${t.saat} sa</span><span class="pr ${esc(t.oncelik)}">${esc(t.oncelik)}</span></span>
    </div>
    <div class="tdet" ${open ? "" : "hidden"}>
      <div class="blk"><h5>Öğrenme hedefi</h5><p>${esc(t.hedef)}</p><h5>Teori ve özet</h5><p>${esc(t.teori)}</p></div>
      <div class="blk"><div class="practice"><h5>Pratik görev</h5><p>${esc(t.pratik)}</p><h5>Çıktı</h5><p>${esc(t.cikti)}</p></div>
        <h5>Kaynak</h5><p>${esc(t.kaynak)}</p>
        <h5>Durum</h5><div class="stsel">${["todo","doing","done"].map(k => `<button class="chip" aria-pressed="${s===k}" data-set="${t.id}" data-val="${k}">${LBL[k]}</button>`).join("")}</div>
      </div>
      ${t.anlatim ? `<div class="lesson full">
        <h4>Konu anlatımı</h4>
        ${t.anlatim.map(p => `<p>${esc(p)}</p>`).join("")}
        <div class="daily"><h5>Gündelik hayattan örnek</h5><p>${esc(t.ornek)}</p></div>
      </div>` : `<p class="nolesson full">Bu konunun anlatımı sonraki güncellemede eklenecek.</p>`}
      <div class="blk full"><h5>Notlarım</h5><textarea class="note" data-note="${t.id}" placeholder="Bu konuda öğrendiklerin, uygulama sonuçların…">${esc(state.notes[t.id] || "")}</textarea></div>
    </div></div>`;
}
function renderMufredat(){
  const v = $("#v-mufredat");
  const list = DATA.topics.filter(topicMatch);
  const chips = [["all","Tümü"], ...DATA.phases.map(p => [p.kod, p.kod])].map(([k,l]) => `<button class="chip" data-fphase="${k}" aria-pressed="${filt.phase===k}" title="${k==='all'?'Tüm fazlar':esc(PH[k].ad)}">${l}</button>`).join("");
  let body = "";
  for(const p of DATA.phases){
    const ts = list.filter(t => t.faz === p.kod);
    if(!ts.length) continue;
    const mods = [...new Set(ts.map(t => t.modul))];
    const s = phaseStats(p.kod);
    body += `<div class="phase-block"><header><span class="c">${p.kod}</span><h2>${esc(p.ad)}</h2><span class="w">Hafta ${esc(p.hafta)}, %${s.p} tamam</span></header>
      <p class="lede">${esc(p.amac)}</p>
      ${mods.map(m => `<div class="mod"><h4>${esc(m)}</h4>${ts.filter(t => t.modul === m).map(topicHTML).join("")}</div>`).join("")}</div>`;
  }
  v.innerHTML = `<h2>Müfredat</h2><p class="lede">Daireye tıklayarak durumu değiştir (başlamadı, devam ediyor, tamamlandı). Konu adına tıklayınca teori, pratik görev ve not alanı açılır.</p>
    <div class="controls">
      <input class="search" type="search" placeholder="Konu, yöntem veya kavram ara" value="${esc(filt.q)}" aria-label="Müfredatta ara">
      <select id="fstatus" aria-label="Durum filtresi"><option value="all">Tüm durumlar</option><option value="todo">Başlamadı</option><option value="doing">Devam ediyor</option><option value="done">Tamamlandı</option></select>
      <select id="fprio" aria-label="Öncelik filtresi"><option value="all">Tüm öncelikler</option><option>Kritik</option><option>Önemli</option><option>Destek</option></select>
    </div>
    <div class="chips" role="group" aria-label="Faz filtresi">${chips}</div>
    <div class="count">${list.length} konu gösteriliyor</div>
    ${body || `<p class="empty">Bu filtrelere uyan konu yok. Filtreleri temizlemek için "Tümü"ye tıkla.</p>`}`;
  $("#fstatus", v).value = filt.status; $("#fprio", v).value = filt.prio;
  const s = $(".search", v);
  s.addEventListener("input", e => { filt.q = e.target.value; const pos = e.target.selectionStart; renderMufredat(); const n = $("#v-mufredat .search"); n.focus(); n.setSelectionRange(pos,pos); });
  $("#fstatus", v).addEventListener("change", e => { filt.status = e.target.value; renderMufredat(); });
  $("#fprio", v).addEventListener("change", e => { filt.prio = e.target.value; renderMufredat(); });
  $$("[data-fphase]", v).forEach(b => b.addEventListener("click", () => { filt.phase = b.dataset.fphase; renderMufredat(); }));
}
// delegated events for topics (work in mufredat)
document.addEventListener("click", e => {
  const c = e.target.closest("[data-cycle]");
  if(c){ const id = c.dataset.cycle; setStatus(id, nextStatus(st(id))); renderMufredat(); const b = document.querySelector(`[data-cycle="${id}"]`); if(b) b.focus(); return; }
  const o = e.target.closest("[data-open]");
  if(o){ const id = o.dataset.open; openSet.has(id) ? openSet.delete(id) : openSet.add(id); refreshTopic(id); return; }
  const se = e.target.closest("[data-set]");
  if(se){ setStatus(se.dataset.set, se.dataset.val); renderMufredat(); }
});
document.addEventListener("input", e => {
  const n = e.target.closest("[data-note]");
  if(n){ const v = n.value.trim(); if(v) state.notes[n.dataset.note] = n.value; else delete state.notes[n.dataset.note]; persist(); }
});
function refreshTopic(id){
  const el = document.getElementById("t-" + id.replace(".","-"));
  const t = TOP[id];
  if(el && topicMatch(t)){ const tmp = document.createElement("div"); tmp.innerHTML = topicHTML(t); el.replaceWith(tmp.firstElementChild); }
  else if(el){ renderMufredat(); }
}
function openTopic(id){
  const t = TOP[id]; filt.phase = t.faz; filt.q = ""; filt.status = "all"; filt.prio = "all";
  openSet.add(id); renderMufredat(); show("mufredat");
  const el = document.getElementById("t-" + id.replace(".","-"));
  if(el) el.scrollIntoView({ block:"start" });
}

/* ---------- Metrikler ---------- */
const CALC = [
  ["sm","Dönem satış + pazarlama gideri (TL)",900000],["nc","Kazanılan yeni müşteri",40],["mr","Müşteri başına aylık gelir (TL)",4500],
  ["gm","Brüt marj (%)",65],["ch","Yıllık churn (%)",35],["op","Açık fırsat sayısı",60],["wr","Win rate (%)",25],["ad","Ortalama deal (TL)",54000],
  ["cy","Satış döngüsü (gün)",45],["tg","Yıllık yeni gelir hedefi (TL)",3000000],["mo","Toplantı → fırsat (%)",40],["cm","Temas → toplantı (%)",8],
  ["rt","Kalan dönem hedefi (TL)",900000],["pp","Açık pipeline (TL)",3240000]
];
const calcVals = Object.fromEntries(CALC.map(([k,,v]) => [k,v]));
const fmt = (n, d=0) => isFinite(n) ? n.toLocaleString("tr-TR",{maximumFractionDigits:d, minimumFractionDigits:d}) : "–";
function calcOut(){
  const v = calcVals, gm=v.gm/100, ch=v.ch/100, wr=v.wr/100, mo=v.mo/100, cm=v.cm/100;
  const cac = v.nc ? v.sm/v.nc : NaN, pay = (v.mr*gm) ? cac/(v.mr*gm) : NaN, ltv = ch ? v.mr*12*gm/ch : NaN;
  const ratio = cac ? ltv/cac : NaN, vel = v.cy ? v.op*wr*v.ad/v.cy : NaN;
  const wins = v.ad ? v.tg/v.ad : NaN, opps = wr ? wins/wr : NaN, mtgs = mo ? opps/mo : NaN, cont = cm ? mtgs/cm : NaN;
  const cov = v.rt ? v.pp/v.rt : NaN, req = wr ? 1/wr : NaN;
  return [
    ["CAC", fmt(cac)+" TL","Gider / yeni müşteri"],["CAC geri ödeme", fmt(pay,1)+" ay","CAC / (aylık gelir × marj)", pay>18?"warn":pay<=12?"good":""],
    ["LTV", fmt(ltv)+" TL","Yıllık brüt kâr / churn"],["LTV : CAC", fmt(ratio,1)+"x","Yaygın referans ≈ 3x", ratio<3?"warn":"good"],
    ["Sales velocity", fmt(vel)+" TL/gün","Fırsat × win rate × deal / döngü"],["Gereken kazanım", fmt(wins)+" / yıl","Hedef / ortalama deal"],
    ["Gereken fırsat", fmt(opps)+" / yıl","Kazanım / win rate"],["Gereken toplantı", fmt(mtgs)+" / yıl","Fırsat / toplantı→fırsat"],
    ["Gereken temas", fmt(cont)+" / yıl","Toplantı / temas→toplantı"],["Haftalık temas", fmt(cont/48)+" kişi","48 çalışma haftası"],
    ["Pipeline coverage", fmt(cov,1)+"x","Açık pipeline / kalan hedef", cov<req?"warn":"good"],["Gereken coverage", fmt(req,1)+"x","≈ 1 / win rate"]
  ];
}
function renderOuts(){ $("#outs").innerHTML = calcOut().map(([n,v,d,c]) => `<div class="out ${c||""}"><div class="v">${v}</div><div class="n"><b>${n}</b>, ${d}</div></div>`).join(""); }
function renderMetrik(){
  $("#v-metrik").innerHTML = `<h2>Metrikler ve hesaplayıcı</h2>
    <p class="lede">Örnek değerleri kendi rakamlarınla değiştir; birim ekonomisi, sales velocity ve ters huni anında hesaplanır. Kırmızı sonuç dikkat edilmesi gereken yeri gösterir.</p>
    <div class="calc">
      <div class="inputs">${CALC.map(([k,l]) => `<label>${esc(l)}<input type="number" inputmode="decimal" data-k="${k}" value="${calcVals[k]}"></label>`).join("")}</div>
      <div class="outs" id="outs"></div>
    </div>
    <div class="section"><h2>Metrik sözlüğü</h2><div class="gloss">${DATA.metrics.map(m => `<div class="gl"><b>${esc(m.ad)}</b><code>${esc(m.formul)}</code><span>${esc(m.yorum)}</span></div>`).join("")}</div></div>`;
  $$("#v-metrik input").forEach(i => i.addEventListener("input", e => { calcVals[e.target.dataset.k] = parseFloat(e.target.value) || 0; renderOuts(); }));

}

        <p>${esc(p.amac)}</p>
        <div class="meter"><i style="width:${pc}%"></i></div><div class="meterlbl"><span>${done}/${p.adimlar.length} adım</span><span>%${pc}</span></div>
        <ol class="steps">${p.adimlar.map((s,i) => { const k = p.kod+"-"+i, ok = !!state.steps[k]; return `<li class="${ok?'ok':''}"><input type="checkbox" id="s-${k}" data-step="${k}" ${ok?"checked":""}><label for="s-${k}"><span>${esc(s)}</span></label></li>`; }).join("")}</ol>
        <div class="pfoot">Çıktı: ${esc(p.cikti)}<br>Süre: ${esc(p.sure)}, Fazlar: ${esc(p.fazlar)}</div></article>`;
    }).join("")}</div>`;
  $$("#v-proje [data-step]").forEach(c => c.addEventListener("change", e => {
    const k = e.target.dataset.step; if(e.target.checked) state.steps[k] = true; else delete state.steps[k]; persist(); renderProje();
    const el = document.getElementById("s-"+k); if(el) el.focus();
  }));
}

/* ---------- Kaynaklar ---------- */
const rf = { tur:"all", q:"" };
function renderKaynak(){
  const types = [...new Set(DATA.resources.map(r => r.tur))];
  const list = DATA.resources.filter(r => (rf.tur==="all"||r.tur===rf.tur) && (!rf.q || [r.ad,r.saglayici,r.nasil,r.fazlar].join(" ").toLocaleLowerCase("tr").includes(rf.q.toLocaleLowerCase("tr"))));
  $("#v-kaynak").innerHTML = `<h2>Kaynaklar: nereden, nasıl öğrenilir?</h2>
    <p class="lede">Sıralama önerisi: önce ücretsiz sertifikalar (HubSpot Academy, Trailhead) ve podcast'ler, faz ilerledikçe kitaplar, bütçe oluştuğunda MEDDICC, Winning by Design veya Pavilion gibi ücretli programlar.</p>
    <div class="controls"><input class="search" type="search" placeholder="Kaynak ara" value="${esc(rf.q)}" aria-label="Kaynaklarda ara"></div>
    <div class="chips">${[["all","Tümü"],...types.map(t=>[t,t])].map(([k,l]) => `<button class="chip" data-rt="${esc(k)}" aria-pressed="${rf.tur===k}">${esc(l)}</button>`).join("")}</div>
    <div class="count">${list.length} kaynak</div>
    <div class="res">${list.map(r => `<div class="rrow"><div class="t">${esc(r.tur)}</div>
      <div><h4>${r.link ? `<a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.ad)}</a>` : esc(r.ad)}</h4><div class="by">${esc(r.saglayici)}</div>
        <div class="facts"><span>${esc(r.fazlar)}</span><span>${esc(r.seviye)}</span><span>${esc(r.ucret)}</span><span>${esc(r.dil)}</span></div></div>
      <p>${esc(r.nasil)}</p></div>`).join("") || `<p class="empty">Aramana uyan kaynak yok.</p>`}</div>`;
  const s = $("#v-kaynak .search");
  s.addEventListener("input", e => { rf.q = e.target.value; const pos = e.target.selectionStart; renderKaynak(); const n = $("#v-kaynak .search"); n.focus(); n.setSelectionRange(pos,pos); });
  $$("#v-kaynak [data-rt]").forEach(b => b.addEventListener("click", () => { rf.tur = b.dataset.rt; renderKaynak(); }));
}

function renderAll(){ renderYol(); renderMufredat(); renderMetod(); renderMetrik(); renderProje(); renderKaynak(); }
async function boot(){
  try{
    const r = await fetch("data.json", { cache:"no-cache" });
    if(!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
  }catch(e){
    setSync("İçerik yüklenemedi");
    $("#v-yol").innerHTML = `<p class="empty">İçerik (data.json) yüklenemedi. Sayfayı dosyadan çift tıklayarak açtıysan tarayıcı bu dosyayı okumaya izin vermez; klasördeki <code>serve.ps1</code> ile yerel sunucuyu başlatıp <code>http://localhost:8000</code> adresini aç.</p>`;
    return;
  }
  TOP = Object.fromEntries(DATA.topics.map(t => [t.id, t]));
  PH = Object.fromEntries(DATA.phases.map(p => [p.kod, p]));
  loadLocal(); renderAll(); setSync("Bu tarayıcıda saklanıyor"); initStore();
}
boot();
</script>
