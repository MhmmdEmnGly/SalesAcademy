Görüşme sonrası özet müşteriye gönderilir ve doğrulanır.", "pratik": "Discovery görüşme şablonu hazırla ve 2 gerçek görüşmede kullan; özet e-postası gönder.", "cikti": "Discovery şablonu + 2 özet", "saat": 4, "oncelik": "Kritik", "kaynak": "Gong Labs – discovery araştırmaları; Gap Selling"}, {"id": "F4.02", "faz": "F4", "fazAd": "Discovery, Değer Satışı & Müzakere", "modul": "Discovery", "konu": "Acıyı paraya çevirmek: Pain → Impact → Metrics", "hedef": "Problemi ölçülebilir finansal etkiye dönüştürmek.", "teori": "Her problem sorusu şu zinciri takip eder: Problem ne? → Ne sıklıkta / ne kadar? → Neye mal oluyor (zaman, para, risk, fırsat kaybı)? → Kimi etkiliyor? → Çözülmezse 12 ay sonra ne olur? Rakamlar müşteriden gelmeli. Etki genelde 4 kovada ölçülür: gelir artışı, maliyet düşüşü, risk azaltma, stratejik kazanım.", "pratik": "Bir müşterinin problemini 4 kovalı etki tablosuna dök ve yıllık TL karşılığını hesapla.", "cikti": "Etki hesaplama tablosu", "saat": 3, "oncelik": "Kritik", "kaynak": "Value Selling; Command of the Message"}, {"id": "F4.03", "faz": "F4", "fazAd": "Discovery, Değer Satışı & Müzakere", "modul": "Sunum", "konu": "Demo ve çözüm sunumu", "hedef": "Keşfedilen acıya bağlı, kısa ve etkili demo/sunum yapmak.", "teori": "Great Demo! (Peter Cohan): sonucu önce göster ('Do the last thing first'), sonra nasıl yapıldığını. Tell-Show-Tell: ne göstereceğini söyle, göster, neyi gösterdiğini özetle. Sadece keşifte çıkan acılara karşılık gelen özellikleri göster. Her 5–7 dakikada müşteriye soru sor. Vizyon demosu (ilk toplantı) ile teknik demo (değerlendirme) farklıdır.", "pratik": "Vimex için 15 dakikalık, eczane acılarına bağlı bir demo senaryosu yaz ve kaydet.", "cikti": "Demo script + kayıt", "saat": 4, "oncelik": "Önemli", "kaynak": "Great Demo! (Peter Cohan)"}, {"id": "F4.04", "faz": "F4", "fazAd": "Discovery, Değer Satışı & Müzakere", "modul": "Sunum", "konu": "Teklif ve proposal yazımı", "hedef": "Karar vermeyi kolaylaştıran, iç satışa uygun teklifler yazmak.", "teori": "Yapı: Yönetici özeti (1 sayfa, müşterinin diliyle) → Mevcut durum ve hedef → Önerilen çözüm → Yatırım ve seçenekler (good-better-best) → ROI / geri dönüş → Uygulama takvimi → Şartlar → Sonraki adımlar. Teklif sürpriz içermemeli; içeriği önceden sözlü olarak doğrulanmalı. Şampiyonun iç sunumunu kolaylaştıracak şekilde yazılır.", "pratik": "Mevcut bir fırsat için bu yapıda teklif hazırla; eski teklifinle karşılaştır.", "cikti": "Yeni teklif şablonu", "saat": 4, "oncelik": "Kritik", "kaynak": "Proposify / PandaDoc rehberleri; The Pyramid Principle"}, {"id": "F4.05", "faz": "F4", "fazAd": "Discovery, Değer Satışı & Müzakere", "modul": "Sunum", "konu": "Business case ve ROI modeli", "hedef": "CFO'nun onaylayabileceği bir iş gerekçesi hazırlamak.", "teori": "Bileşenler: mevcut durum maliyeti, yatırım (TCO: lisans + uygulama + iç kaynak), faydalar (4 kova), geri ödeme süresi (payback), ROI = (Fayda − Maliyet) / Maliyet, basit NPV, riskler ve varsayımlar. Varsayımlar muhafazakâr ve müşteri onaylı olmalı. Hassasiyet analizi (kötü/baz/iyi senaryo) güven verir.", "pratik": "Excel'de 3 senaryolu bir ROI modeli kur.", "cikti": "ROI modeli", "saat": 4, "oncelik": "Kritik", "kaynak": "HBR – Building a business case; Metrikler sayfası"}, {"id": "F4.06", "faz": "F4", "fazAd": "Discovery, Değer Satışı & Müzakere", "modul": "Müzakere", "konu": "İleri itiraz yönetimi", "hedef": "Fiyat, zamanlama, rakip ve 'karar vermeme' itirazlarını yönetmek.", "teori": "Fiyat: değer yeniden kurulur, karşılaştırma bazı netleştirilir, fiyat yerine kapsam konuşulur. Zamanlama: bekleme maliyeti (cost of inaction) hesaplanır. Rakip: karar kriterleri üzerinden konuşulur, rakip kötülenmez. Kararsızlık (JOLT): Judge the indecision, Offer your recommendation, Limit the exploration, Take risk off the table. En iyi itiraz yönetimi, itirazı keşifte önceden ele almaktır.", "pratik": "İtiraz kütüphaneni JOLT ve cost-of-inaction yaklaşımıyla v2'ye güncelle.", "cikti": "İtiraz kütüphanesi v2", "saat": 3, "oncelik": "Kritik", "kaynak": "The JOLT Effect; Objections (Jeb Blount)"}, {"id": "F4.07", "faz": "F4", "fazAd": "Discovery, Değer Satışı & Müzakere", "modul": "Müzakere", "konu": "Müzakere temelleri: BATNA, ZOPA, çıpa", "hedef": "İlkeli müzakerenin temel kavramlarıyla hazırlanmak.", "teori": "Getting to Yes: pozisyon değil çıkar üzerinde müzakere et; seçenek üret; objektif kriter kullan. BATNA: anlaşma olmazsa en iyi alternatif (güç kaynağı). Rezervasyon fiyatı: yürüyüp gideceğin nokta. ZOPA: iki tarafın kabul aralığı. Çıpa (anchor): ilk makul ve gerekçeli teklif aralığı belirler. Hazırlık: kendi ve karşı tarafın BATNA'sı, öncelik listesi, verilebilecek/istenecek tavizler.", "pratik": "Bir sponsorluk veya toptan satış görüşmesi için müzakere hazırlık sayfası doldur.", "cikti": "Müzakere hazırlık sayfası", "saat": 3, "oncelik": "Kritik", "kaynak": "Getting to Yes (Fisher & Ury); Harvard PON"}, {"id": "F4.08", "faz": "F4", "fazAd": "Discovery, Değer Satışı & Müzakere", "modul": "Müzakere", "konu": "Taktiksel empati ve fiyat müzakeresi", "hedef": "Voss tekniklerini ve give-get disiplinini kullanmak.", "teori": "Voss: kalibre sorular ('Bunu nasıl yapmamı beklersiniz?'), suçlama denetimi (karşı tarafın olumsuz düşüncelerini önceden söylemek), etiketleme, 'Bu doğru' anı. Fiyat: taviz asla karşılıksız verilmez (give-get: indirim ↔ daha uzun süre, peşin ödeme, referans, vaka çalışması). Satın alma (procurement) taktikleri: son dakika indirim talebi, rakip teklif baskısı, 'bütçe bu kadar'. İndirim yetki matrisi önceden belirlenir.", "pratik": "Give-get listesi hazırla: verebileceğin 8 taviz ve karşılığında isteyeceğin 8 şey.", "cikti": "Give-get matrisi", "saat": 3, "oncelik": "Kritik", "kaynak": "Never Split the Difference (Chris Voss)"}, {"id": "F4.09", "faz": "F4", "fazAd": "Discovery, Değer Satışı & Müzakere", "modul": "Kapanış", "konu": "Mutual Action Plan (MAP) ve kapanış", "hedef": "Alıcıyla birlikte tarihli ortak plan oluşturarak kapanışı öngörülebilir kılmak.", "teori": "MAP: müşterinin hedef başlangıç tarihinden geriye doğru planlanan adımlar (teknik doğrulama, güvenlik/hukuk incelemesi, satın alma, imza, başlangıç), her adımın sahibi ve tarihi. Hem satıcıyı hem alıcıyı taahhüt altına alır, kağıt sürecini (paper process) görünür kılar ve forecast doğruluğunu artırır.", "pratik": "Açık en büyük fırsatın için müşteriyle paylaşılacak bir MAP hazırla.", "cikti": "Mutual Action Plan", "saat": 3, "oncelik": "Kritik", "kaynak": "Winning by Design – MAP; Andy Whyte – MEDDICC"}, {"id": "F4.10", "faz": "F4", "fazAd": "Discovery, Değer Satışı & Müzakere", "modul": "Kapanış", "konu": "Win/Loss analizi", "hedef": "Kazanılan ve kaybedilen fırsatlardan sistematik öğrenmek.", "teori": "Kapanıştan sonra 2–4 hafta içinde müşteriyle (tercihen üçüncü kişi tarafından) görüşme. Sorular: karar kriterleri neydi, hangi alternatifleri değerlendirdiniz, neden bu karar, süreçte ne eksikti. Bulgular kategorilere ayrılır: ürün, fiyat, satış süreci, ilişki, zamanlama. Sonuçlar mesaja, fiyata ve nitelendirmeye geri beslenir.", "pratik": "Son 3 kazanılan ve 3 kaybedilen fırsat için win/loss görüşmesi yap.", "cikti": "Win/loss raporu", "saat": 3, "oncelik": "Önemli", "kaynak": "Clozd win/loss rehberleri"}, {"id": "F5.01", "faz": "F5", "fazAd": "Sales Ops & CRM", "modul": "Sales Ops Temelleri", "konu": "Sales Ops'un rolü ve kapsamı", "hedef": "Sales Ops'un strateji, süreç, teknoloji, veri ve enablement boyutlarını anlamak.", "teori": "Sales Ops satış ekibinin verimliliğini ve öngörülebilirliğini artıran fonksiyondur: territory ve kota planlama, prim planı, CRM yönetimi, raporlama, forecast süreci, araçlar ve enablement. Sales Ops yalnızca satışa bakar; RevOps pazarlama, satış ve müşteri başarısını tek sistem olarak ele alır.", "pratik": "Kendi işlerinde Sales Ops kapsamındaki işleri listele: kim yapıyor, ne eksik?", "cikti": "Sales Ops boşluk analizi", "saat": 2, "oncelik": "Önemli", "kaynak": "Sales Operations (Mark Donnolo); Pavilion blogu"}, {"id": "F5.02", "faz": "F5", "fazAd": "Sales Ops & CRM", "modul": "CRM", "konu": "CRM temelleri ve veri modeli", "hedef": "CRM nesnelerini ve ilişkilerini doğru kurgulamak.", "teori": "Temel nesneler: Lead (nitelendirilmemiş kişi), Contact (kişi), Account (şirket), Opportunity (satış fırsatı), Activity (görev, arama, e-posta, toplantı), Product/Price Book, Quote. İlişkiler: bir Account'ta çok Contact ve Opportunity; Opportunity'de birden çok Contact Role. Özel alanlar sadece raporlanacak veya süreci yönlendirecekse eklenir.", "pratik": "HubSpot ücretsiz CRM hesabı aç ve kendi işin için veri modelini kur.", "cikti": "Çalışan CRM veri modeli", "saat": 4, "oncelik": "Kritik", "kaynak": "Salesforce Trailhead – CRM Basics; HubSpot Academy – CRM"}, {"id": "F5.03", "faz": "F5", "fazAd": "Sales Ops & CRM", "modul": "CRM", "konu": "Pipeline aşamaları ve çıkış kriterleri", "hedef": "Alıcı doğrulamalı çıkış kriterleriyle pipeline tasarlamak.", "teori": "Her aşamanın: amacı, giriş/çıkış kriteri (alıcının yaptığı doğrulanabilir bir eylem), zorunlu alanlar ve olasılık yüzdesi olmalı. Örnek: 'Discovery tamamlandı' = müşteri problemi ve etkisini doğruladı, ekonomik alıcı belirlendi. Olasılıklar geçmiş verilerle kalibre edilir.", "pratik": "Pipeline aşamalarını çıkış kriterleriyle CRM'e kur; her aşamaya zorunlu alan ekle.", "cikti": "Pipeline konfigürasyonu", "saat": 3, "oncelik": "Kritik", "kaynak": "Winning by Design; Salesforce Trailhead – Opportunity Management"}, {"id": "F5.04", "faz": "F5", "fazAd": "Sales Ops & CRM", "modul": "CRM", "konu": "CRM hijyeni ve veri yönetimi", "hedef": "Güvenilir veriye dayalı karar alınabilecek bir CRM düzeni kurmak.", "teori": "Kurallar: her fırsatta kapanış tarihi, tutar, sonraki adım ve tarihi; geçmiş kapanış tarihli açık fırsat olmaz; duplicate kontrolü; zorunlu alanlar; aktivite kaydı otomasyonu. 'CRM'de yoksa yoktur' kültürü. Aylık veri denetimi.", "pratik": "CRM hijyen kontrol listesi oluştur ve mevcut verini denetle.", "cikti": "Hijyen raporu", "saat": 2, "oncelik": "Önemli", "kaynak": "Salesforce Trailhead – Data Quality"}, {"id": "F5.05", "faz": "F5", "fazAd": "Sales Ops & CRM", "modul": "Pipeline & Forecast", "konu": "Pipeline yönetimi ve pipeline review", "hedef": "Pipeline sağlığını coverage, yaşlanma ve dönüşümle ölçmek.", "teori": "Pipeline coverage = açık pipeline / kalan hedef (genelde 3–4x; win rate'e göre değişir). Yaşlanma: aşamada ortalamadan uzun kalan fırsatlar risklidir. Kayan (slipped) fırsatlar, tek iletişim kişili (single-threaded) fırsatlar, sonraki adımı olmayanlar işaretlenir. Haftalık pipeline review ile forecast görüşmesi ayrı toplantılardır.", "pratik": "Haftalık pipeline review şablonu hazırla ve 4 hafta uygula.", "cikti": "Pipeline review şablonu + 4 haftalık not", "saat": 3, "oncelik": "Kritik", "kaynak": "Clari / Gong pipeline rehberleri"}, {"id": "F5.06", "faz": "F5", "fazAd": "Sales Ops & CRM", "modul": "Pipeline & Forecast", "konu": "Satış tahmini (forecasting)", "hedef": "Kategorili ve yargıya dayalı güvenilir bir forecast yapmak.", "teori": "Kategoriler: Commit (neredeyse kesin), Best Case (iyi giderse), Pipeline, Omitted. Yöntemler: ağırlıklı pipeline (tutar × aşama olasılığı), satıcı yargısı, tarihsel dönüşüm, AI tabanlı. Forecast doğruluğu = gerçekleşen / tahmin. Yöneticinin 'commit' sorusu: 'Bu fırsat bu dönemde kapanmazsa sebebi ne olur?'", "pratik": "3 yöntemle çeyrek tahmini yap ve dönem sonunda doğruluğu karşılaştır.", "cikti": "Forecast modeli", "saat": 3, "oncelik": "Kritik", "kaynak": "Clari blogu; Winning by Design – forecasting"}, {"id": "F5.07", "faz": "F5", "fazAd": "Sales Ops & CRM", "modul": "Planlama", "konu": "Territory, kota ve kapasite planlama", "hedef": "Adil territory'ler ve ulaşılabilir kotalar belirlemek.", "teori": "Territory: coğrafya, dikey, segment veya isimli hesap listesi; potansiyele göre dengelenir. Kota: yukarıdan aşağı (şirket hedefi dağıtımı) ve aşağıdan yukarıya (kapasite × verimlilik) uzlaştırılır. Kapasite planı: satışçı sayısı × ramp süresi × verimlilik × turnover. Sağlıklı sistemde satışçıların çoğunluğu kotanın makul bir yüzdesine ulaşır.", "pratik": "3 satışçılı hayali bir ekip için territory ve kota planı yap.", "cikti": "Kapasite ve kota modeli", "saat": 4, "oncelik": "Önemli", "kaynak": "The Sales Acceleration Formula; Bridge Group raporları"}, {"id": "F5.08", "faz": "F5", "fazAd": "Sales Ops & CRM", "modul": "Planlama", "konu": "Prim / komisyon planı tasarımı", "hedef": "İstenen davranışı teşvik eden bir prim planı kurmak.", "teori": "OTE (hedef toplam kazanç) = sabit + değişken; tipik AE oranı 50/50, SDR 60–70/30–40. Bileşenler: komisyon oranı, hızlandırıcılar (kota üstü), eşik, SPIFF (kısa dönem teşvik), clawback (iptal durumunda geri alma). Kurallar: basit (en fazla 2–3 metrik), şirket hedefiyle uyumlu, satışçının kontrol edebildiği ölçütler.", "pratik": "Bir AE ve bir SDR için prim planı taslağı yaz; 3 performans senaryosunda kazancı hesapla.", "cikti": "Prim planı + senaryo tablosu", "saat": 3, "oncelik": "Önemli", "kaynak": "Compensating the Sales Force (David Cichelli)"}, {"id": "F5.09", "faz": "F5", "fazAd": "Sales Ops & CRM", "modul": "Raporlama", "konu": "Satış raporlama ve dashboard", "hedef": "Öncü ve gecikmeli göstergelerle karar destekleyen dashboard kurmak.", "teori": "Öncü göstergeler (leading): aktivite, yeni pipeline, toplantılar. Gecikmeli göstergeler (lagging): gelir, win rate, kota başarısı. Dashboard katmanları: yönetici (özet), yönetici-ekip (pipeline, forecast), satışçı (kendi aktivite ve fırsatları). Her metrik bir karar veya aksiyonla ilişkilendirilmelidir.", "pratik": "HubSpot/Salesforce'ta 6 raporluk bir satış dashboard'u kur.", "cikti": "Satış dashboard'u", "saat": 3, "oncelik": "Kritik", "kaynak": "Salesforce Trailhead – Reports & Dashboards"}, {"id": "F5.10", "faz": "F5", "fazAd": "Sales Ops & CRM", "modul": "Enablement", "konu": "Sales enablement ve playbook", "hedef": "Satışçıları doğru içerik, bilgi ve beceriyle donatmak.", "teori": "Enablement bileşenleri: onboarding programı (30-60-90), satış playbook'u (ICP, persona, mesaj, süreç, itirazlar, rekabet), battlecard'lar, içerik kütüphanesi, sertifikasyon, koçluk. Başarı ölçütü: ramp süresi, kota başarısı, win rate değişimi.", "pratik": "Kendi işin için 10 sayfalık satış playbook'unun iskeletini oluştur.", "cikti": "Playbook v1", "saat": 4, "oncelik": "Kritik", "kaynak": "Highspot / Seismic enablement rehberleri"}, {"id": "F5.11", "faz": "F5", "fazAd": "Sales Ops & CRM", "modul": "Teknoloji", "konu": "Sales tech stack", "hedef": "Satış araçlarının işlevlerini ve seçim kriterlerini bilmek.", "teori": "Katmanlar: CRM (Salesforce, HubSpot, Pipedrive), veri (Apollo, Lusha, Clay), engagement (Outreach, Salesloft, Apollo, lemlist), konuşma analitiği (Gong, Chorus), toplantı/planlama (Calendly, Chili Piper), CPQ ve e-imza (DocuSign), forecast (Clari), enablement (Highspot). Seçim kriteri: süreç önce, araç sonra; entegrasyon; benimseme.", "pratik": "Mevcut araçlarını haritala ve 12 ay hedef tech stack'ini tasarla (bütçe ile).", "cikti": "Tech stack haritası", "saat": 2, "oncelik": "Önemli", "kaynak": "G2 kategori raporları; Pavilion tech stack anketleri"}, {"id": "F5.12", "faz": "F5", "fazAd": "Sales Ops & CRM", "modul": "Teknoloji", "konu": "Salesforce ve HubSpot'ta uygulamalı kurulum", "hedef": "İki ana CRM'de pipeline, otomasyon ve rapor kurabilecek pratik beceri kazanmak.", "teori": "Trailhead Admin Beginner/Intermediate yolları: nesneler, alanlar, sayfa düzenleri, doğrulama kuralları, Flow otomasyonu, raporlar. HubSpot: pipeline, özellikler, workflow, sekanslar, raporlar. Salesforce Administrator sertifikası piyasada en çok tanınan CRM sertifikasıdır.", "pratik": "Trailhead'de ücretsiz bir Developer Org aç; pipeline, 3 doğrulama kuralı, 1 Flow ve 1 dashboard kur.", "cikti": "Trailhead rozetleri + çalışan org", "saat": 10, "oncelik": "Kritik", "kaynak": "trailhead.salesforce.com; academy.hubspot.com"}, {"id": "F6.01", "faz": "F6", "fazAd": "Revenue Operations (RevOps)", "modul": "RevOps Temelleri", "konu": "RevOps nedir ve neden var?", "hedef": "RevOps'un kapsamını, organizasyonunu ve değer önerisini açıklayabilmek.", "teori": "RevOps; pazarlama ops, satış ops ve müşteri başarısı ops'u tek çatı altında birleştirir. Amaç: tek veri kaynağı, ortak tanımlar, uçtan uca süreç ve sistemlerle gelirin öngörülebilir ve verimli büyümesi. Dört sütun: süreç, veri, teknoloji, insan (enablement). Genelde CRO veya CEO'ya raporlar. Silolar el değiştirme noktalarında sızıntı yaratır; RevOps bu sızıntıları kapatır.", "pratik": "Kendi işlerin için 'gelir sızıntısı' haritası çıkar: lead'ler, fırsatlar ve müşteriler nerede kayboluyor?", "cikti": "Gelir sızıntısı haritası", "saat": 3, "oncelik": "Kritik", "kaynak": "Revenue Operations (Stephen Diorio & Chris Hummel); RevOps Co-op"}, {"id": "F6.02", "faz": "F6", "fazAd": "Revenue Operations (RevOps)", "modul": "RevOps Temelleri", "konu": "Bowtie modeli ve gelir mimarisi", "hedef": "Müşteri yaşam döngüsünü edinme + büyüme olarak tek model üzerinde tasarlamak.", "teori": "Winning by Design'ın Bowtie'ı: sol taraf (Awareness → Education → Selection → Commit) edinme; sağ taraf (Onboarding → Impact → Growth) elde tutma ve büyüme. Her aşama arasında: dönüşüm oranı (CR), hacim (VM) ve süre (Δt). Tekrarlayan gelirde gelirin büyük kısmı sağ taraftan gelir; bu yüzden huninin sadece kapanışta bitmesi yanlış bir modeldir.", "pratik": "Vimex ve deri toptan için bowtie çiz; her aşama için tahmini CR, VM ve Δt yaz.", "cikti": "2 adet bowtie modeli", "saat": 5, "oncelik": "Kritik", "kaynak": "Winning by Design – Revenue Architecture (kitap ve ücretsiz materyaller)"}, {"id": "F6.03", "faz": "F6", "fazAd": "Revenue Operations (RevOps)", "modul": "RevOps Temelleri", "konu": "Birleşik huni, tanımlar ve devir SLA'ları", "hedef": "Tüm ekiplerin aynı dili konuştuğu bir veri sözlüğü ve el değiştirme kuralları kurmak.", "teori": "Veri sözlüğü: MQL, SQL, Opportunity, 'Kazanıldı', aktif müşteri, churn, genişleme gibi terimlerin tek tanımı. Devir SLA'ları: Pazarlama → SDR (yanıt süresi), SDR → AE (toplantı kalitesi kriterleri), AE → CS (onboarding bilgi paketi). Her devir noktası ölçülür ve raporlanır.", "pratik": "10 terimlik bir gelir veri sözlüğü ve 3 devir SLA'sı yaz.", "cikti": "Veri sözlüğü + SLA seti", "saat": 3, "oncelik": "Kritik", "kaynak": "Forrester B2B Revenue Waterfall; RevOps Co-op şablonları"}, {"id": "F6.04", "faz": "F6", "fazAd": "Revenue Operations (RevOps)", "modul": "Birim Ekonomisi", "konu": "CAC ve CAC geri ödeme süresi", "hedef": "Müşteri edinme maliyetini doğru hesaplayıp yorumlamak.", "teori": "CAC = dönemdeki toplam satış + pazarlama maliyeti / yeni müşteri sayısı. Blended CAC (tüm kaynaklar) ve paid CAC (ücretli kanallar) ayrı izlenir. CAC Payback (ay) = CAC / (aylık müşteri başına gelir × brüt marj). Geri ödeme süresi nakit akışı ve büyüme hızını doğrudan etkiler.", "pratik": "Kendi işlerinden biri için son 6 ayın CAC'ını ve payback süresini hesapla (Metrikler sayfası).", "cikti": "CAC hesaplama tablosu", "saat": 3, "oncelik": "Kritik", "kaynak": "a16z / Bessemer SaaS metrik rehberleri; Metrikler sayfası"}, {"id": "F6.05", "faz": "F6", "fazAd": "Revenue Operations (RevOps)", "modul": "Birim Ekonomisi", "konu": "LTV ve LTV:CAC", "hedef": "Müşteri yaşam boyu değerini hesaplayıp edinme harcamasını yönlendirmek.", "teori": "LTV = (müşteri başına ortalama yıllık gelir × brüt marj) / yıllık churn oranı (veya × ortalama müşteri ömrü). LTV:CAC oranı yaygın olarak 3:1 civarı sağlıklı kabul edilir; çok yüksekse büyümeye yetersiz yatırım yapılıyor olabilir. Brüt marj dahil edilmezse LTV şişer. Toptan ticarette tekrar satın alma sıklığı ve sepet büyüklüğü LTV'nin ana sürücüleridir.", "pratik": "Deri toptan için müşteri segmentlerine göre LTV hesapla.", "cikti": "Segment bazlı LTV tablosu", "saat": 3, "oncelik": "Kritik", "kaynak": "Metrikler sayfası; ChartMogul / Baremetrics rehberleri"}, {"id": "F6.06", "faz": "F6", "fazAd": "Revenue Operations (RevOps)", "modul": "Birim Ekonomisi", "konu": "Elde tutma: GRR, NRR, churn", "hedef": "Mevcut müşteri gelirinin sağlığını ölçmek.", "teori": "GRR (Brüt gelir elde tutma) = (Başlangıç geliri − churn − daralma) / başlangıç geliri; en fazla %100. NRR (Net gelir elde tutma) = (Başlangıç + genişleme − churn − daralma) / başlangıç; %100'ün üzeri mevcut müşterilerin tek başına büyüme sağladığı anlamına gelir. Logo churn (müşteri sayısı) ile gelir churn'ü ayrı izlenir.", "pratik": "12 aylık müşteri verinle GRR ve NRR hesapla; churn eden müşterilerin ortak özelliklerini çıkar.", "cikti": "Elde tutma analizi", "saat": 3, "oncelik": "Kritik", "kaynak": "Metrikler sayfası; Gainsight rehberleri"}, {"id": "F6.07", "faz": "F6", "fazAd": "Revenue Operations (RevOps)", "modul": "Birim Ekonomisi", "konu": "Büyüme verimliliği metrikleri", "hedef": "ARR/MRR, magic number, burn multiple, Rule of 40 kavramlarını yorumlamak.", "teori": "MRR/ARR: tekrarlayan gelir. Magic Number = (Bu çeyrek ARR artışı) / geçen çeyrek satış + pazarlama harcaması; ~0,7+ genelde verimli kabul edilir. Burn Multiple = net nakit yakımı / net yeni ARR. Rule of 40 = büyüme % + kâr marjı % ≥ 40. Tekrarlayan olmayan B2B işlerde (toptan) karşılıkları: tekrar sipariş oranı, müşteri başına yıllık ciro, tahsilat süresi (DSO), brüt kâr / satış maliyeti.", "pratik": "Vimex (abonelik) ve deri toptan (sipariş bazlı) için uygun 5'er metrik seç ve tanımla.", "cikti": "İşe özel metrik seti", "saat": 3, "oncelik": "Önemli", "kaynak": "Bessemer State of the Cloud; David Sacks – Burn Multiple"}, {"id": "F6.08", "faz": "F6", "fazAd": "Revenue Operations (RevOps)", "modul": "Huni Analitiği", "konu": "Sales velocity ve huni matematiği", "hedef": "Gelir hızını ve hangi kaldıracın en çok etki yaptığını hesaplamak.", "teori": "Sales Velocity = (Fırsat sayısı × Win rate × Ortalama deal tutarı) / Satış döngüsü (gün). Dört kaldıraç: daha çok fırsat, daha yüksek kazanma oranı, daha büyük deal, daha kısa döngü. Her kaldıraçta %10 iyileşmenin gelir etkisi karşılaştırılarak öncelik belirlenir. Ters huni: hedeften gerekli aktiviteye geri hesap.", "pratik": "Metrikler sayfasındaki velocity hesaplayıcıyla 4 kaldıracın etkisini karşılaştır.", "cikti": "Kaldıraç analizi", "saat": 3, "oncelik": "Kritik", "kaynak": "Metrikler sayfası; HubSpot – Sales Velocity"}, {"id": "F6.09", "faz": "F6", "fazAd": "Revenue Operations (RevOps)", "modul": "Huni Analitiği", "konu": "Atıf (attribution) modelleri", "hedef": "Pipeline ve gelirin hangi kanal ve temaslardan geldiğini doğru yorumlamak.", "teori": "Tek temas: first-touch (ilk temas), last-touch (son temas). Çok temaslı: lineer, zaman azalan, U-shaped (ilk + lead dönüşümü), W-shaped (ilk + lead + fırsat oluşumu). Hiçbiri 'doğru' değildir; her biri bir soruya cevap verir. B2B'de karanlık huni nedeniyle yazılım bazlı attribution + self-reported attribution + deneyler birlikte kullanılır.", "pratik": "Son 20 kazanılmış fırsatın temas geçmişini çıkar ve 3 farklı modelle kanal katkısını hesapla.", "cikti": "Attribution karşılaştırması", "saat": 3, "oncelik": "Önemli", "kaynak": "HubSpot – Attribution Reports; Dreamdata blogu"}, {"id": "F6.10", "faz": "F6", "fazAd": "Revenue Operations (RevOps)", "modul": "Süreç & Sistem", "konu": "Lead-to-account eşleştirme ve routing mimarisi", "hedef": "Gelen talebin doğru hesap sahibine kaybolmadan ulaşmasını sağlamak.", "teori": "Lead'in mevcut bir hesaba ait olup olmadığının eşleştirilmesi (alan adı, şirket adı normalizasyonu), hesap sahipliği kuralları, round-robin ve kapasite bazlı dağıtım, SLA ve eskalasyon. Kötü routing, ABM ve müşteri deneyimini bozar (aynı müşteriyi iki satışçının araması).", "pratik": "Kendi işin için routing akış şemasını çiz.", "cikti": "Routing akış şeması", "saat": 2, "oncelik": "Destek", "kaynak": "LeanData rehberleri"}, {"id": "F6.11", "faz": "F6", "fazAd": "Revenue Operations (RevOps)", "modul": "Süreç & Sistem", "konu": "Deal desk, CPQ ve quote-to-cash", "hedef": "Teklif, onay, sözleşme, faturalama ve tahsilat sürecini hızlandırıp kontrol altına almak.", "teori": "Deal desk: standart dışı deal'lerin (indirim, özel şart) hızlı ve tutarlı onayı. İndirim yetki matrisi (ör. %10'a kadar AE, %20'ye kadar yönetici). CPQ: ürün yapılandırma, fiyatlandırma, teklif. Quote-to-cash: teklif → sözleşme → sipariş → fatura → tahsilat → gelir tanıma. Tahsilat gecikmesi nakit akışını doğrudan etkiler.", "pratik": "İndirim yetki matrisi ve teklif onay akışı tasarla.", "cikti": "Deal desk politikası", "saat": 3, "oncelik": "Önemli", "kaynak": "Salesforce CPQ Trailhead; Pavilion deal desk kaynakları"}, {"id": "F6.12", "faz": "F6", "fazAd": "Revenue Operations (RevOps)", "modul": "Süreç & Sistem", "konu": "Müşteri başarısı operasyonları", "hedef": "Onboarding, sağlık skoru, yenileme ve genişlemeyi sistematik yönetmek.", "teori": "Onboarding: ilk değere ulaşma süresi (time to value). Sağlık skoru: kullanım, destek talepleri, ödeme davranışı, ilişki, NPS. Riskli hesaplara erken müdahale. QBR/EBR: iş sonuçlarını gözden geçirme ve genişleme fırsatı. Yenileme takvimi 90–120 gün önceden yönetilir.", "pratik": "Vimex müşterileri için 5 göstergeli bir sağlık skoru tasarla.", "cikti": "Sağlık skoru modeli", "saat": 3, "oncelik": "Önemli", "kaynak": "Customer Success (Nick Mehta); Gainsight Pulse içerikleri"}, {"id": "F6.13", "faz": "F6", "fazAd": "Revenue Operations (RevOps)", "modul": "Süreç & Sistem", "konu": "RevOps tech stack ve sistem mimarisi", "hedef": "Tek doğru veri kaynağı olan entegre bir gelir sistemi tasarlamak.", "teori": "CRM merkezde 'single source of truth'; pazarlama otomasyonu, engagement, CS platformu, faturalama, ERP entegrasyonları. Veri ambarı (BigQuery/Snowflake) + BI (Looker, Power BI) + reverse ETL (Hightouch, Census) ile ileri analitik. Veri yönetişimi: alan sahipliği, değişiklik yönetimi, erişim yetkileri.", "pratik": "Mevcut sistemlerinin entegrasyon diyagramını çiz, veri akışındaki kopuklukları işaretle.", "cikti": "Sistem mimarisi diyagramı", "saat": 3, "oncelik": "Önemli", "kaynak": "RevOps Co-op; Hightouch blogu"}, {"id": "F6.14", "faz": "F6", "fazAd": "Revenue Operations (RevOps)", "modul": "Analitik", "konu": "RevOps analitiği: kohort, huni ve pipeline üretimi", "hedef": "Excel/SQL ile gelir verisinden içgörü çıkarabilmek.", "teori": "Kohort analizi: aynı dönemde kazanılan müşterilerin zaman içindeki davranışı. Huni analizi: aşama bazlı dönüşüm ve süre. Pipeline üretim analizi: kaynak, segment ve satışçı bazında yeni pipeline. Temel beceriler: pivot tablolar, SUMIFS/COUNTIFS, temel SQL (SELECT, JOIN, GROUP BY).", "pratik": "Satış verinden bir kohort tablosu ve aşama dönüşüm analizi çıkar.", "cikti": "Analitik çalışma kitabı", "saat": 5, "oncelik": "Kritik", "kaynak": "Mode SQL Tutorial; Coursera – Excel/SQL kursları"}, {"id": "F6.15", "faz": "F6", "fazAd": "Revenue Operations (RevOps)", "modul": "Planlama", "konu": "Yıllık GTM ve gelir planlama döngüsü", "hedef": "Hedeften kapasiteye, bütçeden kotaya uzanan planlama sürecini yönetmek.", "teori": "Sıra: yıllık gelir hedefi → kaynak dağılımı (yeni müşteri vs mevcut müşteri) → huni matematiği (gerekli pipeline) → kapasite (satışçı, SDR, pazarlama bütçesi) → territory → kota → prim planı → enablement. Çeyreklik gözden geçirme ile güncellenir.", "pratik": "Bir sonraki yıl için kendi işinde bu sıralamayla 1 sayfalık gelir planı hazırla.", "cikti": "Yıllık gelir planı", "saat": 4, "oncelik": "Kritik", "kaynak": "Winning by Design; Pavilion planlama şablonları"}, {"id": "F6.16", "faz": "F6", "fazAd": "Revenue Operations (RevOps)", "modul": "Planlama", "konu": "RevOps'ta AI ve otomasyon", "hedef": "AI'ı forecast, veri girişi, konuşma analitiği ve agent'larda kullanmak.", "teori": "Uygulamalar: otomatik aktivite kaydı, görüşme özetleri ve CRM güncelleme, deal risk sinyalleri, AI forecast, lead araştırma agent'ları, müşteri destek botları. İlke: önce süreç ve veri kalitesi; AI kötü veriyi daha hızlı kötü karara çevirir. Denetim izi ve insan onayı kritik noktalarda kalmalı.", "pratik": "Kendi süreçlerinde otomatikleştirilebilecek 10 görevi listele ve 2'sini otomatikleştir.", "cikti": "Otomasyon backlog'u + 2 çalışan otomasyon", "saat": 4, "oncelik": "Önemli", "kaynak": "Gong, Clari, HubSpot Breeze dokümanları"}, {"id": "F6.17", "faz": "F6", "fazAd": "Revenue Operations (RevOps)", "modul": "Planlama", "konu": "RevOps olgunluk denetimi ve 30-60-90 plan", "hedef": "Bir şirketin RevOps olgunluğunu değerlendirip iyileştirme planı yapmak.", "teori": "Değerlendirme alanları: tanımlar, veri kalitesi, süreçler, devir noktaları, sistem entegrasyonu, raporlama, forecast doğruluğu, planlama. Her alan 1–5 puanlanır. 30 gün: hızlı kazanımlar ve görünürlük; 60 gün: süreç ve tanım standardizasyonu; 90 gün: otomasyon ve ileri analitik.", "pratik": "Kendi işlerinden biri için RevOps denetimi yap ve 30-60-90 planı yaz.", "cikti": "RevOps denetim raporu", "saat": 4, "oncelik": "Kritik", "kaynak": "RevOps Co-op denetim şablonları"}, {"id": "F7.01", "faz": "F7", "fazAd": "GTM Stratejisi", "modul": "GTM Temelleri", "konu": "GTM stratejisinin bileşenleri", "hedef": "Bir GTM planının tüm parçalarını bir arada düşünebilmek.", "teori": "GTM = kime (pazar/segment/ICP), ne (değer önerisi, ürün/paket), ne fiyata (fiyat modeli), hangi kanaldan (doğrudan/partner/dijital), hangi satış hareketiyle (sales-led, product-led, partner-led), hangi mesajla (konumlandırma) ve nasıl ölçerek (metrikler) satacağın. Bileşenler birbirini kısıtlar: düşük fiyat + saha satışı birim ekonomisini bozar.", "pratik": "Kendi işlerinden biri için 1 sayfalık GTM canvas doldur.", "cikti": "GTM canvas", "saat": 3, "oncelik": "Kritik", "kaynak": "Winning by Design; Reforge GTM içerikleri"}, {"id": "F7.02", "faz": "F7", "fazAd": "GTM Stratejisi", "modul": "GTM Temelleri", "konu": "Pazar ve rekabet analizi", "hedef": "Pazarın yapısını ve rekabet dinamiklerini analiz etmek.", "teori": "Porter'ın 5 gücü (rakipler, yeni girenler, ikameler, tedarikçi gücü, alıcı gücü), rakip haritası (konum, fiyat, segment, güçlü/zayıf yön), gerçek alternatifler (rakip + manuel yöntem + hiçbir şey yapmamak). SWOT tek başına yetersizdir; aksiyon üretmesi için stratejiye bağlanmalıdır.", "pratik": "Vimex'in pazarı için 5 güç analizi ve 6 alternatiflik rakip haritası çıkar.", "cikti": "Rekabet haritası", "saat": 4, "oncelik": "Kritik", "kaynak": "Competitive Strategy (Michael Porter); Playing to Win (Lafley & Martin)"}, {"id": "F7.03", "faz": "F7", "fazAd": "GTM Stratejisi", "modul": "Konumlandırma", "konu": "Konumlandırma (April Dunford yöntemi)", "hedef": "Ürünün pazardaki konumunu sistematik olarak belirlemek.", "teori": "Obviously Awesome'ın 5 bileşeni: (1) Rekabetçi alternatifler (müşteri bizi kullanmasa ne yapardı?), (2) Benzersiz özellikler, (3) Bu özelliklerin sağladığı değer, (4) Bu değeri en çok önemseyen müşteriler, (5) Pazar kategorisi (bağlam). Sıra önemlidir: alternatiflerden başlanır. Kategori seçimi alıcının varsayımlarını belirler.", "pratik": "Dunford'un 10 adımlı sürecini Vimex için uygula.", "cikti": "Konumlandırma dokümanı", "saat": 5, "oncelik": "Kritik", "kaynak": "Obviously Awesome (April Dunford); Sales Pitch (April Dunford)"}, {"id": "F7.04", "faz": "F7", "fazAd": "GTM Stratejisi", "modul": "Konumlandırma", "konu": "Mesaj mimarisi ve satış anlatısı", "hedef": "Konumlandırmayı persona bazlı mesajlara ve satış anlatısına çevirmek.", "teori": "Messaging house: çatı (tek cümle değer önerisi), sütunlar (3 ana değer teması), temel (kanıt noktaları). Satış anlatısı (Dunford'un 'Sales Pitch'i): pazardaki değişim/içgörü → ideal yaklaşım → biz nasıl yapıyoruz → kanıt → sonraki adım. Her persona için mesaj uyarlanır.", "pratik": "Messaging house ve 10 slaytlık satış anlatısı hazırla.", "cikti": "Messaging house + pitch deck", "saat": 4, "oncelik": "Kritik", "kaynak": "Sales Pitch (April Dunford); Andy Raskin – Strategic Narrative"}, {"id": "F7.05", "faz": "F7", "fazAd": "GTM Stratejisi", "modul": "Konumlandırma", "konu": "Kategori ve Crossing the Chasm", "hedef": "Yeni ürünler için benimseme eğrisini ve beachhead stratejisini uygulamak.", "teori": "Benimseme eğrisi: yenilikçiler, erken benimseyenler, erken çoğunluk, geç çoğunluk, geride kalanlar. 'Uçurum' (chasm) erken benimseyenlerden pragmatik erken çoğunluğa geçiştir. Strateji: tek bir niş (beachhead) seç, 'bütün ürünü' (whole product) orada sun, referanslarla yan segmentlere yayıl (bowling alley).", "pratik": "Vimex için beachhead segmenti seç ve gerekçelendir.", "cikti": "Beachhead analizi", "saat": 3, "oncelik": "Önemli", "kaynak": "Crossing the Chasm (Geoffrey Moore)"}, {"id": "F7.06", "faz": "F7", "fazAd": "GTM Stratejisi", "modul": "Fiyat & Paket", "konu": "Fiyatlandırma stratejisi ve paketleme", "hedef": "Değere dayalı fiyat ve paket yapısı kurmak.", "teori": "Yaklaşımlar: maliyet artı, rakip bazlı, değer bazlı. Fiyat metriği (neye göre ücret: kullanıcı, kullanım, şube, çağrı sayısı) değerle birlikte ölçeklenmelidir. Paketleme: good-better-best. Van Westendorp anketi ile kabul edilebilir fiyat aralığı. Toptan işte: hacim kademeleri, ödeme vadesi farkı, sadakat indirimi. İndirim disiplini fiyat algısını korur.", "pratik": "Vimex için 3 paketli fiyat yapısı ve deri toptan için hacim kademeli fiyat listesi tasarla.", "cikti": "Fiyat ve paket tasarımı", "saat": 5, "oncelik": "Kritik", "kaynak": "Monetizing Innovation (Madhavan Ramanujam); Pricing strategy (Simon-Kucher yayınları)"}, {"id": "F7.07", "faz": "F7", "fazAd": "GTM Stratejisi", "modul": "Satış Hareketi", "konu": "GTM hareketleri: sales-led, product-led, partner-led", "hedef": "İşine en uygun satış hareketini ve hibrit modelleri seçmek.", "teori": "Sales-led: yüksek ACV, karmaşık ürün, satışçı odaklı. Product-led (PLG): ürün kendini satar, düşük sürtünme, yüksek hacim; product-led sales (PLS) ile büyük hesaplara satış eklenir. Partner-led: distribütör, bayi, entegratör. Marketing-led ve community-led da mümkündür. Seçim; ACV, ürün karmaşıklığı, alıcı davranışı ve birim ekonomisine göre yapılır.", "pratik": "Her iş kolun için uygun satış hareketini ACV ve karmaşıklığa göre gerekçelendir.", "cikti": "Satış hareketi karar matrisi", "saat": 3, "oncelik": "Kritik", "kaynak": "Product-Led Growth (Wes Bush); OpenView (arşiv) yazıları"}, {"id": "F7.08", "faz": "F7", "fazAd": "GTM Stratejisi", "modul": "Satış Hareketi", "konu": "Kanal ve partner stratejisi", "hedef": "Distribütör, bayi, referral ve marketplace kanallarını tasarlayıp yönetmek.", "teori": "Kanal türleri: referral (yönlendirme ücreti), reseller (yeniden satış marjı), distribütör (stok + lojistik), entegratör/VAR, marketplace. Partner programı: seviyeler, marjlar, eğitim, pazarlama fonu, deal kaydı (kanal çatışmasını önler). Partner seçimi: pazar erişimi, yetkinlik, motivasyon.", "pratik": "Deri toptan veya zeytinyağı ihracatı için bir partner/distribütör programı taslağı hazırla.", "cikti": "Partner programı taslağı", "saat": 4, "oncelik": "Önemli", "kaynak": "Crossbeam – Partner Ecosystem; Jay McBain içerikleri"}, {"id": "F7.09", "faz": "F7", "fazAd": "GTM Stratejisi", "modul": "Satış Hareketi", "konu": "Uluslararası pazara giriş GTM'i", "hedef": "Yeni ülke pazarına giriş için veri odaklı seçim ve giriş modeli belirlemek.", "teori": "Pazar seçimi: pazar büyüklüğü, büyüme, rekabet, gümrük/regülasyon, lojistik, kültürel yakınlık, ödeme riski — ağırlıklı skorlama. Giriş modelleri: doğrudan ihracat, distribütör, ajan, private label, ortak girişim, yerel şube. Lokalizasyon: etiket, sertifika, fiyat, mesaj. Destekler: Ticaret Bakanlığı destekleri, KOSGEB, ihracatçı birlikleri, fuar destekleri, Ticaret Müşavirlikleri.", "pratik": "Zeytinyağı ihracatı için 5 ülkeyi skorlayan bir pazar seçim matrisi kur.", "cikti": "Pazar seçim matrisi", "saat": 5, "oncelik": "Kritik", "kaynak": "trade.gov.tr / Ticaret Bakanlığı; ITC Trade Map; Global Marketing (Hollensen)"}, {"id": "F7.10", "faz": "F7", "fazAd": "GTM Stratejisi", "modul": "Satış Hareketi", "konu": "Lansman ve beachhead: ilk 10 müşteri", "hedef": "Yeni ürün/pazar lansmanında ilk referans müşterileri kazanmak.", "teori": "Founder-led sales: ilk müşterileri kurucu satar, öğrenme en yüksek seviyededir. Design partner'lar: ürünü birlikte şekillendiren erken müşteriler. İlk 10 müşteri benzer segmentten seçilir ki vaka ve referanslar birbirini beslesin. Lansman seviyeleri (tier 1/2/3) ve lansman planı: iç enablement, dış duyuru, kanal hazırlığı.", "pratik": "Vimex için 10 hedef design partner listesi ve teklif şablonu hazırla.", "cikti": "Design partner programı", "saat": 3, "oncelik": "Önemli", "kaynak": "Founder-Led Sales (Pete Kazanjy); The Mom Test (Rob Fitzpatrick)"}, {"id": "F7.11", "faz": "F7", "fazAd": "GTM Stratejisi", "modul": "Satış Hareketi", "konu": "Founder-led sales'ten satış ekibine geçiş", "hedef": "Satışı kurucudan bağımsız, tekrar edilebilir hale getirmek.", "teori": "Geçiş sinyalleri: tekrar edilebilir bir satış hikâyesi, benzer müşterilerde benzer döngü, belgelenmiş süreç. İlk satışçı profili: belirsizliği seven, yaratıcı, 'builder'. İki satışçıyla başlamak (karşılaştırma yapabilmek için) yaygın bir öneridir. Playbook, CRM ve metrikler işe alımdan önce hazır olmalı.", "pratik": "Kendi satış sürecini ilk satışçıya devredecek şekilde belgelenmiş bir 'founder playbook' yaz.", "cikti": "Founder playbook", "saat": 3, "oncelik": "Önemli", "kaynak": "Founding Sales (Pete Kazanjy); The Sales Acceleration Formula"}, {"id": "F7.12", "faz": "F7", "fazAd": "GTM Stratejisi", "modul": "Rekabet", "konu": "Rekabet stratejisi ve battlecard", "hedef": "Rakiplere karşı kazanma stratejisi ve saha araçları hazırlamak.", "teori": "Battlecard: rakibin konumlandırması, güçlü/zayıf yönleri, bizim farklılaştırıcılarımız, tuzak (landmine) soruları (rakibin zayıf olduğu alanı müşteriye sorgulatan sorular), itiraz yanıtları, kazanılmış vaka. Rekabet stratejileri: doğrudan (önden), yan (farklı kriter), bölme (segment), geliştirme (ilişki), savunma.", "pratik": "En güçlü 2 rakibin için battlecard hazırla.", "cikti": "2 battlecard", "saat": 3, "oncelik": "Önemli", "kaynak": "Klue / Crayon battlecard rehberleri"}, {"id": "F7.13", "faz": "F7", "fazAd": "GTM Stratejisi", "modul": "Deney & Ölçüm", "konu": "GTM deneyleri ve iterasyon", "hedef": "GTM hipotezlerini küçük deneylerle test edip ölçeklemek.", "teori": "Deney formatı: hipotez ('X segmentine Y mesajıyla Z kanalından ulaşırsak, 4 haftada A toplantı alırız') → minimum test → metrik → karar (ölçekle/değiştir/durdur). Aynı anda az değişken değiştirilir. GTM fit sinyalleri: tekrar edilebilir kazanım, kabul edilebilir CAC, kısalan döngü, referans veren müşteriler.", "pratik": "3 GTM hipotezi yaz ve birini 4 haftalık deney olarak uygula.", "cikti": "Deney kartları + sonuç", "saat": 4, "oncelik": "Kritik", "kaynak": "Reforge; Lean Analytics (Croll & Yoskovitz)"}, {"id": "F7.14", "faz": "F7", "fazAd": "GTM Stratejisi", "modul": "Deney & Ölçüm", "konu": "Kamu ve ihale satışı (Türkiye)", "hedef": "Kamu kurumlarına ve ihalelere yönelik satış sürecini anlamak.", "teori": "4734 sayılı Kamu İhale Kanunu ve EKAP; ihale türleri (açık, belli istekliler, pazarlık, doğrudan temin). İhale öncesi evre kritik: ihtiyacın tanımlanması, pazar araştırması, fizibilite; tedarikçi bilgi sağlayabilir ama şartnameyi yönlendirme etik ve hukuki sınırlar içindedir. Referans projeler, yerel iş ortakları, belediye/bakanlık bütçe döngüleri, finansman modelleri (hibe, kredi, AB fonları).", "pratik": "Takip ettiğin bir sektörde son 12 ayın EKAP ilanlarını tarayarak ihale takvimi ve rakip analizi çıkar.", "cikti": "İhale fırsat haritası", "saat": 3, "oncelik": "Önemli", "kaynak": "ekap.kik.gov.tr; kik.gov.tr mevzuat"}, {"id": "F8.01", "faz": "F8", "fazAd": "Enterprise & Stratejik Deal Yönetimi", "modul": "Enterprise Dinamikleri", "konu": "Enterprise satışın dinamikleri", "hedef": "Büyük kurumlara satışın farklarını ve risklerini yönetmek.", "teori": "Özellikler: satın alma komitesi, uzun döngü, çok aşamalı onay, güvenlik/hukuk incelemesi, satın alma departmanı, bütçe döngüsü, iç politika. Başarı: multi-threading (çok kişiyle ilişki), şampiyon, iş gerekçesi, MAP, üst yönetim sponsorluğu. Kurum içi konsensüs sağlanmadıkça deal ilerlemez; satıcının rolü konsensüsü kolaylaştırmaktır.", "pratik": "Bir enterprise hedef hesap seç ve satın alma sürecini tahmini aşamalarla çiz.", "cikti": "Hesap satın alma haritası", "saat": 3, "oncelik": "Kritik", "kaynak": "The Challenger Customer; Enterprise Sales yazıları (Jacco van der Kooij)"}, {"id": "F8.02", "faz": "F8", "fazAd": "Enterprise & Stratejik Deal Yönetimi", "modul": "Enterprise Dinamikleri", "konu": "Paydaş haritalama ve multi-threading", "hedef": "Hesaptaki tüm etkili kişileri ve ilişki gücünü görünür kılmak.", "teori": "Harita alanları: kişi, rol (EB, şampiyon, koç, etkileyici, kullanıcı, engelleyici), bize karşı tutumu (destekçi/nötr/karşıt), etkisi (yüksek/düşük), ilişki gücü, kişisel kazanımı. Power/interest matrisi. Tek kişiye bağlı (single-threaded) fırsatlar çok risklidir; hedef kritik rollerin tamamıyla temas.", "pratik": "Açık en büyük fırsatın için paydaş haritası çıkar ve eksik ilişkiler için aksiyon planı yaz.", "cikti": "Paydaş haritası", "saat": 3, "oncelik": "Kritik", "kaynak": "Strategic Selling (Miller Heiman); Metodolojiler sayfası"}, {"id": "F8.03", "faz": "F8", "fazAd": "Enterprise & Stratejik Deal Yönetimi", "modul": "Enterprise Dinamikleri", "konu": "Şampiyon geliştirme", "hedef": "Şampiyon bulmak, test etmek ve iç satış için donatmak.", "teori": "Şampiyon: güç ve etkisi olan, çözümünden kişisel kazanç sağlayacak, bizim adımıza içeride satış yapan kişi. Test: EB'ye erişim sağlıyor mu, iç bilgi paylaşıyor mu, eyleme geçiyor mu? Donatma: iç sunum için 1 sayfalık özet, iş gerekçesi, itiraz yanıtları. Şampiyon ayrılırsa deal risk altındadır; yedek şampiyon geliştirilir.", "pratik": "Mevcut fırsatlarındaki şampiyonları test et ve bir 'şampiyon kiti' hazırla.", "cikti": "Şampiyon kiti", "saat": 3, "oncelik": "Kritik", "kaynak": "Andy Whyte – Champion Building; MEDDICC"}, {"id": "F8.04", "faz": "F8", "fazAd": "Enterprise & Stratejik Deal Yönetimi", "modul": "Hesap Stratejisi", "konu": "Hesap planlama (account planning)", "hedef": "Stratejik hesaplar için çok yıllı büyüme planı hazırlamak.", "teori": "Hesap planı: hesabın stratejisi ve öncelikleri, organizasyon ve ilişki haritası, mevcut satışlar, beyaz alan (whitespace: satılmayan ürün × departman matrisi), hedefler, fırsatlar, riskler, aksiyon planı, üst yönetim sponsorluğu. Çeyreklik güncellenir.", "pratik": "En büyük 1 müşterin için whitespace matrisli hesap planı hazırla.", "cikti": "Hesap planı", "saat": 4, "oncelik": "Kritik", "kaynak": "Key Account Management (Malcolm McDonald)"}, {"id": "F8.05", "faz": "F8", "fazAd": "Enterprise & Stratejik Deal Yönetimi", "modul": "Hesap Stratejisi", "konu": "RFP, RFQ ve ihale yanıt stratejisi", "hedef": "Go/no-go kararıyla kazanılabilir ihalelere odaklanmak.", "teori": "Go/no-go kriterleri: ihaleyi önceden biliyor muyduk, müşteriyle ilişkimiz var mı, şartname bize uygun mu, kazanma şansı, kârlılık. RFP'yi önceden etkilemediysen kazanma olasılığın düşüktür. Yanıt: uyum matrisi, kazanma temaları (win themes), yönetici özeti, fiyat stratejisi, kanıt. Sunum aşamasına hazırlık.", "pratik": "Bir go/no-go skor kartı ve RFP yanıt şablonu hazırla.", "cikti": "Go/no-go kartı + şablon", "saat": 3, "oncelik": "Önemli", "kaynak": "Shipley Proposal Guide; APMP kaynakları"}, {"id": "F8.06", "faz": "F8", "fazAd": "Enterprise & Stratejik Deal Yönetimi", "modul": "Hesap Stratejisi", "konu": "Satın alma (procurement) ve hukuk süreci", "hedef": "Kağıt sürecini öngörülebilir ve hızlı yönetmek.", "teori": "Kağıt süreci: tedarikçi kaydı, güvenlik/KVKK anketleri, hukuk incelemesi (MSA, DPA, SLA), satın alma onayı, PO. Sık müzakere konuları: ödeme vadesi, sorumluluk sınırı, fesih, SLA cezaları, fikri mülkiyet. Standart sözleşme ve önceden hazırlanmış güvenlik dokümanları döngüyü kısaltır.", "pratik": "Standart sözleşme kontrol listesi ve 'satın almaya hazır' doküman paketi hazırla.", "cikti": "Paper process kiti", "saat": 3, "oncelik": "Önemli", "kaynak": "World Commerce & Contracting kaynakları"}, {"id": "F8.07", "faz": "F8", "fazAd": "Enterprise & Stratejik Deal Yönetimi", "modul": "Üst Düzey Satış", "konu": "Üst yönetime satış (executive selling)", "hedef": "C-level ile iş sonuçları üzerinden konuşabilmek.", "teori": "Üst yöneticiler ürünü değil stratejik öncelikleri, riskleri ve finansal sonuçları konuşur. Hazırlık: şirketin stratejik öncelikleri, finansal durumu, sektör trendleri. Toplantı: kısa, içgörü odaklı, net bir talep. Executive brief: 1 sayfa, problem-etki-çözüm-yatırım-sonuç. Kendi üst yönetimini de sürece dahil et (exec-to-exec).", "pratik": "Bir hedef hesap için 1 sayfalık executive brief yaz.", "cikti": "Executive brief", "saat": 3, "oncelik": "Kritik", "kaynak": "Selling to the C-Suite (Nicholas Read & Stephen Bistritz)"}, {"id": "F8.08", "faz": "F8", "fazAd": "Enterprise & Stratejik Deal Yönetimi", "modul": "Üst Düzey Satış", "konu": "Stratejik ortaklık ve sponsorluk deal'leri", "hedef": "Karşılıklı değer yaratan büyük ortaklık ve sponsorluk anlaşmaları yapılandırmak.", "teori": "Sponsor ne satın alır: erişim (hedef kitle), görünürlük, deneyim, veri/lead, itibar. Paket yapısı: seviyeler, haklar (rights), aktivasyon, ölçüm. Ortaklık yapıları: gelir paylaşımı, ortak pazarlama, münhasırlık. Sponsorluk teklifinde ROI ve aktivasyon planı olmadan fiyat konuşmak zayıf konum yaratır. Yenileme sonuç raporuyla kazanılır.", "pratik": "Bir sonraki etkinliğin için sponsor değer önerisi, paket yapısı ve sonuç raporu şablonu hazırla.", "cikti": "Sponsorluk kiti", "saat": 3, "oncelik": "Önemli", "kaynak": "IEG / Sponsorship.com rehberleri"}, {"id": "F8.09", "faz": "F8", "fazAd": "Enterprise & Stratejik Deal Yönetimi", "modul": "Üst Düzey Satış", "konu": "Key Account Management ve genişleme", "hedef": "Mevcut büyük müşterilerle geliri sürdürülebilir şekilde büyütmek.", "teori": "KAM: hesap segmentasyonu (stratejik, kilit, büyüme, bakım), ilişki modeli (papyon → elmas: tek temas noktasından çok katmanlı ilişkiye), QBR/EBR, çapraz ve üst satış, yenileme. Genişleme gerçekleşen değerle başlar: önce değer kanıtlanır, sonra büyütülür.", "pratik": "Müşterilerini KAM segmentlerine ayır ve bir QBR şablonu hazırla.", "cikti": "KAM segmentasyonu + QBR şablonu", "saat": 3, "oncelik": "Önemli", "kaynak": "Key Account Management (McDonald & Woodburn)"}, {"id": "F8.10", "faz": "F8", "fazAd": "Enterprise & Stratejik Deal Yönetimi", "modul": "Üst Düzey Satış", "konu": "Büyük deal'lerde risk yönetimi ve deal inspection", "hedef": "Riskleri erken fark edip deal'i kurtarmak.", "teori": "Kırmızı bayraklar: EB'ye erişim yok, tek iletişim kişisi, müşterinin kendi söylediği bir metrik yok, kapanış tarihi sürekli kayıyor, müşteri MAP'e bağlı kalmıyor, yeni paydaş/yeniden değerlendirme, rakip geç girdi. Deal inspection: MEDDPICC boşlukları + kanıt (müşteri ne yaptı?) + sonraki kritik adım. Kaybedilen deal'i erken bırakmak (qualify out) da bir beceridir.", "pratik": "Bir deal inspection kontrol listesi oluştur ve tüm açık fırsatlara uygula.", "cikti": "Deal inspection raporu", "saat": 3, "oncelik": "Kritik", "kaynak": "Force Management; Clari deal inspection"}, {"id": "F9.01", "faz": "F9", "fazAd": "Satış Liderliği & Ölçekleme", "modul": "Liderlik", "konu": "Satış ekibi kurma ve işe alım", "hedef": "Doğru profili tanımlayıp yapılandırılmış işe alım yapmak.", "teori": "Rol profili: yetkinlikler (merak, disiplin, koçluğa açıklık, iletişim), deneyim uyumu (segment, döngü, ACV). Süreç: yapılandırılmış mülakat, rol oyunu, vaka ödevi, referans. Onboarding: 30-60-90 günlük plan ve ramp hedefleri. Yanlış işe alımın maliyeti yüksektir.", "pratik": "Bir AE için profil, mülakat soruları ve rol oyunu senaryosu hazırla.", "cikti": "İşe alım kiti", "saat": 3, "oncelik": "Önemli", "kaynak": "The Sales Acceleration Formula; Hiring Sales Hunters"}, {"id": "F9.02", "faz": "F9", "fazAd": "Satış Liderliği & Ölçekleme", "modul": "Liderlik", "konu": "Satış koçluğu", "hedef": "Görüşme kaydı ve deal üzerinden sistematik koçluk yapmak.", "teori": "Koçluk türleri: beceri koçluğu (görüşme kaydı incelemesi), deal koçluğu (strateji), pipeline koçluğu (aktivite ve mix). GROW modeli: Goal, Reality, Options, Will. Her seansta tek bir davranışa odaklan. Koçluk ekip performansını artıran en etkili yönetici faaliyetlerinden biridir.", "pratik": "Kendi bir görüşme kaydını GROW modeliyle kendin koçla.", "cikti": "Koçluk notu", "saat": 3, "oncelik": "Önemli", "kaynak": "The Coaching Habit (Michael Bungay Stanier); Cracking the Sales Management Code"}, {"id": "F9.03", "faz": "F9", "fazAd": "Satış Liderliği & Ölçekleme", "modul": "Liderlik", "konu": "Satış yönetimi ritmi (operating cadence)", "hedef": "Haftalık, aylık ve çeyreklik yönetim toplantılarını tasarlamak.", "teori": "Haftalık: 1:1 (kişisel gelişim + pipeline), ekip toplantısı, pipeline review, forecast görüşmesi. Aylık: metrik gözden geçirme, win/loss. Çeyreklik: QBR (iş sonuçları, plan), territory ve kota gözden geçirme. Her toplantının amacı, girdisi ve çıktısı yazılıdır; aynı veriye dayanır.", "pratik": "Kendi işin için yönetim ritmi takvimi ve her toplantı için gündem şablonu hazırla.", "cikti": "Operating cadence dokümanı", "saat": 2, "oncelik": "Önemli", "kaynak": "Cracking the Sales Management Code (Jordan & Vazzana)"}, {"id": "F9.04", "faz": "F9", "fazAd": "Satış Liderliği & Ölçekleme", "modul": "Liderlik", "konu": "Satış kültürü, motivasyon ve performans yönetimi", "hedef": "Yüksek performanslı ve etik bir satış kültürü kurmak.", "teori": "Kültür bileşenleri: şeffaf metrikler, öğrenme (win/loss, koçluk), ekip içi paylaşım, doğru teşvikler. Performans yönetimi: beklentilerin netliği, erken uyarı, gelişim planı. Etik sınırlar: aşırı vaat, baskıcı satış, müşteriyi yanıltma kısa vadede kazandırır, uzun vadede itibar ve churn maliyeti yaratır.", "pratik": "Satış ekibin (veya gelecekteki ekibin) için 5 maddelik 'nasıl satarız' ilkeleri yaz.", "cikti": "Satış ilkeleri", "saat": 2, "oncelik": "Destek", "kaynak": "Pavilion CRO School içerikleri"}, {"id": "F9.05", "faz": "F9", "fazAd": "Satış Liderliği & Ölçekleme", "modul": "Liderlik", "konu": "CRO bakış açısı ve yönetim kurulu raporlaması", "hedef": "Gelir fonksiyonunu yönetim kurulu düzeyinde raporlamak.", "teori": "CRO sorumluluğu: yeni gelir + mevcut gelir + verimlilik. Kurul raporu: gelir ve plan karşılaştırması, pipeline sağlığı, birim ekonomisi, elde tutma, ekip kapasitesi, riskler ve fırsatlar, bir sonraki çeyrek görünümü. Rakam + anlatı + aksiyon.", "pratik": "Kendi işin için 5 slaytlık çeyreklik gelir raporu hazırla.", "cikti": "Kurul gelir raporu", "saat": 3, "oncelik": "Önemli", "kaynak": "Pavilion CRO School; Bessemer board deck şablonları"}, {"id": "F9.06", "faz": "F9", "fazAd": "Satış Liderliği & Ölçekleme", "modul": "Liderlik", "konu": "AI-native satış organizasyonu", "hedef": "İnsan ve AI agent'larının iş bölümünü tasarlamak.", "teori": "AI agent'lar: araştırma, ilk temas, randevu, not alma, CRM güncelleme, teklif taslağı, müşteri desteği. İnsan: ilişki, keşif, müzakere, stratejik yargı, karmaşık deal'ler. Organizasyon etkisi: SDR rolünün dönüşümü, satışçı başına daha fazla hesap, RevOps'un 'AI operasyonları' sorumluluğu. Risk yönetimi: marka, doğruluk, KVKK.", "pratik": "Vimex deneyimini kullanarak bir 'insan + AI' satış organizasyonu tasarımı yaz.", "cikti": "AI-native org tasarımı", "saat": 3, "oncelik": "Önemli", "kaynak": "Kendi Vimex deneyimin; Gong / HubSpot AI raporları"}, {"id": "F10.01", "faz": "F10", "fazAd": "Capstone Projeleri", "modul": "Capstone", "konu": "Capstone 1 – Uçtan uca outbound motoru", "hedef": "F2 ve F3'ü birleştirerek çalışan bir outbound sistemi kurmak.", "teori": "ICP → hesap listesi → zenginleştirme → sekans → cold call → toplantı → MEDDPICC nitelendirme → CRM. Metrikler haftalık izlenir. Detay Projeler sayfasında.", "pratik": "Projeler sayfasındaki P1'i tamamla.", "cikti": "Çalışan outbound motoru + 4 haftalık rapor", "saat": 12, "oncelik": "Kritik", "kaynak": "Projeler sayfası"}, {"id": "F10.02", "faz": "F10", "fazAd": "Capstone Projeleri", "modul": "Capstone", "konu": "Capstone 2 – RevOps kurulumu ve dashboard", "hedef": "F5 ve F6'yı birleştirerek bir işin gelir operasyonunu kurmak.", "teori": "Veri sözlüğü, pipeline, forecast, birim ekonomisi, dashboard, 30-60-90 plan. Detay Projeler sayfasında.", "pratik": "Projeler sayfasındaki P2'yi tamamla.", "cikti": "RevOps paketi", "saat": 12, "oncelik": "Kritik", "kaynak": "Projeler sayfası"}, {"id": "F10.03", "faz": "F10", "fazAd": "Capstone Projeleri", "modul": "Capstone", "konu": "Capstone 3 – Tam GTM planı", "hedef": "F7'yi uluslararası veya yeni bir pazar için uygulamak.", "teori": "Pazar seçimi, konumlandırma, fiyat, kanal, satış hareketi, lansman ve deney planı. Detay Projeler sayfasında.", "pratik": "Projeler sayfasındaki P3'ü tamamla.", "cikti": "GTM planı + sunum", "saat": 12, "oncelik": "Kritik", "kaynak": "Projeler sayfası"}, {"id": "F10.04", "faz": "F10", "fazAd": "Capstone Projeleri", "modul": "Capstone", "konu": "Capstone 4 – Stratejik deal simülasyonu", "hedef": "F3, F4 ve F8'i gerçek veya simüle bir büyük deal üzerinde uygulamak.", "teori": "Paydaş haritası, MEDDPICC, iş gerekçesi, MAP, müzakere, executive brief. Detay Projeler sayfasında.", "pratik": "Projeler sayfasındaki P4'ü tamamla.", "cikti": "Deal dosyası", "saat": 10, "oncelik": "Kritik", "kaynak": "Projeler sayfası"}], "weeks": [{"hafta": 1, "faz": "F1", "fazAd": "Satışın Temelleri", "konular": ["F1.01", "F1.02", "F1.03", "F1.04"], "saat": 11}, {"hafta": 2, "faz": "F1", "fazAd": "Satışın Temelleri", "konular": ["F1.05", "F1.06", "F1.07", "F1.08"], "saat": 9}, {"hafta": 3, "faz": "F1", "fazAd": "Satışın Temelleri", "konular": ["F1.09", "F1.10", "F1.11", "F1.12"], "saat": 9}, {"hafta": 4, "faz": "F2", "fazAd": "Prospecting & Lead Generation", "konular": ["F2.01", "F2.02", "F2.03", "F2.04", "F2.05"], "saat": 16}, {"hafta": 5, "faz": "F2", "fazAd": "Prospecting & Lead Generation", "konular": ["F2.06", "F2.07", "F2.08", "F2. ", "fazAd": "Capstone Projeleri", "konular": ["F10.02"], "saat": 12}, {"hafta": 41, "faz": "F10", "fazAd": "Capstone Projeleri", "konular": ["F10.03"], "saat": 12}, {"hafta": 42, "faz": "F10", "fazAd": "Capstone Projeleri", "konular": ["F10.04"], "saat": 10}], "methods": [{"ad": "SPIN Selling", "kategori": "Keşif (Discovery)", "koken": "Neil Rackham, Huthwaite – 1988. 12 yılda 35.000+ satış görüşmesinin analizine dayanır.", "ozet": "Büyük ve karmaşık satışlarda başarının, satıcının anlattıklarından çok sorduğu soruların türüne bağlı olduğunu gösterir. Müşterinin örtük ihtiyacını (problem) açık ihtiyaca (çözme isteği) dönüştüren dört aşamalı bir soru dizisidir.", "ne_zaman": "Orta ve büyük tutarlı, danışmanlık gerektiren satışlarda; keşif görüşmelerinde; müşteri problemin farkında ama önemini küçümsüyorsa.", "bilesenler": [{"ad": "S – Situation (Durum)", "aciklama": "Mevcut durumu anlamaya yönelik bilgi soruları. Az ve hazırlıklı sorulmalı; araştırmayla bulunabilecek şeyler sorulmaz. Fazlası müşteriyi sıkar."}, {"ad": "P – Problem", "aciklama": "Zorluk, memnuniyetsizlik ve problemleri ortaya çıkaran sorular. Örtük ihtiyaçları (implied needs) açar."}, {"ad": "I – Implication (Etki)", "aciklama": "Problemin sonuçlarını, yayılımını ve maliyetini büyüten sorular. Rackham'a göre büyük satışta başarının en güçlü belirleyicisidir. Problemi 'küçük rahatsızlık'tan 'çözülmesi gereken iş sorunu'na çevirir."}, {"ad": "N – Need-payoff (İhtiyaç-Karşılık)", "aciklama": "Müşterinin çözümün değerini kendi ağzıyla söylemesini sağlayan sorular. Açık ihtiyacı (explicit need) oluşturur ve müşteri kendini ikna eder."}], "ornek": ["S: Şu an müşteri geri aramalarını kim, hangi sıklıkla yapıyor?", "P: Reçete yenileme zamanı gelen hastaları takip etmekte zorlandığınız oluyor mu?", "I: Takip edilemeyen bir hasta başka eczaneye gittiğinde aylık ciro kaybı ne kadar oluyor? Bu durum personelinizin iş yükünü nasıl etkiliyor?", "N: Bu hastaların otomatik hatırlatılması sizin için ne ifade ederdi? Geri kazanılan her hasta ciroya nasıl yansır?"], "guclu": "Araştırmaya dayalı; öğrenmesi kolay; müşterinin kendi kendini ikna etmesini sağlar; itirazları azaltır.", "zayif": "Mekanik uygulanırsa sorgu hissi verir; tek başına nitelendirme ve süreç yönetimi sağlamaz; içgörü getirme (Challenger) boyutu zayıftır.", "egzersiz": "Bir ürün seç, her harf için 5 soru yaz. Bir arkadaşla 20 dakikalık rol oyunu yap; I ve N sorularının sayısını say. Hedef: S sorularından fazla I+N sorusu.", "iliski": "MEDDPICC'in 'Identify Pain' ve 'Metrics' harflerini doldurmak için en iyi araçtır. Gap Selling ile aynı amaca hizmet eder."}, {"ad": "MEDDIC / MEDDICC / MEDDPICC", "kategori": "Nitelendirme (Qualification)", "koken": "Jack Napoli ve Dick Dunkel, PTC – 1990'lar. Sonradan MEDDICC (Competition) ve MEDDPICC (Paper Process) eklendi. Andy Whyte'ın kitabıyla yaygınlaştı.", "ozet": "Karmaşık B2B fırsatlarında 'ne biliyoruz, ne bilmiyoruz?' sorusunu yapılandıran nitelendirme çerçevesi. Her harf bir bilgi alanıdır; boş kalan her alan bir risktir. Forecast doğruluğu ve deal inceleme dili olarak enterprise satışta fiili standarttır.", "ne_zaman": "Birden fazla paydaşlı, orta-uzun döngülü, yüksek tutarlı fırsatlarda; deal review ve forecast görüşmelerinde; bir fırsatın gerçek olup olmadığına karar verirken.", "bilesenler": [{"ad": "M – Metrics (Metrikler)", "aciklama": "Müşterinin çözümle elde etmek istediği ölçülebilir iş sonucu. Müşterinin kendi ağzından ve kendi rakamıyla ifade edilmeli (ör. 'Hasta kaybını aylık %15 azaltmak')."}, {"ad": "E – Economic Buyer (Ekonomik Alıcı)", "aciklama": "Bütçeyi harcama ve 'hayır' dediğinde kararı durdurma yetkisi olan kişi. Unvan değil yetki önemlidir. Kendisiyle doğrudan görüşülmüş olmalı."}, {"ad": "D – Decision Criteria (Karar Kriterleri)", "aciklama": "Müşterinin seçeneklerini değerlendireceği teknik, finansal ve ilişkisel kriterler. En iyisi, kriterleri kendi farklılaştırıcılarına doğru şekillendirmektir."}, {"ad": "D – Decision Process (Karar Süreci)", "aciklama": "Kararın hangi adımlarla, kimlerin onayıyla, hangi tarihlerde verileceği (teknik değerlendirme, iş onayı, bütçe onayı)."}, {"ad": "P – Paper Process (Kağıt Süreci)", "aciklama": "Karar verildikten sonra imzaya kadar geçen idari süreç: satın alma, hukuk, güvenlik, tedarikçi kaydı, PO. Deal'lerin son çeyrekte kaymasının en yaygın sebebi."}, {"ad": "I – Identify Pain (Acıyı Tanımla)", "aciklama": "Müşteriyi harekete geçiren iş problemi ve çözülmemesinin sonucu. Acı yoksa aciliyet ve satış yoktur."}, {"ad": "C – Champion (Şampiyon)", "aciklama": "Gücü ve etkisi olan, çözümümüzden kişisel kazanç sağlayacak ve içeride bizim adımıza satış yapan kişi. Koçtan (sadece bilgi veren) farklıdır; test edilmelidir."}, {"ad": "C – Competition (Rekabet)", "aciklama": "Rakip firmalar, müşterinin kendi iç çözümü veya hiçbir şey yapmama seçeneği. Karar kriterleri üzerinden rekabet edilir."}], "ornek": ["M: Bu projenin başarılı olduğunu hangi rakama bakarak söyleyeceksiniz?", "E: Bu bütçenin son onayını kim veriyor? O kişi bu problemi nasıl görüyor?", "DC: Seçenekleri hangi kriterlere göre karşılaştıracaksınız? Hangisi en önemli?", "DP: Bugünden başlangıç tarihine kadar hangi adımlar ve onaylar var?", "PP: Benzer bir tedarikçiyle son sözleşmeniz imzaya kadar ne kadar sürdü, kimler dahil oldu?", "C (Champion): Bu projede sizin için kişisel başarı ne anlama geliyor?"], "guclu": "Riskleri görünür kılar; forecast doğruluğunu artırır; ekip içinde ortak dil sağlar; kötü fırsatlardan erken çıkmayı (qualify out) sağlar.", "zayif": "Küçük ve hızlı satışlarda ağırdır; kontrol listesi gibi doldurulursa anlamını yitirir; 'nasıl sorulacağını' (keşif tekniğini) öğretmez.", "egzersiz": "Açık en büyük 3 fırsatı her harf için 0 (bilinmiyor), 1 (varsayım), 2 (müşteri tarafından doğrulandı) olarak puanla. En düşük 2 harf için bu hafta yapılacak aksiyonu yaz.", "iliski": "Keşif için SPIN/Gap, mesaj için Command of the Message, kapanış için Mutual Action Plan ile birlikte kullanılır."}, {"ad": "BANT (ve ANUM, CHAMP)", "kategori": "Nitelendirme (Qualification)", "koken": "IBM – 1950'ler/60'lar. ANUM ve CHAMP sonraki uyarlamalardır.", "ozet": "Bir lead'in satışa değer olup olmadığını dört kriterle hızla değerlendiren klasik çerçeve. Basit ve hızlıdır, ancak satıcı odaklıdır.", "ne_zaman": "Transactional ve orta ölçekli satışlarda; SDR'ların ilk eleme görüşmelerinde; gelen talebi hızlı sınıflandırırken.", "bilesenler": [{"ad": "B – Budget (Bütçe)", "aciklama": "Müşterinin bu çözüm için ayrılmış veya ayrılabilecek bütçesi var mı?"}, {"ad": "A – Authority (Yetki)", "aciklama": "Karar verici kim, görüştüğümüz kişi karar sürecinin neresinde?"}, {"ad": "N – Need (İhtiyaç)", "aciklama": "Çözmemiz gereken gerçek bir ihtiyaç veya problem var mı?"}, {"ad": "T – Timeline (Zaman)", "aciklama": "Karar ve uygulama ne zaman planlanıyor?"}, {"ad": "CHAMP varyasyonu", "aciklama": "Challenges (zorluklar), Authority, Money, Prioritization. Problemle başlar, bu yüzden daha müşteri odaklıdır."}, {"ad": "ANUM varyasyonu", "aciklama": "Authority, Need, Urgency, Money. Aciliyeti bütçeden önce ele alır."}], "ornek": ["Bu problemi çözmek için bu yıl kaynak ayırmayı planlıyor musunuz?", "Bu kararda sizin dışınızda kimler yer alacak?", "Bu konuyu şimdi gündeme getiren ne oldu?"], "guclu": "Öğrenmesi çok kolay; hızlı eleme; küçük deal'lerde yeterli.", "zayif": "Bütçe çoğu zaman satıştan önce yoktur, değerle yaratılır. Karmaşık satışta yüzeysel kalır. Soruldukça müşteriyi sorguya çekilmiş hissettirebilir.", "egzersiz": "Son 10 gelen talebi BANT ve CHAMP ile puanla; hangisinin sonuçla daha iyi örtüştüğünü karşılaştır.", "iliski": "Büyük deal'lerde yerini MEDDPICC'e bırakır. SDR elemesi için BANT, AE nitelendirmesi için MEDDPICC yaygın bir kombinasyondur."}, {"ad": "Challenger Sale", "kategori": "Mesaj & İçgörü", "koken": "Matthew Dixon ve Brent Adamson, CEB (şimdi Gartner) – 2011. 6.000+ satışçının araştırmasına dayanır.", "ozet": "Satışçıları 5 profile ayırır: Hard Worker, Relationship Builder, Lone Wolf, Reactive Problem Solver, Challenger. Karmaşık satışta yüksek performanslıların çoğu Challenger'dır: müşteriye işi hakkında yeni bir şey öğretir, mesajı kişiye uyarlar ve satış sürecinin kontrolünü alır.", "ne_zaman": "Müşterinin problemi yanlış tanımladığı veya farkında olmadığı durumlarda; ürünün farklılaştığı ama müşterinin bunu henüz değerli bulmadığı pazarlarda; statükoyu kırmak gerektiğinde.", "bilesenler": [{"ad": "Teach (Öğret) – Commercial Teaching", "aciklama": "Müşteriye kendi işi hakkında yeni ve şaşırtıcı bir içgörü sun. İçgörü sonunda senin güçlü yönüne çıkmalı."}, {"ad": "1. Warmer (Isınma)", "aciklama": "Müşterinin yaşadığı zorlukları ondan önce tarif ederek güven kur."}, {"ad": "2. Reframe (Yeniden çerçeveleme)", "aciklama": "Problemi farklı bir açıdan göster: 'Asıl problem X değil, Y.'"}, {"ad": "3. Rational Drowning (Rasyonel boğma)", "aciklama": "Veriyle yeni çerçevenin maliyetini göster."}, {"ad": "4. Emotional Impact (Duygusal etki)", "aciklama": "Benzer bir şirketin hikâyesiyle 'bu bize de oluyor' hissi yarat."}, {"ad": "5. A New Way (Yeni yol)", "aciklama": "Problemi çözmenin yeni yaklaşımını tarif et (henüz ürünü değil)."}, {"ad": "6. Your Solution (Senin çözümün)", "aciklama": "Yeni yolu en iyi senin çözümünün sağladığını göster."}, {"ad": "Tailor (Uyarla)", "aciklama": "Aynı içgörüyü CFO, operasyon müdürü ve kullanıcı için farklı önceliklerle anlat."}, {"ad": "Take Control (Kontrol al)", "aciklama": "Para ve süreç konuşmalarından kaçınma; yapıcı gerilimi yönet; sonraki adımları sen yönlendir."}], "ornek": ["Reframe: 'Çoğu eczane hasta kaybını müşteri memnuniyeti sorunu sanıyor; verilere göre asıl sebep reçete yenileme tarihinin takip edilmemesi.'", "Tailor: Eczane sahibine ciro, teknisyene iş yükü üzerinden anlat."], "guclu": "Farklılaşma yaratır; müşterinin gözünde değer katar; 'no decision' riskini azaltır.", "zayif": "İçgörü üretmek zordur ve pazarlama desteği gerektirir; yanlış uygulanınca kibirli görünebilir; ilişkiyi tamamen göz ardı etmek hatadır.", "egzersiz": "Kendi sektörün için müşterilerin çoğunun yanlış bildiği bir şeyi bul, 6 adımlı commercial teaching akışına dök ve 5 dakikada anlat.", "iliski": "The Challenger Customer kitabı 'Mobilizer' kavramıyla şampiyon (MEDDPICC) seçimini derinleştirir. Command of the Message ile mesaj mimarisi olarak birlikte kullanılır."}, {"ad": "Gap Selling", "kategori": "Keşif (Discovery)", "koken": "Keenan (Jim Keenan), A Sales Growth Company – 2018.", "ozet": "Müşteri ürün satın almaz; mevcut durumu (current state) ile ulaşmak istediği durum (future state) arasındaki boşluğu kapatmak için satın alır. Satıcının işi bu boşluğu netleştirmek ve büyüklüğünü ölçmektir. Boşluk yoksa satış yoktur.", "ne_zaman": "Keşif görüşmelerinde; problem odaklı satışta; müşteri 'ihtiyacımız yok' dediğinde; fiyat itirazı yoğunsa (boşluk küçük görünüyordur).", "bilesenler": [{"ad": "Current State – Fiziksel ortam", "aciklama": "Bugün nasıl yapıyorlar? Hangi araçlar, süreçler, kişiler?"}, {"ad": "Current State – Problemler", "aciklama": "Neyin çalışmadığı ve kök nedenleri."}, {"ad": "Current State – Etki", "aciklama": "Problemlerin iş ve finansal etkisi."}, {"ad": "Current State – Duygular", "aciklama": "Bu durumun kişilere hissettirdikleri (stres, endişe, hayal kırıklığı)."}, {"ad": "Future State", "aciklama": "Problemler çözüldüğünde ulaşılacak durum ve sonuçları."}, {"ad": "The Gap", "aciklama": "İki durum arasındaki fark; ne kadar büyük, ölçülebilir ve acil ise satış o kadar güçlüdür."}], "ornek": ["Bu süreç bugün adım adım nasıl işliyor?", "Bunun kök nedeni sizce ne?", "Bu problem çözülürse 12 ay sonra ne farklı olur?", "Hiçbir şey yapmazsanız ne olur?"], "guclu": "Satışçıyı ürün uzmanlığından problem uzmanlığına taşır; fiyat itirazını azaltır; sade ve güçlü bir zihniyet sağlar.", "zayif": "Süreç ve nitelendirme boyutu sınırlı; çok paydaşlı politik dinamikleri detaylı ele almaz.", "egzersiz": "Bir müşteri için Current State (4 bölüm) / Future State / Gap tablosunu doldur ve boşluğu TL cinsinden ifade et.", "iliski": "SPIN'in problem ve etki sorularıyla aynı amaca hizmet eder; MEDDPICC'in Pain ve Metrics alanlarını besler."}, {"ad": "Sandler Selling System", "kategori": "Süreç & Görüşme Kontrolü", "koken": "David Sandler – 1967. Günümüzde Sandler Training ağı ile yaygın.", "ozet": "Alıcı-satıcı arasındaki güç dengesini eşitleyen, satıcının kovalamadığı, nitelendirdiği bir süreç. 'Hayır' erken alınırsa zaman kazanılır. Temel araç, her görüşmenin başında kurulan Up-Front Contract'tır.", "ne_zaman": "Kovalamaca ve 'düşünüp döneceğiz' döngüsü yaşanan satışlarda; satıcının kontrolü kaybettiği görüşmelerde; tüm görüşmelerin açılışında.", "bilesenler": [{"ad": "1. Bonding & Rapport", "aciklama": "Güven ve iletişim kurmak (DISC davranış stilleri kullanılır)."}, {"ad": "2. Up-Front Contract", "aciklama": "Görüşmenin amacı, süresi, her iki tarafın gündemi ve olası sonuçları ('evet', 'hayır' veya net sonraki adım) konusunda baştan anlaşmak."}, {"ad": "3. Pain", "aciklama": "Acı hunisi (pain funnel): yüzeysel problem → iş etkisi → kişisel etki. Acı yoksa ilerleme olmaz."}, {"ad": "4. Budget", "aciklama": "Yatırım ve problemin çözümü için harcamaya istekli olunan kaynak (zaman, para, efor)."}, {"ad": "5. Decision", "aciklama": "Karar süreci, kimler, hangi kriterlerle, ne zaman."}, {"ad": "6. Fulfillment", "aciklama": "Sadece keşfedilen acıya karşılık gelen çözümü sunmak."}, {"ad": "7. Post-Sell", "aciklama": "Alıcı pişmanlığını ve rakip müdahalesini önlemek; kararı pekiştirmek."}, {"ad": "Teknikler", "aciklama": "Reverse (soruya soruyla karşılık), negatif ters çevirme ('Galiba bu sizin için öncelik değil?'), '30 saniye kuralı'."}], "ornek": ["'Bugün 30 dakikamız var. Ben işinizi anlamak için birkaç soru sormak istiyorum, siz de bizi merak ettiklerinizi sorun. Sonunda uygun görmezseniz rahatça söyleyin; uygunsa bir sonraki adımı konuşuruz. Uygun mu?'", "Pain funnel: 'Biraz daha açar mısınız?' → 'Ne kadar süredir böyle?' → 'Bunu çözmek için ne denediniz?' → 'Bu size neye mal oldu?' → 'Bu konuda kişisel olarak nasıl hissediyorsunuz?'"], "guclu": "Görüşme kontrolü, zaman verimliliği, satıcının özgüveni; 'belki'leri azaltır.", "zayif": "Bazı teknikler manipülatif algılanabilir; kültürel uyarlama gerekir (Türkiye'de fazla doğrudan 'hayır' vurgusu ilişkiyi zedeleyebilir).", "egzersiz": "Sonraki 5 görüşmeye up-front contract ile başla; görüşme sonunda net bir 'evet/hayır/sonraki adım' alıp almadığını kaydet.", "iliski": "Up-front contract her metodolojiyle uyumludur; MEDDPICC ile nitelendirmeyi, SPIN ile keşfi tamamlar."}, {"ad": "Solution Selling", "kategori": "Süreç & Keşif", "koken": "Mike Bosworth (1980'ler, Xerox), sonra Keith Eades – The New Solution Selling.", "ozet": "Ürün yerine müşterinin problemine çözüm satmak. Müşteriyle birlikte 'çözüm vizyonu' oluşturmayı ve bu vizyonu karar vericilere taşımayı hedefler.", "ne_zaman": "Özelleştirilebilir ürün ve hizmetlerde; müşterinin çözümü birlikte tanımlaması gerektiğinde.", "bilesenler": [{"ad": "Pain (Acı)", "aciklama": "Kabul edilmiş kritik iş problemi."}, {"ad": "Vision (Vizyon)", "aciklama": "Müşterinin, çözümün kendisine nasıl yardım edeceğini kendi zihninde canlandırması (9 Blok Vizyon İşleme Modeli: nedenleri keşfet, etkileri keşfet, yetenekleri görselleştir – her biri açık, kontrol, onay sorularıyla)."}, {"ad": "Value (Değer)", "aciklama": "Vizyonun ölçülebilir karşılığı."}, {"ad": "Power (Güç)", "aciklama": "Satın alma gücüne sahip kişiye erişim."}, {"ad": "Pain Chain", "aciklama": "Bir departmandaki acının diğer departmanlara ve üst yönetime nasıl zincirlendiği."}], "ornek": ["'Bu problemin sebepleri nelerdir?' → 'Bu diğer ekipleri nasıl etkiliyor?' → 'Size şu imkân olsaydı … bu yardımcı olur muydu?'"], "guclu": "Danışmanlık zihniyeti; çok departmanlı değer haritası.", "zayif": "Günümüzde alıcılar araştırmayı daha önceden yapıyor; saf 'vizyon oluşturma' yerine içgörü (Challenger) ve nitelendirme (MEDDPICC) ile desteklenmeli.", "egzersiz": "Bir müşteride 3 rol için 'pain chain' çiz.", "iliski": "SPIN ve Gap ile keşfi, Value Selling ile değer ölçümünü paylaşır."}, {"ad": "Command of the Message", "kategori": "Mesaj & Değer", "koken": "Force Management – 2000'ler. Enterprise yazılım şirketlerinde yaygın; MEDDICC ile sıkça eşleştirilir.", "ozet": "Tüm satış ekibinin aynı değer mesajını, müşterinin iş sonuçları diliyle anlatmasını sağlayan bir değer çerçevesi (value framework). Satıcıyı özellik anlatıcısından iş sonucu danışmanına dönüştürür.", "ne_zaman": "Ekip genelinde tutarlı mesaj gerektiğinde; ürün farklılaşmasını müşteri diline çevirmek gerektiğinde; karar kriterlerini şekillendirmek istendiğinde.", "bilesenler": [{"ad": "Önce Senaryoları (Before)", "aciklama": "Müşterinin bugünkü durumu ve problemleri."}, {"ad": "Negatif Sonuçlar", "aciklama": "Problemlerin iş üzerindeki etkisi."}, {"ad": "Sonra Senaryoları (After)", "aciklama": "Çözümden sonraki durum."}, {"ad": "Olumlu İş Sonuçları (PBO)", "aciklama": "Ölçülebilir sonuçlar."}, {"ad": "Gerekli Yetenekler (Required Capabilities)", "aciklama": "Sonuca ulaşmak için gereken yetenekler; karar kriterlerine dönüşmeli."}, {"ad": "Metrikler", "aciklama": "Başarının ölçüsü."}, {"ad": "Nasıl / Neden Daha İyi", "aciklama": "Farklılaştırıcılar ve kanıt noktaları."}, {"ad": "Üç Kritik Soru", "aciklama": "Neden bir şey yapmalı? Neden şimdi? Neden biz?"}], "ornek": ["'Bugün hatırlatma aramaları manuel yapılıyor (önce), bu yüzden hastaların bir kısmı kayboluyor (negatif sonuç). Otomatik ve kişiselleştirilmiş hatırlatmayla (gerekli yetenek) hasta geri dönüşü artar (PBO), bunu aylık geri dönen hasta sayısıyla ölçeriz (metrik).'"], "guclu": "Ekip genelinde tutarlılık; karar kriterlerini şekillendirme; üst yönetimle iş dilinde konuşma.", "zayif": "Resmi eğitimi pahalıdır; pazarlama ve ürün ekiplerinin ortak çalışmasını gerektirir.", "egzersiz": "Kendi ürünün için tek sayfalık value framework doldur ve 3 kişiye anlat; tutarlılığı kontrol et.", "iliski": "MEDDPICC'in Decision Criteria ve Metrics alanlarını doğrudan besler."}, {"ad": "Value Selling Framework", "kategori": "Mesaj & Değer", "koken": "ValueSelling Associates (Julie Thomas) – 1991.", "ozet": "Değeri müşteriyle birlikte tanımlamaya ve ölçmeye odaklanan, basit ve tekrarlanabilir bir çerçeve. Temel formül: Nitelikli Fırsat = İş Problemi × Ayırt Edici Çözüm × Değer × Güç (erişim).", "ne_zaman": "Satışçıların değeri 'iddia ettiği' ama müşterinin 'hesaplamadığı' durumlarda; ROI odaklı alıcılarda.", "bilesenler": [{"ad": "Business Issue (İş problemi)", "aciklama": "Üst düzey, ölçülebilir iş hedefi veya problemi."}, {"ad": "Problems (Problemler)", "aciklama": "İş problemine yol açan operasyonel sebepler."}, {"ad": "Solution (Ayırt edici çözüm)", "aciklama": "Müşterinin problemleri çözmek için gereken yeteneklere ilişkin vizyonu."}, {"ad": "Value (Değer)", "aciklama": "Müşterinin kendi metriğinde ifade ettiği kazanç."}, {"ad": "Power (Güç)", "aciklama": "Karar verme gücü olan kişiye erişim."}, {"ad": "Plan", "aciklama": "Karar sürecine uyumlu ortak plan."}], "ornek": ["'Bu problemi çözmenin değeri sizin hesabınıza göre yıllık ne kadar olur?'"], "guclu": "Basit; ROI ve business case kültürü yaratır.", "zayif": "İçgörü üretme boyutu sınırlıdır.", "egzersiz": "Bir fırsat için Value Prompter'ı doldur ve müşteriyle doğrula.", "iliski": "Command of the Message ile benzer; business case'in temelidir."}, {"ad": "Miller Heiman Strategic Selling", "kategori": "Büyük Hesap & Çok Paydaşlı Satış", "koken": "Robert Miller ve Stephen Heiman – 1985 (The New Strategic Selling). Şimdi Korn Ferry bünyesinde.", "ozet": "Karmaşık, çok paydaşlı satışlarda fırsat stratejisi planlamak için yapılandırılmış yöntem. 'Blue Sheet' ile tüm satın alma etkileri, riskler ve pozisyon analiz edilir.", "ne_zaman": "Çok paydaşlı, uzun döngülü büyük fırsatlarda; ihaleler ve stratejik hesaplarda.", "bilesenler": [{"ad": "Single Sales Objective", "aciklama": "Fırsatın net, ölçülebilir ve tarihli hedefi."}, {"ad": const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TOP = Object.fromEntries(DATA.topics.map(t => [t.id, t]));

/* ---------- state & persistence ---------- */
let state = { topics:{}, steps:{}, notes:{} };
const LS_KEY = "satis-akademisi-v1";
let dbRef = null, saveTimer = null;
function loadLocal(){ try{ const s = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if(s && typeof s === "object") state = Object.assign({topics:{},steps:{},notes:{}}, s); }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function setSync(t){ $("#sync").textContent = t; }
function persist(){
  saveLocal();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if(!dbRef){ setSync("Bu tarayıcıda kaydedildi"); return; }
    try{ await dbRef.set({ topics:state.topics, steps:state.steps, notes:state.notes, updatedAt:new Date().toISOString() }); setSync("Hesabına kaydedildi"); }
    catch(e){ setSync("Bu tarayıcıda kaydedildi"); }
  }, 700);
}
async function initStore(){
  const c = window.claude;
  if(!c || typeof c.use !== "function"){ setSync("Bu tarayıcıda saklanıyor"); return; }
  try{
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    if(!db || !user){ setSync("Bu tarayıcıda saklanıyor"); return; }
    const uid = await user.id();
    if(!uid){ setSync("Bu tarayıcıda saklanıyor"); return; }
    dbRef = db.doc("data/users/" + uid + "/progress");
    const snap = await dbRef.get();
    if(snap.exists){
      const d = snap.data() || {};
      state = { topics: Object.assign({}, d.topics||{}), steps: Object.assign({}, d.steps||{}), notes: Object.assign({}, d.notes||{}) };
      saveLocal(); renderAll(); setSync("Hesabınla senkron");
    } else {
      const hasLocal = Object.keys(state.topics).length || Object.keys(state.steps).length || Object.keys(state.notes).length;
      if(hasLocal) persist(); else setSync("Hesabınla senkron");
    }
  }catch(e){ dbRef = null; setSync("Bu tarayıcıda saklanıyor"); }
}
const st = id => state.topics[id] || "todo";
function setStatus(id, s){ if(s === "todo") delete state.topics[id]; else state.topics[id] = s; persist(); }
const nextStatus = s => s === "todo" ? "doing" : s === "doing" ? "done" : "todo";
const LBL = { todo:"Başlamadı", doing:"Devam ediyor", done:"Tamamlandı" };

function phaseStats(kod){
  const ts = DATA.topics.filter(t => t.faz === kod);
  const done = ts.filter(t => st(t.id) === "done");
  const doing = ts.filter(t => st(t.id) === "doing").length;
  const h = ts.reduce((a,t)=>a+t.saat,0), hd = done.reduce((a,t)=>a+t.saat,0);
  return { n:ts.length, done:done.length, doing, h, hd, p: ts.length ? Math.round(done.length/ts.length*100) : 0 };
}
function overall(){
  const n = DATA.topics.length, d = DATA.topics.filter(t => st(t.id)==="done").length;
  const h = DATA.topics.reduce((a,t)=>a+t.saat,0), hd = DATA.topics.filter(t => st(t.id)==="done").reduce((a,t)=>a+t.saat,0);
  return { n, d, h, hd, p: Math.round(d/n*100) };
}

/* ---------- routing ---------- */
let current = "yol";
function show(view){
  current = view;
  $$("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === view ? "true" : "false"));
  $$(".view").forEach(v => v.hidden = v.id !== "v-" + view);
  window.scrollTo({ top:0 });
}
$$("nav.tabs button").forEach(b => b.addEventListener("click", () => { if(b.dataset.view === "yol") renderYol(); if(b.dataset.view === "proje") renderProje(); show(b.dataset.view); }));

  const o = overall();
  const next = DATA.topics.find(t => st(t.id) === "doing") || DATA.topics.find(t => st(t.id) !== "done");
  const stops = DATA.phases.map((p, i) => {
    const s = phaseStats(p.kod);
    return `<li class="${s.p===100?'done-seg':''}"><button class="stop ${s.p===100?'full':''}" data-phase="${p.kod}" aria-label="${esc(p.ad)}: yüzde ${s.p} tamamlandı">
      <span class="ring" style="--p:${s.p}"><span>${i+1}</span></span>
      <b>${esc(p.ad)}</b><i>Hafta ${esc(p.hafta)}</i></button></li>`;
  }).join("");
  const rows = DATA.phases.map(p => {
    const s = phaseStats(p.kod);
    const heavy = /yoğun/i.test(p.odak) ? `<span class="tag-int">${esc(p.odak)}</span>` : "";
    return `<button class="prow" data-phase="${p.kod}">
      <span class="code">${p.kod}</span>

      <span class="goal">${esc(p.amac)}</span>
      <span class="m"><span class="meter"><i style="width:${s.p}%"></i></span><span class="meterlbl"><span>${s.done}/${s.n} tamam</span><span>%${s.p}</span></span></span>
