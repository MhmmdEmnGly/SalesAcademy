<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Satış Akademisi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F7; --surface:#FFFFFF; --ink:#13213C; --muted:#5B6474; --line:#DCE1E8;
  --accent:#0E7C66; --accent-ink:#FFFFFF; --accent-soft:#D5EEE6; --amber:#B7790B; --amber-soft:#FBEFD3; --crit:#B42318;
  --track:#C9D0DA;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --text:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1322; --surface:#141E33; --ink:#E6EAF2; --muted:#9AA4B8; --line:#25324D;
    --accent:#3CC4A2; --accent-ink:#06231C; --accent-soft:#12372F; --amber:#E9B44C; --amber-soft:#3A2E14; --crit:#F97066; --track:#2E3B57;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1322; --surface:#141E33; --ink:#E6EAF2; --muted:#9AA4B8; --line:#25324D;
  --accent:#3CC4A2; --accent-ink:#06231C; --accent-soft:#12372F; --amber:#E9B44C; --amber-soft:#3A2E14; --crit:#F97066; --track:#2E3B57;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15.5px/1.6 var(--text);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;height:60px}
.brand{font:800 19px/1 var(--display);letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font:500 12px/1.3 var(--text);color:var(--muted);letter-spacing:0;margin-top:3px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500;white-space:nowrap;cursor:pointer}
nav.tabs button:hover{color:var(--ink);background:var(--surface)}
nav.tabs button[aria-selected="true"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 -2px 0 var(--accent)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:760px){.bar{flex-wrap:wrap;height:auto;padding:10px 0;gap:8px}.brand small{display:none}.sync{margin-left:auto}nav.tabs{order:3;flex-basis:100%}}

main{padding:28px 0 80px}
.view[hidden]{display:none}
h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;margin:0}
h2{font-size:26px;font-weight:700;line-height:1.15}
h3{font-size:18px;font-weight:700}
.lede{color:var(--muted);max-width:68ch;margin:8px 0 0}
.section{margin-top:44px}
.section > h2{margin-bottom:6px}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:end}
.hero h1{font-size:clamp(34px,5vw,56px);font-weight:800;line-height:1.02}
.hero p{color:var(--muted);max-width:56ch;margin:14px 0 0}
.big{display:flex;align-items:baseline;gap:14px;justify-content:flex-end}
.big .pct{font:800 clamp(64px,9vw,112px)/.9 var(--display);letter-spacing:-.04em;color:var(--accent)}
.big .lbl{color:var(--muted);font-size:14px;line-height:1.4;max-width:16ch}
@media (max-width:760px){.hero{grid-template-columns:1fr;gap:18px}.big{justify-content:flex-start}}

/* route track */
.route{margin-top:34px;overflow-x:auto;padding:6px 2px 10px}
.route ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(10,minmax(96px,1fr));min-width:980px;position:relative}
.route li{position:relative;padding-top:0}
.route li::before{content:"";position:absolute;top:21px;left:0;right:0;height:4px;background:var(--track)}
.route li:first-child::before{left:50%}
.route li:last-child::before{right:50%}
.route li.done-seg::before{background:var(--accent)}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;background:none;border:0;cursor:pointer;width:100%;padding:0 4px;color:var(--ink)}
.ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--track) 0);position:relative;z-index:1}
.ring span{width:36px;height:36px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font:700 13px/1 var(--display)}
.stop.full .ring span{background:var(--accent);color:var(--accent-ink)}
.stop b{font:600 13px/1.25 var(--text);max-width:15ch}
.stop i{font-style:normal;font-size:12px;color:var(--muted)}
.stop:hover b{color:var(--accent)}

/* next up */
.next{margin-top:30px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:18px 20px}
.next .k{font-size:13px;color:var(--muted)}
.next h3{font-size:19px;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (max-width:640px){.next{grid-template-columns:1fr}}

/* phase table */
.phases{margin-top:16px;border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:52px 1.3fr 2fr 170px;gap:18px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--ink)}
.prow:hover{background:var(--surface)}
.prow .code{font:800 20px/1 var(--display);color:var(--muted)}
.prow .nm{font-weight:600}
.prow .nm small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.prow .goal{color:var(--muted);font-size:14px}
.meter{height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.meterlbl{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between}
.tag-int{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--amber-soft);color:var(--amber);margin-left:6px;font-weight:500}
@media (max-width:760px){.prow{grid-template-columns:40px 1fr}.prow .goal{grid-column:2}.prow .m{grid-column:1/-1}}

/* weeks */
.weeks{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.week header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.week header b{font:700 15px var(--display)}
.week header span{font-size:12px;color:var(--muted)}
.week ul{list-style:none;margin:0;padding:0;font-size:13.5px}
.week li{padding:3px 0;display:flex;gap:8px;align-items:flex-start}
.week li button{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
.week li button:hover{color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--track);flex:none;margin-top:6px}
.dot.doing{border-color:var(--amber);background:var(--amber-soft)}
.dot.done{border-color:var(--accent);background:var(--accent)}
.week li.done button{color:var(--muted);text-decoration:line-through}

/* curriculum */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 8px}
.search{flex:1 1 240px;min-width:200px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 12px}
select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.count{font-size:13px;color:var(--muted);margin-top:4px}
.phase-block{margin-top:34px}
.phase-block > header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.phase-block > header .c{font:800 30px/1 var(--display);color:var(--accent)}
.phase-block > header h2{font-size:24px}
.phase-block > header .w{color:var(--muted);font-size:14px;margin-left:auto}
.mod{margin-top:18px}
.mod h4{margin:0 0 4px;font:600 14px/1.3 var(--text);color:var(--muted)}
.topic{border-bottom:1px solid var(--line)}
.trow{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:11px 2px}
.st{width:28px;height:28px;border-radius:50%;border:2px solid var(--track);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.st.doing{border-color:var(--amber);background:conic-gradient(var(--amber) 50%, var(--surface) 0)}
.st.done{border-color:var(--accent);background:var(--accent)}
.st svg{width:14px;height:14px;display:none}
.st.done svg{display:block}
.topen{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink);font-weight:500;font-size:15.5px}
.topen:hover{color:var(--accent)}
.topic.done .topen{color:var(--muted)}
.tmeta{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);white-space:nowrap}
.pr{padding:1px 8px;border-radius:99px;font-weight:500}
.pr.Kritik{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.pr.Önemli{background:var(--amber-soft);color:var(--amber)}
.pr.Destek{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.tdet{display:grid;grid-template-columns:1.25fr 1fr;gap:10px 28px;padding:4px 0 20px 46px}
.tdet[hidden]{display:none}
.tdet .blk h5{margin:10px 0 3px;font:600 13px/1.3 var(--text);color:var(--muted)}
.tdet .blk p{margin:0;max-width:72ch}
.tdet .full{grid-column:1/-1}
.practice{background:var(--accent-soft);border-radius:10px;padding:12px 14px}
.practice h5{color:var(--accent)!important;margin-top:0!important}
textarea.note{width:100%;min-height:70px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:8px 10px;resize:vertical}
.stsel{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
@media (max-width:760px){.tdet{grid-template-columns:1fr;padding-left:0}.trow{grid-template-columns:34px 1fr}.tmeta{grid-column:2}}

.lesson{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.lesson h4{margin:0 0 8px;font:700 18px/1.2 var(--display)}
.lesson p{margin:0 0 12px;max-width:72ch;line-height:1.7}
.daily{margin-top:6px;background:var(--amber-soft);border-left:4px solid var(--amber);border-radius:10px;padding:12px 16px;max-width:78ch}
.daily h5{margin:0 0 4px!important;font:600 13px/1.3 var(--text);color:var(--amber)!important}
.daily p{margin:0}
.nolesson{margin:14px 0 0;font-size:13.5px;color:var(--muted)}
.hasl{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500}
/* methods */
.matrix{margin-top:16px;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.matrix table{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
.matrix th,.matrix td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix thead th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--paper)}
.matrix td button{background:none;border:0;padding:0;cursor:pointer;color:var(--ink);text-align:left;font-weight:500}
.matrix td button:hover{color:var(--accent)}
.fit2{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--accent)}
.fit1{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:8px;align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.mgrid{display:grid;grid-template-columns:260px 1fr;gap:28px;margin-top:26px;align-items:start}
.mlist{position:sticky;top:84px;display:flex;flex-direction:column;border-left:2px solid var(--line)}
.mlist button{background:none;border:0;text-align:left;padding:7px 12px;cursor:pointer;color:var(--muted);margin-left:-2px;border-left:2px solid transparent;font-size:14.5px}
.mlist button small{display:block;font-size:12px;opacity:.85}
.mlist button:hover{color:var(--ink)}
.mlist button[aria-current="true"]{color:var(--ink);border-left-color:var(--accent);font-weight:600}
.mdet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 28px}
.mdet h2{font-size:32px}
.mdet .cat{display:inline-block;margin-top:8px;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.mdet .origin{color:var(--muted);font-size:14px;margin-top:10px}
.mdet .sum{font-size:17px;line-height:1.6;margin:16px 0 0;max-width:70ch}
.mdet h3{margin:26px 0 10px;font-size:17px}
.comps{display:grid;gap:0;border-top:1px solid var(--line)}
.comp{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:18px;padding:12px 0;border-bottom:1px solid var(--line)}
.comp b{font-family:var(--display);font-weight:700;font-size:15.5px}
.comp p{margin:0}
.examples{margin:0;padding:0;list-style:none}
.examples li{padding:10px 14px;border-radius:10px;background:var(--paper);margin-bottom:8px;font-size:14.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two > div{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.two h4{margin:0 0 4px;font:600 14px var(--text)}
.two .g h4{color:var(--accent)} .two .z h4{color:var(--crit)}
.two p{margin:0;font-size:14.5px}
@media (max-width:860px){.mgrid{grid-template-columns:1fr}.mlist{position:static;flex-direction:row;overflow-x:auto;border-left:0;border-bottom:2px solid var(--line)}.mlist button{border-left:0;border-bottom:2px solid transparent;margin:0 0 -2px;white-space:nowrap}.mlist button small{display:none}.mlist button[aria-current="true"]{border-bottom-color:var(--accent)}.comp{grid-template-columns:1fr;gap:4px}.two{grid-template-columns:1fr}.mdet{padding:20px}}

/* calculator */
.calc{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:18px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.inputs label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.inputs input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums;color:var(--ink);font-size:15px}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.out{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.out .v{font:700 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.out .n{font-size:13px;color:var(--muted);margin-top:4px}
.out.warn .v{color:var(--crit)} .out.good .v{color:var(--accent)}
.gloss{margin-top:16px;border-top:1px solid var(--line)}
.gl{display:grid;grid-template-columns:230px 1fr 1fr;gap:16px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.gl b{font-weight:600}
.gl code{font-family:var(--text);background:var(--paper);padding:2px 6px;border-radius:6px;font-size:13.5px}
.gl span{color:var(--muted)}
@media (max-width:860px){.calc{grid-template-columns:1fr}.gl{grid-template-columns:1fr;gap:4px}}
@media (max-width:480px){.inputs,.outs{grid-template-columns:1fr}}

/* projects */
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;margin-top:18px}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.proj .pk{font:800 14px var(--display);color:var(--accent)}
.proj h3{font-size:20px;margin-top:2px}
.proj .area{font-size:13.5px;color:var(--muted);margin-top:4px}
.proj p{margin:10px 0 12px;font-size:14.5px}
.steps{list-style:none;margin:12px 0 0;padding:0}
.steps li{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14.5px;align-items:flex-start}
.steps input{margin-top:5px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.steps li.ok span{color:var(--muted);text-decoration:line-through}
.pfoot{font-size:13px;color:var(--muted);margin-top:12px}

/* resources */
.res{margin-top:16px;border-top:1px solid var(--line)}
.rrow{display:grid;grid-template-columns:110px 1.3fr 2fr;gap:18px;padding:14px 0;border-bottom:1px solid var(--line)}
.rrow .t{font-size:13px;font-weight:600;color:var(--muted)}
.rrow h4{margin:0;font:600 15.5px/1.35 var(--text)}
.rrow h4 a{color:var(--ink);text-decoration-color:var(--accent);text-underline-offset:3px}
.rrow h4 a:hover{color:var(--accent)}
.rrow .by{font-size:13px;color:var(--muted);margin-top:2px}
.rrow .facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rrow .facts span{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.rrow p{margin:0;font-size:14.5px}
@media (max-width:760px){.rrow{grid-template-columns:1fr;gap:6px}}

.empty{padding:30px 0;color:var(--muted)}
.foot{margin-top:60px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <div class="brand">Satış Akademisi<small>Temelden stratejik iş geliştirmeye</small></div>
    <nav class="tabs" role="tablist" aria-label="Bölümler">
      <button role="tab" data-view="yol" aria-selected="true">Yol haritası</button>
      <button role="tab" data-view="mufredat" aria-selected="false">Müfredat</button>
      <button role="tab" data-view="metod" aria-selected="false">Metodolojiler</button>
      <button role="tab" data-view="metrik" aria-selected="false">Metrikler</button>
      <button role="tab" data-view="proje" aria-selected="false">Projeler</button>
      <button role="tab" data-view="kaynak" aria-selected="false">Kaynaklar</button>
    </nav>
    <div class="sync" id="sync" aria-live="polite">Yükleniyor…</div>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-yol"></section>
  <section class="view" id="v-mufredat" hidden></section>
  <section class="view" id="v-metod" hidden></section>
  <section class="view" id="v-metrik" hidden></section>
  <section class="view" id="v-proje" hidden></section>
  <section class="view" id="v-kaynak" hidden></section>
  <p class="foot">İlerlemen hesabınla kaydedilir; hesap bağlantısı yoksa bu tarayıcıda saklanır. Aynı içerik Excel dosyasında da var.</p>
</main>

<script>
const DATA = {"phases": [{"kod": "F1", "ad": "Satışın Temelleri", "hafta": "1–3", "amac": "Satışın dilini, alıcı psikolojisini ve temel görüşme becerilerini oturtmak.", "odak": "Temel"}, {"kod": "F2", "ad": "Prospecting & Lead Generation", "hafta": "4–9", "amac": "Doğru müşteriyi tanımlamak ve sistematik olarak nitelikli lead / toplantı üretmek.", "odak": "Yoğun"}, {"kod": "F3", "ad": "Satış Metodolojileri", "hafta": "10–13", "amac": "SPIN, MEDDPICC, Challenger, Sandler vb. yöntemleri derinlemesine öğrenip kendi 'metodoloji yığınını' kurmak.", "odak": "Yoğun"}, {"kod": "F4", "ad": "Discovery, Değer Satışı & Müzakere", "hafta": "14–16", "amac": "Acıyı paraya çevirmek, teklif/iş gerekçesi yazmak, müzakere edip kapatmak.", "odak": "Temel"}, {"kod": "F5", "ad": "Sales Ops & CRM", "hafta": "17–19", "amac": "Pipeline, forecast, kota, prim ve CRM'i bir sistem olarak yönetmek.", "odak": "Yoğun"}, {"kod": "F6", "ad": "Revenue Operations (RevOps)", "hafta": "20–25", "amac": "Pazarlama, satış ve müşteri başarısını tek gelir motoru olarak tasarlamak ve ölçmek.", "odak": "Çok yoğun"}, {"kod": "F7", "ad": "GTM Stratejisi", "hafta": "26–31", "amac": "Pazar, konumlandırma, fiyat, kanal ve satış hareketini içeren go-to-market planı kurmak.", "odak": "Çok yoğun"}, {"kod": "F8", "ad": "Enterprise & Stratejik Deal Yönetimi", "hafta": "32–35", "amac": "Çok paydaşlı büyük deal'leri, ihaleleri ve kilit hesapları yönetip kapatmak.", "odak": "Yoğun"}, {"kod": "F9", "ad": "Satış Liderliği & Ölçekleme", "hafta": "36–38", "amac": "Ekip kurmak, koçluk yapmak, yönetim ritmi ve AI-native satış organizasyonu tasarlamak.", "odak": "Temel"}, {"kod": "F10", "ad": "Capstone Projeleri", "hafta": "39–42", "amac": "Öğrenilen her şeyi kendi işlerinde uçtan uca uygulamak ve portföy oluşturmak.", "odak": "Uygulama"}], "topics": [{"id": "F1.01", "faz": "F1", "fazAd": "Satışın Temelleri", "modul": "Satışın Temelleri", "konu": "Satış türleri: transactional, consultative, enterprise", "hedef": "Satış hareketlerini ayırt edip her birine uygun yaklaşımı seçebilmek.", "teori": "Transactional: düşük tutar, kısa döngü, tek karar verici, hız ve hacim önemli. Consultative: ihtiyaç keşfi, orta döngü, çözüm uyarlama. Enterprise/complex: 5–10+ paydaş, 3–18 ay döngü, satın alma komitesi, risk yönetimi. B2B'de karar rasyonel + politik, B2C'de bireysel + duygusaldır. Satış hareketini deal büyüklüğü (ACV), döngü süresi ve karar verici sayısı belirler.", "pratik": "Kendi işlerini (deri toptan, Vimex, sponsorluk) bu sınıflamaya yerleştir; her biri için ortalama deal tutarı, döngü süresi ve karar verici sayısını yaz.", "cikti": "1 sayfalık 'Satış Hareketi Haritası'", "saat": 3, "oncelik": "Kritik", "kaynak": "The Challenger Sale (bölüm 1); HubSpot Academy – Sales Training", "anlatim": ["Her satış aynı şekilde yapılmaz. Nasıl satacağını üç şey belirler: deal'in büyüklüğü, kararın ne kadar sürdüğü ve kararı kaç kişinin verdiği. Bu üç değişkene bakarak satışı üç ana türe ayırabiliriz.", "Transactional (işlemsel) satışta tutar düşük, karar hızlı ve genelde tek kişiye aittir. Burada kazandıran şey hız, erişilebilirlik ve hacimdir. Müşteri ne istediğini zaten biliyordur; senin işin onu yormadan sonuca götürmektir. Uzun keşif görüşmeleri burada müşteriyi kaçırır.", "Consultative (danışmanlık) satışta müşteri problemini hisseder ama çözümün tam olarak ne olması gerektiğini bilmez. Burada soru sorma, ihtiyacı netleştirme ve çözümü müşteriye göre uyarlama öne çıkar. Döngü haftalar sürer, karara 2–3 kişi katılır.", "Enterprise (karmaşık) satışta ise tutar yüksektir, karara 5–10 kişi katılır ve süreç aylar sürer. Artık tek bir kişiyi ikna etmiyorsun; bir kurumun içinde fikir birliği oluşturulmasına yardım ediyorsun. Risk algısı yüksektir, bu yüzden güven, kanıt ve süreç yönetimi belirleyici olur. En sık yapılan hata, enterprise bir deal'i transactional gibi satmaya çalışmak (hızlı fiyat ver, kapat) ya da tersine küçük bir satışı gereksiz süreçle boğmaktır."], "ornek": "Markete ekmek almaya gidiyorsun: kimse sana 'ekmekle hangi problemi çözmek istiyorsunuz?' diye sormaz, hızlıca alırsın (transactional). Eve kombi aldığında satıcı evin metrekaresini, oda sayısını, faturalarını sorar ve sana uygun modeli önerir (consultative). Aile olarak ev aldığınızda ise eşin, ebeveynler, banka, ekspertiz ve tapu devreye girer; aylar süren, çok kişili bir karar verilir (enterprise). Üçünde de 'satış' var ama satıcının doğru davranışı tamamen farklı."}, {"id": "F1.02", "faz": "F1", "fazAd": "Satışın Temelleri", "modul": "Satışın Temelleri", "konu": "Satış organizasyonu ve roller", "hedef": "SDR/BDR, AE, SE, AM, CSM, Sales Ops, RevOps, CRO rollerini ve aralarındaki devir teslimleri bilmek.", "teori": "SDR/BDR: lead nitelendirme ve toplantı üretimi. AE: fırsatı kapatma. SE/Presales: teknik keşif ve demo. AM/KAM: mevcut hesabı büyütme. CSM: benimseme ve yenileme. Sales Ops/RevOps: süreç, veri, sistem. Hunter (yeni müşteri) / farmer (mevcut müşteri) ayrımı ve 'pod' yapısı (SDR+AE+SE+CSM) uzmanlaşmanın verimliliğini artırır ama devir teslim noktalarında bilgi kaybı riski doğurur.", "pratik": "Vimex için ideal satış organizasyonunu çiz: bugün kim hangi rolü oynuyor, 12 ay sonra hangi roller gerekir?", "cikti": "Organizasyon şeması + rol tanımları", "saat": 2, "oncelik": "Önemli", "kaynak": "Predictable Revenue (Aaron Ross); From Impossible to Inevitable", "anlatim": ["Satış büyüdükçe tek kişinin her işi yapması verimsizleşir. Bu yüzden satış organizasyonları işi uzmanlıklara böler. Bu bölünmeyi bilmek, hem kendi işini organize etmende hem de ileride ekip kurarken işine yarar.", "SDR/BDR yeni potansiyel müşteri bulur ve ilk toplantıyı ayarlar; SDR genelde gelen talebi (inbound), BDR dışarı doğru aramayı (outbound) yürütür. AE (Account Executive) toplantıdan sonra fırsatı yönetip kapatır. SE/Presales teknik soruları yanıtlar ve demo yapar. AM/KAM mevcut müşteriyi büyütür, CSM ise müşterinin üründen gerçekten değer almasını ve yenilemesini sağlar. Sales Ops ve RevOps bu ekiplerin arkasındaki süreci, veriyi ve sistemleri kurar.", "Bu yapının avantajı uzmanlaşmadır: iyi bir avcı (hunter) yeni müşteri bulmada, iyi bir çiftçi (farmer) ilişkiyi büyütmede daha verimlidir. Dezavantajı ise el değiştirme noktalarıdır. Müşteri SDR'a anlattığını AE'ye tekrar anlatmak zorunda kalıyorsa bilgi kaybı var demektir.", "Küçük bir işte bu rollerin hepsini aynı kişi yapabilir. Önemli olan, hangi şapkayı taktığının farkında olmak ve her rolün işini ayrı ayrı ölçebilmektir."], "ornek": "Bir restoranı düşün: kapıdaki görevli seni karşılayıp masaya oturtur (SDR), garson siparişini alır ve ne yiyeceğine karar vermene yardım eder (AE), mutfaktaki şef teknik işi yapar (SE), müdür düzenli müşterileri tanır ve özel günlerde ilgilenir (KAM/CSM). Garson siparişi mutfağa yanlış iletirse yemek ne kadar iyi olursa olsun müşteri memnun kalmaz. Satıştaki el değiştirme problemi tam olarak budur."}, {"id": "F1.03", "faz": "F1", "fazAd": "Satışın Temelleri", "modul": "Satışın Temelleri", "konu": "B2B alıcı psikolojisi ve satın alma süreci", "hedef": "Kurumların nasıl satın aldığını, karar birimini ve 'karar vermeme' riskini anlamak.", "teori": "Gartner'a göre B2B alıcılar 6 'iş' yürütür: problem tanımlama, çözüm keşfi, gereksinim oluşturma, tedarikçi seçimi, doğrulama, konsensüs. Karar birimi (DMU): ekonomik alıcı, şampiyon, etkileyici, kullanıcı, engelleyici, kapı bekçisi. Kayıptan kaçınma ve statüko yanlılığı yüzünden en büyük rakip çoğu zaman 'hiçbir şey yapmamak'tır (no decision). Alıcılar zamanlarının küçük bir kısmını satıcılarla geçirir; bu yüzden satıcının görevi alıcının iç konsensüsünü kolaylaştırmaktır.", "pratik": "Son kaybettiğin/uzayan 2 fırsatı DMU rolleriyle yeniden analiz et: kimi hiç tanımadın?", "cikti": "DMU analizi (2 fırsat)", "saat": 3, "oncelik": "Kritik", "kaynak": "The JOLT Effect (Dixon & McKenna); Gartner B2B Buying Journey", "anlatim": ["B2B'de 'müşteri' tek bir kişi değil, kararı birlikte veren bir gruptur. Buna karar birimi (DMU) denir. İçinde parayı onaylayan ekonomik alıcı, çözümü kullanacak kişiler, teknik açıdan değerlendiren kişiler, seni içeride destekleyen şampiyon ve süreci durdurabilecek engelleyiciler bulunur. Sadece en sıcak ilişkin olan kişiyle konuşup diğerlerini tanımamak, fırsatların sessizce ölmesinin en yaygın nedenidir.", "Alıcılar lineer bir yol izlemez. Gartner'ın tanımladığı 6 iş (problemi tanımlama, çözüm arama, gereksinim belirleme, tedarikçi seçme, doğrulama, fikir birliği) arasında ileri geri gidip gelirler. Üstelik zamanlarının çok küçük bir kısmını satıcılarla geçirirler. Senin görevin onları iç tartışmada destekleyecek bilgiyi ve araçları vermektir.", "İnsan psikolojisi de burada devrededir. İnsanlar kaybetmekten, kazanmayı sevdiklerinden daha çok korkar (kayıptan kaçınma). Mevcut durumu değiştirmek risk gibi hissettirir (statüko yanlılığı). Bu yüzden en büyük rakibin çoğu zaman başka bir firma değil, 'şimdilik bir şey yapmayalım' kararıdır.", "Pratik sonuç şu: değişimin getirisini değil, değişmemenin maliyetini de göster. Ayrıca kararı veren herkesin kişisel kaygısını ('Bu projeyi ben önerdim, ya başarısız olursa?') hesaba kat."], "ornek": "Ailede yeni bir araba alınacağını düşün. Parayı veren baba (ekonomik alıcı), en çok kullanacak olan anne (kullanıcı), arabalardan anlayan kuzen (teknik değerlendirici), 'bu arabayı alalım' diye ısrar eden genç (şampiyon) ve 'eskisi daha iyi çalışıyor, ne gerek var' diyen dede (engelleyici). Satıcı sadece gençle konuşursa, akşam yemeğinde dede 'bekleyelim' der ve satış biter. Gerçek karar o sofrada verilir."}, {"id": "F1.04", "faz": "F1", "fazAd": "Satışın Temelleri", "modul": "Satışın Temelleri", "konu": "Satış sürecinin uçtan uca akışı", "hedef": "Prospect'ten genişlemeye kadar her aşamanın amacını ve çıkış kriterini tanımlayabilmek.", "teori": "Prospect → Nitelendirme → Discovery → Çözüm/Demo → Teklif → Müzakere → Kapanış → Onboarding → Genişleme. Her aşamanın amacı (neyi öğreniyoruz/neyi kanıtlıyoruz) ve alıcı tarafından doğrulanmış çıkış kriteri olmalı. Aşama satıcının yaptığı işe göre değil, alıcının attığı adıma göre ilerler.", "pratik": "Deri toptan işin için 7 aşamalı bir süreç yaz; her aşamaya 1 çıkış kriteri ekle.", "cikti": "Süreç diyagramı + çıkış kriterleri", "saat": 3, "oncelik": "Kritik", "kaynak": "HubSpot Sales Pipeline dokümanları; Winning by Design – Revenue Architecture", "anlatim": ["Satış süreci, bir potansiyel müşterinin ilk temastan sadık müşteriye kadar geçtiği adımların haritasıdır: Prospect → Nitelendirme → Keşif → Çözüm/Demo → Teklif → Müzakere → Kapanış → Onboarding → Genişleme. Bu harita olmadan satış 'şansa' kalır ve neyin işe yaradığını ölçemezsin.", "Her aşamanın bir amacı vardır. Nitelendirmede 'Bu kişiyle zaman harcamaya değer mi?' sorusunu cevaplarsın. Keşifte problemi ve etkisini anlarsın. Demo aşamasında çözümün o probleme uyduğunu kanıtlarsın. Teklif aşaması rakamları ve koşulları netleştirir.", "Kritik kavram çıkış kriteridir: bir fırsatı bir sonraki aşamaya taşımak için müşterinin ne yapmış olması gerekir? Burada önemli nokta, kriterin senin yaptığın işe değil müşterinin attığı adıma bağlı olmasıdır. 'Teklif gönderdim' bir çıkış kriteri değildir; 'Müşteri teklifi karar vericiyle birlikte inceledi ve toplantı tarihi verdi' bir çıkış kriteridir.", "Böyle kurulmuş bir süreç sana iki şey kazandırır: pipeline'ındaki fırsatların gerçekte nerede olduğunu bilirsin ve hangi aşamada en çok kayıp yaşadığını görüp orayı düzeltebilirsin."], "ornek": "Düğün organizasyonunu düşün: önce tanışma (prospect), bütçe ve tarih uygun mu diye bakma (nitelendirme), çiftin hayalini dinleme (keşif), mekânı gezdirme (demo), fiyat teklifi (teklif), pazarlık (müzakere), kapora ve sözleşme (kapanış), düğün hazırlığı (onboarding), sonra arkadaşlarına tavsiye edip nişan ve sünnet organizasyonları için geri gelmeleri (genişleme). 'Mekânı gezdiler' demek ilerleme sayılmaz; 'tarih için ön rezervasyon istediler' demek sayılır."}, {"id": "F1.05", "faz": "F1", "fazAd": "Satışın Temelleri", "modul": "Satışın Temelleri", "konu": "Değer önerisi ve fayda dili (FAB)", "hedef": "Özellik konuşmak yerine müşteri sonucunu konuşmak.", "teori": "FAB: Feature (özellik) → Advantage (avantaj) → Benefit (müşterinin iş sonucu). 'Peki bu ne demek?' (so what?) testi özellikten sonuca iner. Value Proposition Canvas: müşteri işleri, acılar, kazançlar ↔ ürün, acı gidericiler, kazanç yaratıcılar. İyi değer önerisi: kime, hangi problem, hangi ölçülebilir sonuç, neden biz.", "pratik": "Vimex'in 5 özelliğini FAB tablosuna dök, her birine eczacının diliyle bir fayda cümlesi yaz.", "cikti": "FAB tablosu + 1 cümlelik değer önerisi", "saat": 2, "oncelik": "Kritik", "kaynak": "Value Proposition Design (Osterwalder)", "anlatim": ["Müşteriler özellik satın almaz; o özelliğin hayatlarında yarattığı sonucu satın alır. FAB modeli bu dönüşümü yapmanın en basit aracıdır: Feature (özellik: ürün ne yapar) → Advantage (avantaj: bu neden daha iyi) → Benefit (fayda: müşterinin işine ya da hayatına etkisi).", "Çoğu satıcı özellikte takılır kalır: '7/24 çalışıyor, WhatsApp entegrasyonu var, yapay zekâ destekli.' Müşterinin kafasında ise tek soru vardır: 'Peki bu benim için ne demek?' Bu soruyu her özellik için kendine sor. Cevap müşterinin diliyle ve mümkünse bir rakamla bitene kadar sormaya devam et.", "İyi bir değer önerisi dört soruyu cevaplar: Kime? Hangi problemi çözüyor? Hangi ölçülebilir sonucu sağlıyor? Neden alternatiflerden daha iyi? Örneğin: 'Eczanelere, reçete yenileme zamanı gelen hastaları otomatik arayarak kaybedilen hastaları geri kazandırıyoruz; personel zamanı harcamadan.'", "Faydayı her zaman karşındaki kişiye göre ayarla. Aynı özellik eczane sahibi için 'ciro', teknisyen için 'daha az telefon trafiği' anlamına gelir."], "ornek": "Telefon mağazasında satıcı 'Bu telefonda 5000 mAh batarya var' der (özellik). 'Yani diğer modellerden %30 daha uzun gidiyor' (avantaj). Ama seni ikna eden cümle şudur: 'Sabah evden çıkıp akşam eve dönene kadar şarj aleti taşımana gerek kalmaz' (fayda). 5000 mAh'ın ne demek olduğunu çoğu kişi bilmez, ama gün ortasında telefonun kapanmasının ne demek olduğunu herkes bilir."}, {"id": "F1.06", "faz": "F1", "fazAd": "Satışın Temelleri", "modul": "İletişim Becerileri", "konu": "Aktif dinleme ve soru sorma", "hedef": "Görüşmelerin %70'inde müşterinin konuşmasını sağlamak.", "teori": "Açık sorular keşif, kapalı sorular teyit içindir. Teknikler: özetleme, yansıtma (mirroring), etiketleme (labeling: 'Görünüşe göre ... sizi zorluyor'), sessizliği kullanma. Gong verilerine göre başarılı görüşmelerde konuşma oranı dengelidir ve sorular görüşmeye yayılır; ardı ardına soru yağmuru sorgu hissi verir.", "pratik": "Bir sonraki 3 müşteri görüşmesini kaydet (izin alarak) ve konuşma oranını, soru sayısını ölç.", "cikti": "Kendi görüşme analiz notu", "saat": 3, "oncelik": "Kritik", "kaynak": "Never Split the Difference (Chris Voss); Gong Labs blogu", "anlatim": ["İyi satıcılar iyi konuşanlar değil, iyi soru sorup iyi dinleyenlerdir. Müşteri ne kadar çok konuşursa sen o kadar çok şey öğrenirsin ve o da o kadar çok 'anlaşıldığını' hisseder. Hedef, görüşmenin çoğunda müşterinin konuşmasıdır.", "Soruların iki türü vardır. Açık sorular ('Bu süreç nasıl işliyor?') keşif içindir ve müşteriyi anlatmaya davet eder. Kapalı sorular ('Bu ay mı başlamak istiyorsunuz?') teyit içindir. Görüşmenin başında açık, sonunda kapalı sorular ağırlıklı olmalıdır.", "Aktif dinlemenin üç basit tekniği var. Özetleme: 'Yani anladığım kadarıyla asıl sorun…' Yansıtma: müşterinin son 2–3 kelimesini soru tonuyla tekrarlamak ('Personel yetmiyor?'); bu, daha fazla anlatmasını sağlar. Etiketleme: 'Bu durum sizi epey yoruyor gibi görünüyor.' Bir de sessizlik var: sorudan sonra sus. Boşluğu doldurma içgüdüsüne karşı koy; en değerli bilgi genelde sessizlikten sonra gelir.", "Kaçınılacak hata ise sorgu havasıdır: 10 soruyu arka arkaya sıralamak. Her cevabı dinle, üzerine bir sonraki soruyu kur."], "ornek": "Bir arkadaşın 'İşte bugün berbat bir gün geçirdim' diyor. Kötü dinleyici hemen kendi berbat gününü anlatır ya da tavsiye verir. İyi dinleyici 'Berbat bir gün?' der ve bekler. Arkadaşın anlatır, sen 'Müdürünün herkesin önünde söylemesi seni asıl üzen şey gibi' diye etiketlersin. O da 'Aynen öyle!' der. Aynı teknik, müşterinin asıl derdini bulmanın da yoludur."}, {"id": "F1.07", "faz": "F1", "fazAd": "Satışın Temelleri", "modul": "İletişim Becerileri", "konu": "Güven, rapport ve güvenilirlik", "hedef": "Kısa sürede profesyonel güven inşa etmek.", "teori": "Maister'ın güven denklemi: Güven = (Uzmanlık + Tutarlılık + Yakınlık) / Kendini düşünme. Satıcının kendi çıkarını öne çıkarması paydayı büyütür ve güveni düşürür. Rapport yapay yakınlık değil; hazırlık, dürüstlük ve verilen sözü tutmakla oluşur.", "pratik": "Kendi güven denklemini puanla (1–10) ve en zayıf bileşen için 3 aksiyon yaz.", "cikti": "Güven denklemi öz değerlendirmesi", "saat": 2, "oncelik": "Önemli", "kaynak": "The Trusted Advisor (Maister, Green, Galford)", "anlatim": ["İnsanlar güvendikleri kişiden satın alır, özellikle de karar riskliyse. Güven tesadüfen oluşmaz; bileşenleri vardır. David Maister'ın güven denklemi bunu basitçe açıklar: Güven = (Uzmanlık + Tutarlılık + Yakınlık) / Kendini düşünme.", "Uzmanlık, ne konuştuğunu bilmendir. Tutarlılık, söylediğini yapmandır: 'Yarın dönerim' dediysen yarın dönmek. Yakınlık, müşterinin sana kaygısını rahatça anlatabilmesidir. Paydadaki 'kendini düşünme' ise en kritik kısımdır: müşteri senin sadece satışı kapatmayı düşündüğünü hissettiği an diğer üç bileşen ne kadar güçlü olursa olsun güven düşer.", "Rapport'u (sıcak ilişkiyi) yapay yakınlıkla karıştırma. Aşırı iltifat, zorlama ortak nokta arama ya da hemen 'abi/kardeş' samimiyeti ters teper. Gerçek rapport iyi hazırlıktan, dürüstlükten ve küçük sözleri tutmaktan gelir. Bazen 'Bu sizin için doğru ürün değil' demek, uzun vadede kurabileceğin en güçlü güvendir."], "ornek": "Bir tamirciye arabanı götürdün. Birinci tamirci bakar ve 'Motor, fren, lastik, hepsi değişmeli' der; ikincisi 'Sadece fren balatası bitmiş, lastikler bir yıl daha gider' der. İkincisi daha az kazandı ama sen bundan sonra arabanı hep ona götürürsün, arkadaşlarına da önerirsin. Kendini düşünmeyi azalttığı için güven kazandı ve uzun vadede daha çok para kazanacak."}, {"id": "F1.08", "faz": "F1", "fazAd": "Satışın Temelleri", "modul": "İletişim Becerileri", "konu": "Satışta hikâye anlatımı", "hedef": "Vaka hikâyesi ve içgörü hikâyesi kurabilmek.", "teori": "Yapı: Durum → Komplikasyon → Çözüm → Sonuç (SCR). İyi müşteri hikâyesi rakam içerir, müşterinin dilini kullanır ve dinleyenin kendini içinde görebileceği kadar benzerdir. Hikâye, itirazı önceden ele almanın en az saldırgan yoludur.", "pratik": "Her iş kolun için 1'er adet 90 saniyelik müşteri başarı hikâyesi yaz ve sesli kaydet.", "cikti": "3 vaka hikâyesi", "saat": 2, "oncelik": "Önemli", "kaynak": "Made to Stick (Heath); The Pyramid Principle (Minto)", "anlatim": ["İnsanlar rakamları unutur ama hikâyeleri hatırlar. Satışta hikâye; bir problemi, çözümü ve sonucu müşterinin kendini içinde görebileceği bir şekilde anlatmanın yoludur. Özellik listesi ikna etmez; 'bizim gibi birinin başına gelen ve çözülen şey' ikna eder.", "En kullanışlı yapı SCR'dir: Situation (Durum: müşteri nerede, ne yapıyordu), Complication (Komplikasyon: ne ters gidiyordu, maliyeti neydi), Resolution (Çözüm ve sonuç: ne yapıldı, rakamla ne değişti). İyi bir müşteri hikâyesi 60–90 saniye sürer, somut bir rakam içerir ve dinleyene benzer bir müşteriyi anlatır.", "Hikâye aynı zamanda itirazları önceden yumuşatmanın en nazik yoludur. 'Pahalı' itirazını beklediğin bir müşteriye tartışmaya girmeden, önce aynı kaygıyı taşıyan ve sonra yatırımını 3 ayda geri alan başka bir müşterinin hikâyesini anlatabilirsin.", "Hikâyelerini önceden hazırla, sesli pratik et ve farklı müşteri tiplerine göre bir hikâye kütüphanesi oluştur."], "ornek": "Bir diyetisyen 'Programım kilo verdiriyor' demek yerine şunu anlatır: 'Geçen yıl bir hastam vardı, masa başı çalışıyordu, akşamları hep dışarıdan yemek söylüyordu (durum). Doktoru kolesterol için uyarmıştı ve merdiven çıkarken nefesi kesiliyordu (komplikasyon). Akşam yemeklerini sadeleştirdik ve günde 20 dakika yürüyüş ekledik; 4 ayda 11 kilo verdi, kolesterolü normale döndü (çözüm).' Dinleyen kişi 'bu ben' der."}, {"id": "F1.09", "faz": "F1", "fazAd": "Satışın Temelleri", "modul": "İletişim Becerileri", "konu": "Yazılı ve sözlü iletişim: e-posta, telefon, video", "hedef": "Net, kısa ve aksiyona yönelik iletişim kurmak.", "teori": "BLUF (sonucu başta söyle). E-posta: tek amaç, kısa paragraf, net bir sonraki adım. Görüşme açılışı: gündem + süre + beklenti ('upfront contract'). Her görüşme tarihli ve kişisi belli bir sonraki adımla biter. Görüşme sonrası özet e-postası 24 saat içinde gider.", "pratik": "Son 5 müşteri e-postanı BLUF'a göre yeniden yaz; görüşme sonrası özet şablonu oluştur.", "cikti": "E-posta ve özet şablonları", "saat": 2, "oncelik": "Önemli", "kaynak": "HBR Guide to Better Business Writing", "anlatim": ["Satışta iletişimin çoğu kısa mesajlar, e-postalar ve telefon görüşmeleriyle yürür. Buradaki kural basittir: karşı tarafın zamanına saygı göster ve her iletişimi net bir sonraki adıma bağla.", "Yazılı iletişimde BLUF (Bottom Line Up Front) kullan: önemli olanı ilk cümlede söyle. Bir e-postanın tek bir amacı olsun, paragraflar kısa olsun, sonunda cevaplaması kolay tek bir soru bulunsun. Uzun ve dağınık bir e-posta 'sonra okurum' klasörüne gider ve bir daha açılmaz.", "Görüşmelerde ilk dakika önemlidir. Gündem, süre ve beklentiyi baştan netleştir: 'Bugün 20 dakikamız var. Önce sizin durumunuzu anlamak istiyorum, sonra uygun görürsek nasıl çalıştığımızı gösteririm. Sonunda devam edip etmeyeceğimize birlikte karar veririz.' Bu, hem karşı tarafı rahatlatır hem de görüşmeyi yönetmeni sağlar.", "Görüşmeden sonra 24 saat içinde kısa bir özet gönder: konuşulan problem, alınan kararlar, kimin ne yapacağı ve tarih. Bu hem profesyonellik göstergesidir hem de müşterinin şirket içinde seni anlatırken kullanacağı hazır bir metindir."], "ornek": "Apartman yöneticisi olduğunu ve komşulara mesaj attığını düşün. Kötü versiyon: 'Merhaba komşular, bildiğiniz gibi geçen kış kazanla ilgili sorunlar yaşamıştık, ben de birkaç firmayla görüştüm, fiyatlar değişik…' diye 3 paragraf yazmak. İyi versiyon: 'Kazan bakımı için 2 teklif aldım, hane başı 450 TL. Cumartesiye kadar itirazı olan yazarsa, yoksa pazartesi onaylıyorum.' İkincisi okunur, cevaplanır ve iş biter."}, {"id": "F1.10", "faz": "F1", "fazAd": "Satışın Temelleri", "modul": "Satışçı Zihniyeti", "konu": "Zihniyet, red yönetimi ve zaman yönetimi", "hedef": "Aktiviteyi yönetip sonucu takip eden disiplinli bir çalışma ritmi kurmak.", "teori": "Sonucu kontrol edemezsin, girdiyi kontrol edersin: aktivite → konuşma → toplantı → fırsat. Red kişisel değildir, bilgidir. Time blocking: sabit prospecting blokları (power hour), toplantı günleri, admin saatleri. Haftalık gözden geçirme: ne işe yaradı, ne yaramadı.", "pratik": "2 hafta boyunca günlük 60 dk prospecting bloğu uygula ve aktivite/sonuç kaydı tut.", "cikti": "2 haftalık aktivite günlüğü", "saat": 2, "oncelik": "Önemli", "kaynak": "Fanatical Prospecting (Jeb Blount)", "anlatim": ["Satışta sonucu doğrudan kontrol edemezsin; müşterinin ne zaman 'evet' diyeceğine sen karar vermezsin. Kontrol edebildiğin şey girdilerdir: kaç kişiyle temas kurduğun, kaç görüşme yaptığın, bu görüşmelerin kalitesi. Sonuç bu girdilerin toplamından doğar. Bu bakış açısı hem stresi azaltır hem de neyi iyileştireceğini gösterir.", "Red satışın doğal bir parçasıdır ve kişisel değildir. 'Hayır' genelde 'şu an değil', 'yanlış kişi' ya da 'yeterince anlatamadın' anlamına gelir; her biri bir bilgidir. Her 'hayır'dan sonra kendine şunu sor: 'Bundan ne öğrendim, bir sonrakinde neyi farklı yapacağım?'", "Zaman yönetiminde en etkili araç time blocking'dir. Takvimine sabit prospecting blokları koy (örneğin her sabah 09:30–10:30 arama saati) ve bu saati başka hiçbir işe verme. Aksi halde acil ama önemsiz işler, önemli ama acil olmayan yeni müşteri bulma işini her gün öteler. Pipeline boşaldığında fark ettiğinde ise iş işten geçmiş olur.", "Haftanın sonunda 15 dakikalık bir gözden geçirme yap: Ne yaptım? Ne sonuç aldım? Neyi değiştireceğim?"], "ornek": "Spor salonuna yeni başlayan biri tartıya her gün bakar ve rakam değişmeyince motivasyonunu kaybeder. Deneyimli biri tartıya değil, kontrol ettiği şeylere bakar: haftada 4 antrenman yaptım mı, proteinimi aldım mı, uyudum mu? Sonuç zamanla gelir. Antrenmanı 'vakit olursa' diye bırakan değil, takvimde sabit saatine koyan kişi başarır. Satıştaki arama saati de spor saatin gibidir."}, {"id": "F1.11", "faz": "F1", "fazAd": "Satışın Temelleri", "modul": "Satışçı Zihniyeti", "konu": "İtiraz yönetiminin temelleri", "hedef": "Gerçek itirazı yüzeysel itirazdan ayırmak ve yapılandırılmış yanıt vermek.", "teori": "LAER: Listen (dinle), Acknowledge (kabul et), Explore (keşfet), Respond (yanıtla). İtirazın arkasındaki gerçek kaygıyı soruyla bul: 'Bunu sormanızın sebebi nedir?' Feel-Felt-Found tekniği sosyal kanıt sağlar. Fiyat itirazı çoğunlukla değerin yeterince kurulmadığının işaretidir.", "pratik": "En sık duyduğun 10 itirazı listele ve her biri için LAER yanıtı yaz.", "cikti": "İtiraz kütüphanesi v1", "saat": 3, "oncelik": "Kritik", "kaynak": "Objections (Jeb Blount)", "anlatim": ["İtiraz, müşterinin 'hayır' demesi değil; 'bu noktada ikna olmadım' demesidir. Hatta itiraz eden müşteri çoğu zaman sessiz kalan müşteriden daha ilgilidir. Asıl mesele, gerçek kaygıyı yüzeydeki cümleden ayırmaktır. 'Pahalı' dediğinde bazen bütçe sorunu vardır, bazen de değeri henüz görmemiştir ya da seni başka bir teklifle kıyaslıyordur.", "LAER yapısı bu işi kolaylaştırır. Listen (dinle): sözünü kesme, savunmaya geçme. Acknowledge (kabul et): 'Bunu sormanız çok normal' diyerek kaygıyı meşru say. Explore (keşfet): 'Pahalı derken neyle karşılaştırıyorsunuz?' veya 'Bunu sormanızın sebebi nedir?' diye sorarak asıl kaygıyı bul. Respond (yanıtla): ancak asıl kaygıyı anladıktan sonra cevap ver.", "Feel-Felt-Found tekniği de etkilidir: 'Nasıl hissettiğinizi anlıyorum, başka müşterilerimiz de başta aynı şeyi hissetmişti, sonra şunu fark ettiler…' Bu, sosyal kanıtla itirazı yumuşatır.", "En önemli ilke şudur: en iyi itiraz yönetimi, itiraz gelmeden önce yapılır. Aynı itirazı sürekli duyuyorsan, keşif ya da sunum aşamasında o konuyu önceden ele almayı eksik yapıyorsun demektir."], "ornek": "Çocuğuna 'Hadi yat artık' diyorsun, o da 'Uykum yok!' diyor. Tartışmaya girersen ('Var, gözlerin kapanıyor!') kavga çıkar. Bunun yerine önce dinleyip kabul edersin ('Tamam, uykun olmayabilir'), sonra keşfedersin ('Neden yatmak istemiyorsun?'). Asıl sebep ortaya çıkar: 'Karanlıktan korkuyorum.' Artık doğru cevabı verebilirsin: gece lambası. 'Uykum yok' yüzeydeki itirazdı; gerçek itiraz başkaydı."}, {"id": "F1.12", "faz": "F1", "fazAd": "Satışın Temelleri", "modul": "Satışçı Zihniyeti", "konu": "Kapanış ve 'sonraki adım' disiplini", "hedef": "Kapanışı tek bir an değil, bir dizi taahhüt olarak yönetmek.", "teori": "Klasik teknikler (varsayımsal, özet, deneme kapanışı) tek başına yetersizdir. Modern görüş: her görüşme bir mikro-taahhütle biter (tarih, kişi, eylem). Kapanış, önceki aşamalardaki nitelendirme ve değer kurulumunun doğal sonucudur. 'Düşünüp dönerim' cevabı net bir sonraki adım olmadığını gösterir.", "pratik": "Açık tüm fırsatların için CRM'e/listeye 'tarihli sonraki adım' ekle; olmayanları işaretle.", "cikti": "Sonraki adım denetimi", "saat": 2, "oncelik": "Kritik", "kaynak": "SPIN Selling (bölüm 2: Obtaining Commitment)", "anlatim": ["Eski satış kitapları kapanışı sihirli cümlelerle anlatır: 'Kırmızısını mı alırsınız, mavisini mi?' gibi. Bu teknikler küçük satışlarda işe yarayabilir. Büyük satışta ise kapanış tek bir an değil, bir süreçtir. Önceki aşamalarda doğru müşteriyi seçtiysen, problemi ve etkisini netleştirdiysen ve karar sürecini bildiysen kapanış kendiliğinden gelir.", "Bunu mümkün kılan disiplin 'sonraki adım' kuralıdır. Her görüşme tarihi, kişisi ve eylemi belli bir mikro-taahhütle bitmelidir. Örneğin: 'Salı günü saat 14'te satın alma müdürünüzle 30 dakika görüşelim, siz de bu arada mevcut maliyet rakamlarını getirin.' Bu küçük taahhütler müşterinin gerçekten ilerleyip ilerlemediğini gösterir.", "'Düşünüp size dönerim' net bir sonraki adım değildir. Böyle bir cevap alırsan kibarca netleştir: 'Tabii. Düşünürken sizin tarafta neyi netleştirmemiz gerekiyor? Perşembe kısa bir telefonla konuşalım mı?'", "Müşteri sonraki adıma sürekli 'evet' diyorsa fırsat canlıdır. Sürekli erteliyorsa, fırsatın gerçekte nerede durduğunu dürüstçe sorgulama zamanıdır."], "ornek": "Birine çıkma teklif ettiğini düşün. 'Bir ara kahve içelim' dersin, o da 'Olur, bir ara' der. İkiniz de o kahvenin hiç içilmeyeceğini bilirsiniz. Oysa 'Cumartesi 3'te Moda'da kahve içelim mi?' dersen ya bir 'evet' ya da net bir 'hayır' alırsın. 'Bir ara' bir sonraki adım değildir; tarih, saat ve yer olan bir plan sonraki adımdır."}, {"id": "F2.01", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Hedef Pazar", "konu": "ICP (Ideal Customer Profile)", "hedef": "Veriye dayalı ideal müşteri profili ve negatif ICP tanımlamak.", "teori": "ICP bir şirket profilidir: sektör, büyüklük, coğrafya, teknoloji (technographic), davranış ve tetikleyici olaylar. En iyi 20 müşterini analiz et: en hızlı kapananlar, en yüksek marjlılar, en az sorun çıkaranlar, en çok genişleyenler. Negatif ICP (kimi hedeflemeyeceğin) en az ICP kadar değerlidir. ICP skoru 'fit'i, intent skoru 'zamanlama'yı ölçer.", "pratik": "Deri toptan ve Vimex için mevcut müşterilerden ICP çıkar; her biri için 6 kriter ve negatif ICP yaz.", "cikti": "2 adet ICP dokümanı", "saat": 4, "oncelik": "Kritik", "kaynak": "HubSpot Academy – ICP; Winning by Design; Clay University"}, {"id": "F2.02", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Hedef Pazar", "konu": "Buyer persona", "hedef": "Karar birimindeki her rol için ihtiyaç, KPI ve itirazları tanımlamak.", "teori": "Persona bir kişi profilidir: unvan, sorumluluk, başarı ölçütü (KPI), acılar, öncelikler, bilgi kaynakları, satın alma kriterleri, tipik itirazlar. ICP 'hangi şirket', persona 'o şirkette kim' sorusunu cevaplar. Persona görüşme yapılarak doğrulanır, varsayımla yazılmaz.", "pratik": "Her ICP için 3 persona yaz (ör. eczane sahibi, eczane teknisyeni, ecza deposu satın almacı) ve 3 müşteriyle 15 dk doğrulama görüşmesi yap.", "cikti": "Persona kartları", "saat": 3, "oncelik": "Kritik", "kaynak": "Buyer Personas (Adele Revella)"}, {"id": "F2.03", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Hedef Pazar", "konu": "TAM / SAM / SOM ve hesap evreni", "hedef": "Pazar büyüklüğünü aşağıdan yukarıya hesaplayıp gerçek bir hesap listesi çıkarmak.", "teori": "TAM: toplam pazar, SAM: ulaşılabilir kısım, SOM: gerçekçi pay. Yukarıdan aşağı (rapor yüzdeleri) yerine aşağıdan yukarıya hesap: hedef hesap sayısı × ortalama yıllık değer (ACV). Hesap evreni (account universe) satış ekibinin çalışacağı gerçek şirket listesidir.", "pratik": "Vimex için Türkiye eczane sayısından yola çıkarak bottom-up TAM/SAM/SOM hesapla.", "cikti": "Pazar büyüklüğü Excel modeli", "saat": 3, "oncelik": "Önemli", "kaynak": "Disciplined Entrepreneurship (Bill Aulet)"}, {"id": "F2.04", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Hedef Pazar", "konu": "Segmentasyon ve hesap tiering", "hedef": "Hesapları uyum ve potansiyele göre Tier 1/2/3'e ayırıp kaynak dağıtmak.", "teori": "Tier 1: yüksek potansiyel, yüksek uyum → kişiselleştirilmiş, çok kanallı, üst düzey temas. Tier 2: yarı kişiselleştirilmiş, sektörel mesaj. Tier 3: otomasyon ağırlıklı. Fit × Intent matrisi: yüksek fit + yüksek intent = hemen ara; yüksek fit + düşük intent = nurture.", "pratik": "200 hesaplık bir listeyi tier'lara ayır, her tier için temas stratejisi yaz.", "cikti": "Tier'lı hesap listesi", "saat": 3, "oncelik": "Kritik", "kaynak": "ABM is B2B (Sangram Vajre)"}, {"id": "F2.05", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Lead Kavramları", "konu": "Lead yaşam döngüsü: MQL, SAL, SQL, Opportunity", "hedef": "Lead aşamalarını tanımlayıp pazarlama-satış SLA'sı yazabilmek.", "teori": "Subscriber → Lead → MQL (pazarlama nitelikli) → SAL (satış kabul etti) → SQL (satış nitelikli) → Opportunity → Customer. Her aşamanın tanımı yazılı olmalı. SLA: pazarlama X adet MQL üretir, satış MQL'leri Y saat içinde işler. Tanımsız aşamalar 'lead kalitesi kötü' kavgasının kaynağıdır.", "pratik": "Kendi işin için lifecycle tanımları ve 1 sayfalık marketing-sales SLA yaz.", "cikti": "Lifecycle sözlüğü + SLA", "saat": 3, "oncelik": "Kritik", "kaynak": "HubSpot Lifecycle Stages dokümanı; Forrester (SiriusDecisions) Demand Waterfall"}, {"id": "F2.06", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Lead Kavramları", "konu": "Lead scoring", "hedef": "Fit ve engagement'a dayalı bir lead puanlama modeli kurmak.", "teori": "İki eksen: Fit (demografik/firmografik: doğru sektör, rol, büyüklük) ve Engagement (davranış: fiyat sayfası ziyareti, demo talebi, e-posta tıklaması). Negatif puan (öğrenci, rakip, yanlış ülke) ve zaman içinde puan düşmesi (decay) eklenir. Eşik değer geçmiş kazanılmış fırsatlarla kalibre edilir. Predictive scoring yeterli veri varsa ML ile yapılır.", "pratik": "Excel'de 10 kriterli bir scoring modeli kur, son 30 lead'i puanla ve sonuçla karşılaştır.", "cikti": "Lead scoring modeli", "saat": 3, "oncelik": "Önemli", "kaynak": "HubSpot Academy – Lead Scoring; MadKudu blogu"}, {"id": "F2.07", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Lead Kavramları", "konu": "Lead kaynakları ve kanal karması", "hedef": "Inbound, outbound, partner, etkinlik ve ürün kaynaklı lead'leri dengelemek.", "teori": "Inbound: talep yaratır, ucuzdur ama yavaş kurulur. Outbound: kontrol edilebilir, hızlıdır ama maliyetlidir. Partner/referral: en yüksek dönüşüm, düşük hacim. Etkinlik: ilişki yoğun. Ürün (PLG): kullanım sinyali. Sağlıklı pipeline tek kanala bağımlı değildir; kanal başına maliyet ve dönüşüm ölçülür.", "pratik": "Son 12 aydaki müşterilerini kaynağa göre sınıflandır; kanal başına dönüşüm ve tahmini maliyet çıkar.", "cikti": "Kanal karması tablosu", "saat": 2, "oncelik": "Önemli", "kaynak": "Traction (Weinberg & Mares) – 19 kanal"}, {"id": "F2.08", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Outbound", "konu": "Outbound stratejisi ve sinyal bazlı prospecting", "hedef": "Hacim yerine isabet odaklı bir outbound motoru tasarlamak.", "teori": "Eski model: büyük liste + genel mesaj. Yeni model: sinyal (işe alım, yatırım, yeni şube, yönetici değişimi, ihale, fuar katılımı) + küçük liste + bağlama özel mesaj. Tetikleyici olay 'neden şimdi?' sorusunu cevaplar. Account-based outbound: hesaptaki 3–5 kişiye koordineli temas (multi-threading).", "pratik": "Deri toptan için 5 satın alma sinyali tanımla (ör. yeni koleksiyon, fuar, yeni fabrika) ve bu sinyallere göre 30 hesaplık liste çıkar.", "cikti": "Sinyal listesi + 30 hesap", "saat": 4, "oncelik": "Kritik", "kaynak": "Predictable Revenue; 30 Minutes to President's Club podcast"}, {"id": "F2.09", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Outbound", "konu": "Hesap ve kişi araştırması", "hedef": "Hızlı ama anlamlı araştırmayla kişiselleştirme yapabilmek.", "teori": "3×3 kuralı: 3 dakikada 3 bilgi bul. Kaynaklar: şirket sitesi, haberler, LinkedIn gönderileri, iş ilanları (öncelikleri gösterir), faaliyet raporları, ticaret sicil gazetesi, fuar katılımcı listeleri. Kişiselleştirme bilgiyi göstermek değil, bilgiyi onların problemine bağlamaktır.", "pratik": "20 hesap için 3×3 araştırması yap ve her biri için tek cümlelik kişiselleştirilmiş açılış yaz.", "cikti": "Araştırma şablonu + 20 açılış", "saat": 3, "oncelik": "Önemli", "kaynak": "Sam Nelson – Outbound Squad; Becc Holland (Flip the Script)"}, {"id": "F2.10", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Outbound", "konu": "Cold e-posta yazımı", "hedef": "Yanıt alan, kısa ve alıcı odaklı soğuk e-postalar yazmak.", "teori": "Yapı: kişisel/tetikleyici açılış → varsayılan problem → kanıt (benzer müşteri sonucu) → düşük sürtünmeli CTA ('İlgi var mı?' / 'Göndermemi ister misiniz?'). 50–125 kelime, mobilde okunur, konu satırı 2–4 kelime ve iç yazışma gibi. Kendinden değil onlardan bahset. İlk e-postada toplantı istemek yerine ilgi sormak genelde daha çok yanıt getirir.", "pratik": "3 farklı açılış stratejisiyle (tetikleyici, problem, sosyal kanıt) e-posta yaz, 30'ar kişiye gönder, yanıt oranlarını karşılaştır.", "cikti": "A/B test raporu", "saat": 4, "oncelik": "Kritik", "kaynak": "Lavender blogu; Josh Braun – Badass B2B Growth Guide"}, {"id": "F2.11", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Outbound", "konu": "Çok kanallı sekans (cadence) tasarımı", "hedef": "E-posta, telefon, LinkedIn ve WhatsApp'ı birleştiren bir temas akışı kurmak.", "teori": "Tipik sekans: 3–4 haftada 8–12 temas. Örnek: G1 e-posta + LinkedIn bağlantı, G3 telefon, G5 e-posta (farklı açı), G8 LinkedIn mesajı, G10 telefon + sesli mesaj, G14 değer içeriği, G21 'breakup' e-postası. Her temas yeni bir değer/açı getirmeli; 'sadece takip ediyorum' yasak.", "pratik": "Bir ICP için 10 adımlı sekans yaz ve bir engagement aracında (Apollo/HubSpot) kur.", "cikti": "Çalışan sekans", "saat": 4, "oncelik": "Kritik", "kaynak": "Outreach / Salesloft blogları; Apollo Academy"}, {"id": "F2.12", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Outbound", "konu": "Cold calling", "hedef": "Soğuk aramada ilk 30 saniyeyi yönetip toplantı kapatmak.", "teori": "Açılış: izin temelli ('Soğuk arama olduğunu söylesem 30 saniye verir misiniz?') veya problem önermesi ('Genelde X rolündekilerden A ve B problemlerini duyuyorum, sizde de öyle mi?'). Amaç satmak değil, toplantı almak. Sık itirazlar: 'Mail atın', 'İlgilenmiyoruz', 'Tedarikçimiz var' → kabul et + kısa soru + yeniden yönlendir. Ton ve tempo içerikten daha belirleyicidir.", "pratik": "Bir hafta boyunca günde 20 arama yap, itirazları kaydet ve script'ini revize et.", "cikti": "Cold call script v2 + itiraz kaydı", "saat": 5, "oncelik": "Kritik", "kaynak": "Armand Farrokh & Nick Cegelski – Cold Calling Sucks (30MPC); Josh Braun"}, {"id": "F2.13", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Outbound", "konu": "LinkedIn ve social selling", "hedef": "LinkedIn'i profil, ağ ve içerikle bir lead kaynağına çevirmek.", "teori": "Profil müşteri odaklı olmalı (kime ne sonuç sağlıyorsun). Bağlantı isteği kısa, satışsız. İçerik: haftada 2–3 gönderi (içgörü, vaka, görüş). Etkileşim: hedef hesapların gönderilerine anlamlı yorum. Sesli mesaj ve video mesaj yanıt oranını artırabilir. LinkedIn SSI skoru ilerlemeyi gösterir.", "pratik": "Profilini yeniden yaz, 30 gün boyunca haftada 3 gönderi paylaş ve 50 hedef kişiyle bağlantı kur.", "cikti": "30 günlük LinkedIn raporu", "saat": 4, "oncelik": "Önemli", "kaynak": "LinkedIn Sales Navigator eğitimleri; Justin Welsh içerikleri"}, {"id": "F2.14", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Outbound", "konu": "E-posta teslim edilebilirliği ve yasal çerçeve", "hedef": "Spam'e düşmeyen bir e-posta altyapısı kurmak ve Türkiye/AB mevzuatına uymak.", "teori": "Teknik: SPF, DKIM, DMARC kayıtları; ana alan adını korumak için ikincil alan adı; yeni alan adında 2–4 hafta ısınma (warm-up); kutu başına günlük düşük hacim; bounce oranını düşük tutmak için e-posta doğrulama. Yasal: Türkiye'de 6563 sayılı Kanun ve İYS; tacir/esnafa ticari ileti kurallarında ön onay istisnaları ve ret hakkı; KVKK kapsamında kişisel veri işleme; AB için GDPR. Detayı mutlaka hukukçuyla doğrula.", "pratik": "Kendi alan adının SPF/DKIM/DMARC kayıtlarını kontrol et (MXToolbox) ve bir outbound altyapı kontrol listesi hazırla.", "cikti": "Teslim edilebilirlik kontrol listesi", "saat": 3, "oncelik": "Kritik", "kaynak": "Google/Yahoo gönderici yönergeleri; iys.org.tr; KVKK Kurumu"}, {"id": "F2.15", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Outbound", "konu": "Veri, zenginleştirme (enrichment) ve araçlar", "hedef": "Doğru kişi ve iletişim verisini bulup temiz tutmak.", "teori": "Kaynaklar: Apollo, Lusha, Cognism, ZoomInfo, Sales Navigator. Clay ile 'waterfall enrichment' (bir kaynakta bulunamazsa sıradakine geç) ve otomatik araştırma. Veri doğrulama (NeverBounce/ZeroBounce). Türkiye'de veri kalitesi düşüktür; sektör odaları, fuar katalogları ve yerel dizinler önemli tamamlayıcıdır.", "pratik": "Clay veya Apollo ücretsiz planıyla 100 kişilik zenginleştirilmiş liste oluştur; doğruluk oranını ölç.", "cikti": "Zenginleştirilmiş liste + doğruluk notu", "saat": 4, "oncelik": "Önemli", "kaynak": "Clay University; Apollo Academy"}, {"id": "F2.16", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Outbound", "konu": "WhatsApp ve Türkiye'ye özgü kanallar", "hedef": "Türkiye pazarında yüksek dönüşümlü yerel kanalları kullanmak.", "teori": "WhatsApp Business / API: onaylı şablon mesajlar, opt-in zorunluluğu, kısa ve kişisel iletişim. Türkiye'de referans ve yüz yüze ilişki kültürü güçlüdür: sektör odaları, dernekler, fuarlar (AYMOD, Leather & Shoe fuarları, eczacı odası etkinlikleri vb.), bölgesel ziyaret turları. Telefon + WhatsApp takibi e-postadan daha hızlı sonuç verebilir.", "pratik": "WhatsApp için 3 şablon (ilk temas sonrası, toplantı hatırlatma, teklif takibi) yaz ve opt-in akışını tasarla.", "cikti": "WhatsApp playbook", "saat": 2, "oncelik": "Önemli", "kaynak": "Meta WhatsApp Business Platform dokümantasyonu"}, {"id": "F2.17", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Inbound & Demand Gen", "konu": "Inbound marketing temelleri", "hedef": "İçerik, SEO ve dönüşüm sayfalarıyla talep toplayan bir sistem kurmak.", "teori": "Çek (pull) modeli: çekici içerik → ziyaretçi → dönüşüm teklifi (lead magnet: rehber, hesaplayıcı, şablon) → form → nurture → satış. SEO: alıcının aradığı problem odaklı içerik. Landing page: tek hedef, net fayda, sosyal kanıt, kısa form.", "pratik": "Hedef personana yönelik bir lead magnet (ör. 'Eczaneler için müşteri geri kazanım rehberi') ve landing page taslağı hazırla.", "cikti": "Lead magnet + landing page", "saat": 4, "oncelik": "Önemli", "kaynak": "HubSpot Academy – Inbound Certification"}, {"id": "F2.18", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Inbound & Demand Gen", "konu": "Demand generation vs lead generation", "hedef": "Kısa vadeli lead toplama ile uzun vadeli talep yaratma arasındaki dengeyi kurmak.", "teori": "LinkedIn B2B Institute'un 95-5 kuralı: bir anda alıcıların yaklaşık %5'i pazardadır, %95'i değildir. Demand gen %95'in zihninde yer edinir (ungated içerik, marka, topluluk); lead gen %5'i yakalar. 'Dark funnel': kararların ölçülemeyen kanallarda (WhatsApp grupları, podcast, kulaktan kulağa) şekillenmesi. Self-reported attribution ('Bizi nereden duydunuz?') bu yüzden önemlidir.", "pratik": "Formlarına 'Bizi nereden duydunuz?' serbest metin alanı ekle; 1 ay sonra sonuçları analiz et.", "cikti": "Talep kaynağı analizi", "saat": 2, "oncelik": "Önemli", "kaynak": "Demand Gen yazıları (Chris Walker); LinkedIn B2B Institute – 95:5"}, {"id": "F2.19", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Inbound & Demand Gen", "konu": "Lead nurturing ve pazarlama otomasyonu", "hedef": "Henüz hazır olmayan lead'leri sistematik olarak olgunlaştırmak.", "teori": "Davranış tetiklemeli akışlar (içerik indirdi → 3 e-postalık eğitim serisi), yaşam döngüsü akışları, yeniden etkileşim kampanyaları. Kişiselleştirme segment bazlı olur. Amaç satış değil, bir sonraki doğal adıma (ör. değerlendirme görüşmesi) taşımaktır.", "pratik": "5 e-postalık bir nurture akışı yaz ve HubSpot ücretsiz/ Mailchimp üzerinde kur.", "cikti": "Nurture akışı", "saat": 3, "oncelik": "Destek", "kaynak": "HubSpot Academy – Email Marketing"}, {"id": "F2.20", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Inbound & Demand Gen", "konu": "Etkinlik, fuar ve webinar ile lead üretimi", "hedef": "Etkinlikleri ölçülebilir pipeline kaynağına çevirmek.", "teori": "Etkinlik öncesi: hedef katılımcı listesi, önceden toplantı ayarlama. Etkinlik sırasında: hızlı lead yakalama (form/QR), not alma, puanlama. Sonrası: 24–48 saat içinde kişiselleştirilmiş takip. Etkinlik ROI'si = etkinlik kaynaklı pipeline ve kapanan gelir / toplam maliyet. Sponsorlar için de aynı mantıkla aktivasyon planı sunulur.", "pratik": "Bir sonraki fuar/etkinlik için öncesi-sırası-sonrası playbook'u ve ROI takip tablosu hazırla.", "cikti": "Etkinlik playbook'u", "saat": 3, "oncelik": "Önemli", "kaynak": "Bizzabo / Splash etkinlik pazarlama rehberleri"}, {"id": "F2.21", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Inbound & Demand Gen", "konu": "Partner, kanal ve referans ile lead üretimi", "hedef": "En yüksek dönüşümlü kanal olan referans ve ortaklıkları sistemleştirmek.", "teori": "Referans programı: memnun müşteriden yapılandırılmış talep (zamanlama: başarıdan hemen sonra). Tamamlayıcı ortaklar (aynı müşteriye farklı ürün satanlar) ile ortak pazarlama. Distribütör/bayi modeli. Partner kaynaklı fırsatların CRM'de ayrı izlenmesi.", "pratik": "3 potansiyel tamamlayıcı ortak belirle ve karşılıklı değer önerisi yaz; 5 müşteriden referans iste.", "cikti": "Ortaklık önerisi + referans takibi", "saat": 3, "oncelik": "Önemli", "kaynak": "Crossbeam / Partnerbase ekosistem yazıları; The Referral Engine (John Jantsch)"}, {"id": "F2.22", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "ABM", "konu": "Account-Based Marketing (ABM)", "hedef": "Seçili hesaplara satış ve pazarlamanın ortak çalıştığı bir program kurmak.", "teori": "ABM türleri: 1:1 (stratejik, birkaç hesap, tamamen özel), 1:few (sektör kümeleri), 1:many (teknoloji destekli, yüzlerce hesap). Adımlar: hesap seçimi → hesap içgörüsü → kişiye özel mesaj → koordineli temas (reklam, e-posta, arama, doğrudan posta, etkinlik) → ölçüm (hesap etkileşimi, pipeline, deal hızı).", "pratik": "5 Tier-1 hesap için 1:1 ABM planı hazırla: kişiler, mesaj, 6 haftalık temas takvimi.", "cikti": "ABM planı", "saat": 5, "oncelik": "Kritik", "kaynak": "ABM is B2B (Vajre); Demandbase / 6sense ABM rehberleri"}, {"id": "F2.23", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "ABM", "konu": "Intent data ve satın alma sinyalleri", "hedef": "Doğru zamanlamayı yakalamak için sinyalleri kullanmak.", "teori": "1st party intent: sitende fiyat sayfası ziyareti, e-posta etkileşimi, ürün kullanımı. 3rd party intent: bir hesabın belirli konuları araştırması (Bombora, G2). Diğer sinyaller: yönetici değişikliği, işe alım, yatırım, genişleme, ihale. Sinyal tek başına satın alma değildir; fit ile birleştirilmelidir.", "pratik": "Bir sinyal takip tablosu kur (Google Alerts, LinkedIn, iş ilanları) ve 2 hafta işlet.", "cikti": "Sinyal takip sistemi", "saat": 3, "oncelik": "Önemli", "kaynak": "Common Room / Clay sinyal rehberleri"}, {"id": "F2.24", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "ABM", "konu": "Lead yanıt hızı ve yönlendirme (routing)", "hedef": "Gelen talebi dakikalar içinde doğru kişiye ulaştırmak.", "teori": "Speed-to-lead: gelen talebe ilk birkaç dakikada dönmek dönüşümü ciddi şekilde artırır (InsideSales/MIT araştırması). Yönlendirme kuralları: bölge, segment, hesap sahipliği (lead-to-account matching), round-robin. SLA ve eskalasyon kuralları yazılır.", "pratik": "Gelen lead'ler için yanıt süresini ölç ve bir yönlendirme kuralı tablosu yaz.", "cikti": "Routing kural seti", "saat": 2, "oncelik": "Önemli", "kaynak": "LeanData / Chili Piper rehberleri"}, {"id": "F2.25", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Ölçüm", "konu": "Prospecting metrikleri ve huni matematiği", "hedef": "Prospecting performansını sayılarla yönetmek.", "teori": "Metrikler: teslim oranı, açılma (güvenilirliği düşük), yanıt oranı, olumlu yanıt oranı, toplantı alındı, toplantı gerçekleşti (show rate), SQL'e dönüşüm, toplantı başına maliyet. Ters huni: hedef gelir ÷ ortalama deal = gereken kazanım; ÷ win rate = gereken fırsat; ÷ toplantı→fırsat oranı = gereken toplantı; ÷ temas→toplantı = gereken temas.", "pratik": "Kendi yıllık hedefinden ters huni hesabıyla haftalık aktivite hedefini çıkar (Excel'deki Metrikler sayfasını kullan).", "cikti": "Ters huni modeli", "saat": 3, "oncelik": "Kritik", "kaynak": "The Sales Acceleration Formula (Mark Roberge)"}, {"id": "F2.26", "faz": "F2", "fazAd": "Prospecting & Lead Generation", "modul": "Ölçüm", "konu": "AI destekli prospecting", "hedef": "AI'ı araştırma, kişiselleştirme ve sinyal takibinde güvenli şekilde kullanmak.", "teori": "Kullanım alanları: hesap araştırması özetleri, kişiselleştirilmiş ilk satır, sinyal tespiti, arama sonrası notlar, AI SDR ve sesli agent'lar. Riskler: genel ve 'AI kokan' mesajlar, alan adı itibarı, halüsinasyon, KVKK. Kural: AI ölçeği sağlar, insan muhakemesi mesajı onaylar.", "pratik": "Clay veya bir LLM ile 20 hesaplık otomatik araştırma + ilk satır akışı kur; insan onaylı ve onaysız versiyonu karşılaştır.", "cikti": "AI prospecting akışı", "saat": 3, "oncelik": "Önemli", "kaynak": "Clay University; Vimex projesindeki kendi agent deneyimin"}, {"id": "F3.01", "faz": "F3", "fazAd": "Satış Metodolojileri", "modul": "Nitelendirme", "konu": "BANT ve türevleri (ANUM, CHAMP, GPCT)", "hedef": "Temel nitelendirme çerçevelerini ve sınırlarını bilmek.", "teori": "BANT (IBM): Budget, Authority, Need, Timeline. Basit ama satıcı odaklıdır; bütçe çoğu zaman satıştan önce yoktur, değerle yaratılır. CHAMP: Challenges önce gelir. ANUM: Authority, Need, Urgency, Money. GPCTBA/C&I (HubSpot): Goals, Plans, Challenges, Timeline, Budget, Authority, Negative Consequences, Positive Implications. Transactional ve orta ölçekli satışta hızlı eleme aracıdır.", "pratik": "Son 10 lead'ini BANT ve CHAMP ile ayrı ayrı puanla; sonuç farklarını yorumla.", "cikti": "Karşılaştırmalı nitelendirme tablosu", "saat": 2, "oncelik": "Önemli", "kaynak": "Metodolojiler sayfası; HubSpot blog – Sales Qualification"}, {"id": "F3.02", "faz": "F3", "fazAd": "Satış Metodolojileri", "modul": "Nitelendirme", "konu": "MEDDIC / MEDDICC / MEDDPICC", "hedef": "Enterprise nitelendirmenin standart çerçevesini derinlemesine öğrenmek.", "teori": "Metrics, Economic Buyer, Decision Criteria, Decision Process, (Paper Process), Identify Pain, Champion, (Competition). 1990'larda PTC'de geliştirildi. Bir kontrol listesi değil; fırsatta neyi bildiğini ve bilmediğini gösteren bir 'bilgi haritasıdır'. Boşluklar riskleri gösterir. Detaylı açıklama Metodolojiler sayfasında.", "pratik": "Açık en büyük 3 fırsatını MEDDPICC ile puanla (her harf 0–2); boşluklar için aksiyon yaz.", "cikti": "MEDDPICC skor kartları", "saat": 5, "oncelik": "Kritik", "kaynak": "The MEDDICC Sales Methodology (Andy Whyte); meddicc.com"}, {"id": "F3.03", "faz": "F3", "fazAd": "Satış Metodolojileri", "modul": "Nitelendirme", "konu": "MEDDPICC ile deal review ve şampiyon testi", "hedef": "MEDDPICC'i haftalık deal incelemesinde kullanmak.", "teori": "Deal review soruları: 'Metriği müşteri kendi ağzıyla söyledi mi?', 'Ekonomik alıcıyla görüştük mü?', 'Karar süreci ve kağıt süreci tarihli mi?', 'Şampiyonumuz bizim için bir şey yaptı mı?' Şampiyon testi: erişimi var mı (EB'ye götürebilir mi), etkisi var mı, kişisel kazancı var mı, bizim adımıza satış yapıyor mu? Koç (bilgi verir) ile şampiyon (aksiyon alır) karıştırılmamalı.", "pratik": "Bir fırsat için 30 dakikalık kendi kendine deal review yap ve şampiyon testini uygula.", "cikti": "Deal review notu", "saat": 3, "oncelik": "Kritik", "kaynak": "Andy Whyte – MEDDICC; Force Management blogu"}, {"id": "F3.04", "faz": "F3", "fazAd": "Satış Metodolojileri", "modul": "Discovery", "konu": "SPIN Selling", "hedef": "Situation, Problem, Implication, Need-payoff sorularıyla derin keşif yapmak.", "teori": "Neil Rackham'ın 35.000+ satış görüşmesi araştırmasına dayanır. Büyük satışlarda klasik kapanış teknikleri işe yaramaz; başarıyı Implication ve Need-payoff soruları belirler. Durum soruları az ve hazırlıklı olmalı; problem soruları örtük ihtiyacı açar; etki soruları problemi büyütür; ihtiyaç-karşılık soruları müşterinin çözüm değerini kendi söylemesini sağlar. Detay Metodolojiler sayfasında.", "pratik": "Vimex eczane görüşmesi için 5'er S, P, I, N sorusu yaz ve bir rol oyununda kullan.", "cikti": "SPIN soru bankası", "saat": 5, "oncelik": "Kritik", "kaynak": "SPIN Selling (Neil Rackham); Major Account Sales Strategy"}, {"id": "F3.05", "faz": "F3", "fazAd": "Satış Metodolojileri", "modul": "Discovery", "konu": "Gap Selling", "hedef": "Mevcut durum ile hedef durum arasındaki boşluğu (gap) satmak.", "teori": "Keenan: Müşteri ürün değil, mevcut durumdan (current state) istenen duruma (future state) geçişi satın alır. Mevcut durum: fiziksel ortam, problemler, etki, kök neden, duygular. Gelecek durum: hedeflenen sonuç. Boşluk ne kadar büyük ve ölçülebilirse, aciliyet o kadar yüksek. Problem yoksa satış yoktur.", "pratik": "Bir müşterin için Current State / Future State / Gap tablosunu doldur.", "cikti": "Gap analizi", "saat": 3, "oncelik": "Kritik", "kaynak": "Gap Selling (Keenan)"}, {"id": "F3.06", "faz": "F3", "fazAd": "Satış Metodolojileri", "modul": "Discovery", "konu": "Solution Selling ve danışmanlık satışı", "hedef": "Ürün yerine çözüm ve iş sonucu satmak.", "teori": "Solution Selling (Mike Bosworth, sonra Eades): acı → vizyon → değer → güç (power) sırası. '9 Blok Vizyon Işleme Modeli' ile müşterinin çözüm vizyonunu birlikte oluşturmak. Danışmanlık satışı: satıcı bir danışman gibi tanı koyar; reçeteyi tanıdan önce yazmaz.", "pratik": "Bir müşteri için 'acı zinciri' (pain chain) çiz: bir departmandaki acının diğer departmanları nasıl etkilediği.", "cikti": "Pain chain diyagramı", "saat": 3, "oncelik": "Önemli", "kaynak": "The New Solution Selling (Keith Eades)"}, {"id": "F3.07", "faz": "F3", "fazAd": "Satış Metodolojileri", "modul": "Mesaj & İçgörü", "konu": "Challenger Sale", "hedef": "Müşteriye yeni bir bakış açısı öğreterek satmak (Teach-Tailor-Take control).", "teori": "CEB araştırması 5 satıcı profili buldu; karmaşık satışta en başarılısı 'Challenger'. Commercial Teaching sırası: Warmer (ısınma) → Reframe (yeniden çerçeveleme) → Rational Drowning (veriyle etkiyi göster) → Emotional Impact (hikâye) → A New Way (yeni yol) → Your Solution. Tailor: mesajı role göre uyarla. Take control: parayı ve süreci konuşmaktan kaçınma. Detay Metodolojiler sayfasında.", "pratik": "Deri toptan için bir 'reframe' içgörüsü geliştir ve 6 adımlı commercial teaching sunumu hazırla.", "cikti": "Commercial teaching sunumu", "saat": 5, "oncelik": "Kritik", "kaynak": "The Challenger Sale; The Challenger Customer"}, {"id": "F3.08", "faz": "F3", "fazAd": "Satış Metodolojileri", "modul": "Mesaj & İçgörü", "konu": "Command of the Message (Force Management)", "hedef": "Değer çerçevesi (value framework) ile tutarlı bir mesaj mimarisi kurmak.", "teori": "Bileşenler: Önce/Sonra senaryoları, Negatif sonuçlar, Olumlu iş sonuçları (PBO), Gerekli yetenekler (Required Capabilities), Nasıl yapıyoruz, Farklılaştırıcılar, Kanıt noktaları, Metrikler. 'Üç Neden': Neden bir şey yapmalı? Neden şimdi? Neden biz? MEDDICC ile sıkça birlikte kullanılır; karar kriterlerini kendi farklılaştırıcılarına göre şekillendirmeyi (decision criteria) hedefler.", "pratik": "Vimex için tek sayfalık value framework oluştur.", "cikti": "Value framework", "saat": 4, "oncelik": "Kritik", "kaynak": "Force Management – Command of the Message; Force Management podcast"}, {"id": "F3.09", "faz": "F3", "fazAd": "Satış Metodolojileri", "modul": "Mesaj & İçgörü", "konu": "Value Selling Framework", "hedef": "Değeri ölçülebilir hale getirip müşteriyle birlikte doğrulamak.", "teori": "ValueSelling Associates: Value Prompter (iş problemi, ihtiyaç, değer, güç/erişim) ve 'Qualified Prospect Formula'. Değer = müşterinin kendi metriğinde ifade ettiği sonuç. Satıcı değeri 'iddia' etmez; müşteriyle birlikte 'hesaplar'. Business case bu kavramın somut çıktısıdır.", "pratik": "Bir fırsat için müşteriyle birlikte doldurulabilecek basit bir değer hesaplayıcı tasarla.", "cikti": "Değer hesaplayıcı", "saat": 3, "oncelik": "Önemli", "kaynak": "valueselling.com; The Value Selling Handbook"}, {"id": "F3.10", "faz": "F3", "fazAd": "Satış Metodolojileri", "modul": "Süreç Metodolojileri", "konu": "Sandler Selling System", "hedef": "Alıcı-satıcı dengesini koruyan, kontrollü bir satış süreci yürütmek.", "teori": "Sandler Denizaltısı: Bonding & Rapport → Up-Front Contract (gündem, süre, sonuç beklentisi, 'hayır' demenin serbest olduğu) → Pain (3 katman: yüzey, iş etkisi, kişisel etki) → Budget → Decision → Fulfillment → Post-Sell. Felsefe: satıcı kovalamaz; nitelendirir ve 'hayır'ı erken almayı tercih eder. Reverse selling, negatif ters çevirme gibi teknikler içerir.", "pratik": "Sonraki 5 görüşmeye Up-Front Contract ile başla ve etkisini not et.", "cikti": "Up-front contract şablonu + gözlem", "saat": 4, "oncelik": "Önemli", "kaynak": "You Can't Teach a Kid to Ride a Bike at a Seminar (David Mattson); sandler.com"}, {"id": "F3.11", "faz": "F3", "fazAd": "Satış Metodolojileri", "modul": "Süreç Metodolojileri", "konu": "Miller Heiman: Strategic Selling ve Conceptual Selling", "hedef": "Karmaşık çok paydaşlı satışları yapılandırılmış olarak planlamak.", "teori": "Strategic Selling: Satın alma etkileri (Economic, User, Technical buyer, Coach), her birinin 'Win-Result'u (kişisel kazanım + iş sonucu), kırmızı bayraklar, konum (position), müşterinin modu (Growth, Trouble, Even Keel, Overconfident). Conceptual Selling: müşterinin 'kavramını' (çözüm fikrini) anlamak, Single Sales Objective, görüşme planı. Günümüzde Korn Ferry bünyesindedir.", "pratik": "Bir büyük fırsat için Blue Sheet (strateji sayfası) hazırla.", "cikti": "Blue Sheet", "saat": 4, "oncelik": "Önemli", "kaynak": "The New Strategic Selling (Miller, Heiman, Tuleja); Korn Ferry Sell"}, {"id": "F3.12", "faz": "F3", "fazAd": "Satış Metodolojileri", "modul": "Süreç Metodolojileri", "konu": "SNAP Selling ve NEAT Selling", "hedef": "Meşgul alıcıya ve modern nitelendirmeye uygun yaklaşımları bilmek.", "teori": "SNAP (Jill Konrath): Simple, iNvaluable, Aligned, Priority — aşırı meşgul alıcılar için; karar 3 aşamada verilir: erişime izin, statükodan çıkma, kaynak seçimi. NEAT (Harris Consulting + Sales Hacker): Need (temel ihtiyaç), Economic impact, Access to authority, Timeline (ters takvim). BANT'ın modern, müşteri odaklı versiyonu gibidir.", "pratik": "Bir cold e-postanı SNAP kriterlerine göre yeniden yaz.", "cikti": "SNAP uyumlu e-posta", "saat": 2, "oncelik": "Destek", "kaynak": "SNAP Selling (Jill Konrath)"}, {"id": "F3.13", "faz": "F3", "fazAd": "Satış Metodolojileri", "modul": "Süreç Metodolojileri", "konu": "Metodoloji yığını (methodology stack) kurmak", "hedef": "Farklı metodolojileri birbirini tamamlayacak şekilde katmanlamak.", "teori": "Tek metodoloji her şeyi çözmez. Tipik yığın: Nitelendirme = MEDDPICC; Keşif = SPIN / Gap; Mesaj = Challenger / Command of the Message; Görüşme kontrolü = Sandler up-front contract; Kapanış = Mutual Action Plan; Büyük hesap = Strategic Selling. Önemli olan ortak dil, CRM alanlarına işlenmesi ve deal review'da kullanılmasıdır.", "pratik": "Kendi işlerin için metodoloji yığınını seç ve CRM'de hangi alanlara karşılık geleceğini yaz.", "cikti": "Kişisel metodoloji yığını", "saat": 3, "oncelik": "Kritik", "kaynak": "Metodolojiler sayfası (karşılaştırma)"}, {"id": "F4.01", "faz": "F4", "fazAd": "Discovery, Değer Satışı & Müzakere", "modul": "Discovery", "konu": "Discovery görüşmesi tasarımı", "hedef": "Hazırlıklı, yapılandırılmış ve derin bir keşif görüşmesi yürütmek.", "teori": "Ön hazırlık: hesap araştırması, hipotezler, hedef (bu görüşmeden sonra ne bilmeliyim?). Akış: gündem ve up-front contract → mevcut durum → problemler → etkiler (iş + kişisel) → gelecek durum → karar süreci ve kriterler → sonraki adım. Soru bankası önceden hazırlanır ama sıraya bağlı kalınmaz.
