  }).join("");
  const weeks = DATA.weeks.map(w => `<div class="week"><header><b>Hafta ${w.hafta}</b><span>${w.faz}, ${w.saat} saat</span></header><ul>${
    w.konular.map(id => { const s = st(id); return `<li class="${s}"><span class="dot ${s}"></span><button data-topic="${id}">${esc(TOP[id].konu)}</button></li>`; }).join("")
  }</ul></div>`).join("");
  $("#v-yol").innerHTML = `
    <div class="hero">
      <div>
        <h1>Sıfırdan stratejik satışa, 42 haftalık yol</h1>
        <p>${DATA.topics.length} konu, ${DATA.methods.length} metodoloji ve ${DATA.projects.length} uygulama projesi. Her konunun bir teorisi, bir pratik görevi ve somut bir çıktısı var; RevOps, lead generation ve GTM en geniş yeri kaplıyor.</p>
      </div>
      <div class="big"><span class="pct">%${o.p}</span><span class="lbl">${o.d} / ${o.n} konu tamam<br>${o.hd} / ${o.h} saat</span></div>
    </div>
    <div class="route"><ol>${stops}</ol></div>
    ${next ? `<div class="next">
      <div><div class="k">${st(next.id)==="doing" ? "Devam ettiğin konu" : "Sıradaki konu"}</div><h3>${esc(next.konu)}</h3><div class="k">${next.id}, ${esc(next.fazAd)}, ${next.saat} saat</div></div>
      <span></span>
      <button class="btn primary" data-topic="${next.id}">Konuyu aç</button></div>` : `<div class="next"><div><h3>Tüm konular tamamlandı.</h3><div class="k">Capstone projelerini playbook'a dönüştürmeyi unutma.</div></div></div>`}
    <div class="section"><h2>Fazlar</h2><p class="lede">Bir faza tıklayınca müfredat o faza göre filtrelenir.</p><div class="phases">${rows}</div></div>
    <div class="section"><h2>Haftalık plan</h2><p class="lede">Konular saat yüküne göre haftalara dağıtıldı. Capstone projelerine ilgili fazda başlayıp F10'da tamamlayabilirsin.</p><div class="weeks">${weeks}</div></div>`;
  $$("#v-yol [data-phase]").forEach(b => b.addEventListener("click", () => { filt.phase = b.dataset.phase; renderMufredat(); show("mufredat"); }));
  $$("#v-yol [data-topic]").forEach(b => b.addEventListener("click", () => openTopic(b.dataset.topic)));
}

/* ---------- Müfredat ---------- */
const filt = { phase:"all", q:"", status:"all", prio:"all" };
const openSet = new Set();
const CHECK = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" style="color:var(--accent-ink)"><path d="M3.5 8.5l3 3 6-7"/></svg>`;
function topicMatch(t){
  if(filt.phase !== "all" && t.faz !== filt.phase) return false;
  if(filt.status !== "all" && st(t.id) !== filt.status) return false;
  if(filt.prio !== "all" && t.oncelik !== filt.prio) return false;
  if(filt.q){ const q = filt.q.toLocaleLowerCase("tr"); return [t.konu,t.hedef,t.teori,t.pratik,t.modul,t.kaynak,(t.anlatim||[]).join(" "),t.ornek||""].join(" ").toLocaleLowerCase("tr").includes(q); }
  return true;
}
function topicHTML(t){
  const s = st(t.id), open = openSet.has(t.id);
  return `<div class="topic ${s}" id="t-${t.id.replace('.','-')}">
    <div class="trow">
      <button class="st ${s}" data-cycle="${t.id}" aria-label="Durum: ${LBL[s]}. Değiştirmek için tıkla" title="${LBL[s]}">${CHECK}</button>
      <button class="topen" data-open="${t.id}" aria-expanded="${open}">${esc(t.konu)}</button>
      <span class="tmeta">${t.anlatim ? '<span class="hasl">Ders</span>' : ''}<span>${t.id}</span><span>${t.saat} sa</span><span class="pr ${esc(t.oncelik)}">${esc(t.oncelik)}</span></span>
    </div>
    <div class="tdet" ${open ? "" : "hidden"}>
      <div class="blk"><h5>Öğrenme hedefi</h5><p>${esc(t.hedef)}</p><h5>Teori ve özet</h5><p>${esc(t.teori)}</p></div>
      <div class="blk"><div class="practice"><h5>Pratik görev</h5><p>${esc(t.pratik)}</p><h5>Çıktı</h5><p>${esc(t.cikti)}</p></div>
        <h5>Kaynak</h5><p>${esc(t.kaynak)}</p>
        <h5>Durum</h5><div class="stsel">${["todo","doing","done"].map(k => `<button class="chip" aria-pressed="${s===k}" data-set="${t.id}" data-val="${k}">${LBL[k]}</button>`).join("")}</div>
      </div>
      ${t.anlatim ? `<div class="lesson full">
        <h4>Konu anlatımı</h4>
        ${t.anlatim.map(p => `<p>${esc(p)}</p>`).join("")}
        <div class="daily"><h5>Gündelik hayattan örnek</h5><p>${esc(t.ornek)}</p></div>
      </div>` : `<p class="nolesson full">Bu konunun anlatımı sonraki güncellemede eklenecek.</p>`}
      <div class="blk full"><h5>Notlarım</h5><textarea class="note" data-note="${t.id}" placeholder="Bu konuda öğrendiklerin, uygulama sonuçların…">${esc(state.notes[t.id] || "")}</textarea></div>
    </div></div>`;
}
function renderMufredat(){
  const v = $("#v-mufredat");
  const list = DATA.topics.filter(topicMatch);
  const chips = [["all","Tümü"], ...DATA.phases.map(p => [p.kod, p.kod])].map(([k,l]) => `<button class="chip" data-fphase="${k}" aria-pressed="${filt.phase===k}" title="${k==='all'?'Tüm fazlar':esc(PH[k].ad)}">${l}</button>`).join("");
  let body = "";
  for(const p of DATA.phases){
    const ts = list.filter(t => t.faz === p.kod);
    if(!ts.length) continue;
    const mods = [...new Set(ts.map(t => t.modul))];
    const s = phaseStats(p.kod);
    body += `<div class="phase-block"><header><span class="c">${p.kod}</span><h2>${esc(p.ad)}</h2><span class="w">Hafta ${esc(p.hafta)}, %${s.p} tamam</span></header>
      <p class="lede">${esc(p.amac)}</p>
      ${mods.map(m => `<div class="mod"><h4>${esc(m)}</h4>${ts.filter(t => t.modul === m).map(topicHTML).join("")}</div>`).join("")}</div>`;
  }
  v.innerHTML = `<h2>Müfredat</h2><p class="lede">Daireye tıklayarak durumu değiştir (başlamadı, devam ediyor, tamamlandı). Konu adına tıklayınca teori, pratik görev ve not alanı açılır.</p>
    <div class="controls">
      <input class="search" type="search" placeholder="Konu, yöntem veya kavram ara" value="${esc(filt.q)}" aria-label="Müfredatta ara">
      <select id="fstatus" aria-label="Durum filtresi"><option value="all">Tüm durumlar</option><option value="todo">Başlamadı</option><option value="doing">Devam ediyor</option><option value="done">Tamamlandı</option></select>
      <select id="fprio" aria-label="Öncelik filtresi"><option value="all">Tüm öncelikler</option><option>Kritik</option><option>Önemli</option><option>Destek</option></select>
    </div>
    <div class="chips" role="group" aria-label="Faz filtresi">${chips}</div>
    <div class="count">${list.length} konu gösteriliyor</div>
    ${body || `<p class="empty">Bu filtrelere uyan konu yok. Filtreleri temizlemek için "Tümü"ye tıkla.</p>`}`;
  $("#fstatus", v).value = filt.status; $("#fprio", v).value = filt.prio;
  const s = $(".search", v);
  s.addEventListener("input", e => { filt.q = e.target.value; const pos = e.target.selectionStart; renderMufredat(); const n = $("#v-mufredat .search"); n.focus(); n.setSelectionRange(pos,pos); });
  $("#fstatus", v).addEventListener("change", e => { filt.status = e.target.value; renderMufredat(); });
  $("#fprio", v).addEventListener("change", e => { filt.prio = e.target.value; renderMufredat(); });
  $$("[data-fphase]", v).forEach(b => b.addEventListener("click", () => { filt.phase = b.dataset.fphase; renderMufredat(); }));
}
// delegated events for topics (work in mufredat)
document.addEventListener("click", e => {
  const c = e.target.closest("[data-cycle]");
  if(c){ const id = c.dataset.cycle; setStatus(id, nextStatus(st(id))); renderMufredat(); const b = document.querySelector(`[data-cycle="${id}"]`); if(b) b.focus(); return; }
  const o = e.target.closest("[data-open]");
  if(o){ const id = o.dataset.open; openSet.has(id) ? openSet.delete(id) : openSet.add(id); refreshTopic(id); return; }
  const se = e.target.closest("[data-set]");
  if(se){ setStatus(se.dataset.set, se.dataset.val); renderMufredat(); }
});
document.addEventListener("input", e => {
  const n = e.target.closest("[data-note]");
  if(n){ const v = n.value.trim(); if(v) state.notes[n.dataset.note] = n.value; else delete state.notes[n.dataset.note]; persist(); }
});
function refreshTopic(id){
  const el = document.getElementById("t-" + id.replace(".","-"));
  const t = TOP[id];
  if(el && topicMatch(t)){ const tmp = document.createElement("div"); tmp.innerHTML = topicHTML(t); el.replaceWith(tmp.firstElementChild); }
  else if(el){ renderMufredat(); }
}
function openTopic(id){
  const t = TOP[id]; filt.phase = t.faz; filt.q = ""; filt.status = "all"; filt.prio = "all";
  openSet.add(id); renderMufredat(); show("mufredat");
  const el = document.getElementById("t-" + id.replace(".","-"));
  if(el) el.scrollIntoView({ block:"start" });
}

    <div class="mgrid"><nav class="mlist" aria-label="Yöntemler">${list}</nav>${det}</div>
    <div class="section"><h2>Hangi yöntem ne için?</h2><p class="lede">Bir yönteme tıklayınca detayı yukarıda açılır.</p>${matrix}</div>`;
  $$("#v-metod [data-mi]").forEach(b => b.addEventListener("click", () => {
    const fromMatrix = !!b.closest(".matrix"); curMethod = +b.dataset.mi; renderMetod();

/* ---------- Metrikler ---------- */
const CALC = [
  ["sm","Dönem satış + pazarlama gideri (TL)",900000],["nc","Kazanılan yeni müşteri",40],["mr","Müşteri başına aylık gelir (TL)",4500],
  ["gm","Brüt marj (%)",65],["ch","Yıllık churn (%)",35],["op","Açık fırsat sayısı",60],["wr","Win rate (%)",25],["ad","Ortalama deal (TL)",54000],
  ["cy","Satış döngüsü (gün)",45],["tg","Yıllık yeni gelir hedefi (TL)",3000000],["mo","Toplantı → fırsat (%)",40],["cm","Temas → toplantı (%)",8],
  ["rt","Kalan dönem hedefi (TL)",900000],["pp","Açık pipeline (TL)",3240000]
];
const calcVals = Object.fromEntries(CALC.map(([k,,v]) => [k,v]));
const fmt = (n, d=0) => isFinite(n) ? n.toLocaleString("tr-TR",{maximumFractionDigits:d, minimumFractionDigits:d}) : "–";
function calcOut(){
  const v = calcVals, gm=v.gm/100, ch=v.ch/100, wr=v.wr/100, mo=v.mo/100, cm=v.cm/100;
  const cac = v.nc ? v.sm/v.nc : NaN, pay = (v.mr*gm) ? cac/(v.mr*gm) : NaN, ltv = ch ? v.mr*12*gm/ch : NaN;
  const ratio = cac ? ltv/cac : NaN, vel = v.cy ? v.op*wr*v.ad/v.cy : NaN;
  const wins = v.ad ? v.tg/v.ad : NaN, opps = wr ? wins/wr : NaN, mtgs = mo ? opps/mo : NaN, cont = cm ? mtgs/cm : NaN;
  const cov = v.rt ? v.pp/v.rt : NaN, req = wr ? 1/wr : NaN;
  return [
    ["CAC", fmt(cac)+" TL","Gider / yeni müşteri"],["CAC geri ödeme", fmt(pay,1)+" ay","CAC / (aylık gelir × marj)", pay>18?"warn":pay<=12?"good":""],
    ["LTV", fmt(ltv)+" TL","Yıllık brüt kâr / churn"],["LTV : CAC", fmt(ratio,1)+"x","Yaygın referans ≈ 3x", ratio<3?"warn":"good"],
    ["Sales velocity", fmt(vel)+" TL/gün","Fırsat × win rate × deal / döngü"],["Gereken kazanım", fmt(wins)+" / yıl","Hedef / ortalama deal"],
    ["Gereken fırsat", fmt(opps)+" / yıl","Kazanım / win rate"],["Gereken toplantı", fmt(mtgs)+" / yıl","Fırsat / toplantı→fırsat"],
    ["Gereken temas", fmt(cont)+" / yıl","Toplantı / temas→toplantı"],["Haftalık temas", fmt(cont/48)+" kişi","48 çalışma haftası"],
    ["Pipeline coverage", fmt(cov,1)+"x","Açık pipeline / kalan hedef", cov<req?"warn":"good"],["Gereken coverage", fmt(req,1)+"x","≈ 1 / win rate"]
  ];
}
function renderOuts(){ $("#outs").innerHTML = calcOut().map(([n,v,d,c]) => `<div class="out ${c||""}"><div class="v">${v}</div><div class="n"><b>${n}</b>, ${d}</div></div>`).join(""); }
function renderMetrik(){
  $("#v-metrik").innerHTML = `<h2>Metrikler ve hesaplayıcı</h2>
    <p class="lede">Örnek değerleri kendi rakamlarınla değiştir; birim ekonomisi, sales velocity ve ters huni anında hesaplanır. Kırmızı sonuç dikkat edilmesi gereken yeri gösterir.</p>
    <div class="calc">
      <div class="inputs">${CALC.map(([k,l]) => `<label>${esc(l)}<input type="number" inputmode="decimal" data-k="${k}" value="${calcVals[k]}"></label>`).join("")}</div>
      <div class="outs" id="outs"></div>
    </div>
    <div class="section"><h2>Metrik sözlüğü</h2><div class="gloss">${DATA.metrics.map(m => `<div class="gl"><b>${esc(m.ad)}</b><code>${esc(m.formul)}</code><span>${esc(m.yorum)}</span></div>`).join("")}</div></div>`;
  $$("#v-metrik input").forEach(i => i.addEventListener("input", e => { calcVals[e.target.dataset.k] = parseFloat(e.target.value) || 0; renderOuts(); }));
  renderOuts();
}

/* ---------- Projeler ---------- */
function renderProje(){
  $("#v-proje").innerHTML = `<h2>Pratik projeler</h2>
    <p class="lede">Her proje birkaç fazı birleştirir ve kendi işlerinden birine uygulanır. İlgili faza geldiğinde başla; adımları işaretledikçe ilerleme kaydedilir.</p>
    <div class="projects">${DATA.projects.map(p => {
      const done = p.adimlar.filter((_,i) => state.steps[p.kod+"-"+i]).length, pc = Math.round(done/p.adimlar.length*100);
      return `<article class="proj"><div class="pk">${p.kod}</div><h3>${esc(p.ad)}</h3><div class="area">${esc(p.alan)}</div>
        <p>${esc(p.amac)}</p>
        <div class="meter"><i style="width:${pc}%"></i></div><div class="meterlbl"><span>${done}/${p.adimlar.length} adım</span><span>%${pc}</span></div>
        <ol class="steps">${p.adimlar.map((s,i) => { const k = p.kod+"-"+i, ok = !!state.steps[k]; return `<li class="${ok?'ok':''}"><input type="checkbox" id="s-${k}" data-step="${k}" ${ok?"checked":""}><label for="s-${k}"><span>${esc(s)}</span></label></li>`; }).join("")}</ol>
        <div class="pfoot">Çıktı: ${esc(p.cikti)}<br>Süre: ${esc(p.sure)}, Fazlar: ${esc(p.fazlar)}</div></article>`;
    }).join("")}</div>`;
  $$("#v-proje [data-step]").forEach(c => c.addEventListener("change", e => {
    const k = e.target.dataset.step; if(e.target.checked) state.steps[k] = true; else delete state.steps[k]; persist(); renderProje();
    const el = document.getElementById("s-"+k); if(el) el.focus();
  }));
}

  $("#v-kaynak").innerHTML = `<h2>Kaynaklar: nereden, nasıl öğrenilir?</h2>
    <p class="lede">Sıralama önerisi: önce ücretsiz sertifikalar (HubSpot Academy, Trailhead) ve podcast'ler, faz ilerledikçe kitaplar, bütçe oluştuğunda MEDDICC, Winning by Design veya Pavilion gibi ücretli programlar.</p>
    <div class="controls"><input class="search" type="search" placeholder="Kaynak ara" value="${esc(rf.q)}" aria-label="Kaynaklarda ara"></div>
    <div class="chips">${[["all","Tümü"],...types.map(t=>[t,t])].map(([k,l]) => `<button class="chip" data-rt="${esc(k)}" aria-pressed="${rf.tur===k}">${esc(l)}</button>`).join("")}</div>
    <div class="count">${list.length} kaynak</div>
    <div class="res">${list.map(r => `<div class="rrow"><div class="t">${esc(r.tur)}</div>
      <div><h4>${r.link ? `<a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.ad)}</a>` : esc(r.ad)}</h4><div class="by">${esc(r.saglayici)}</div>
        <div class="facts"><span>${esc(r.fazlar)}</span><span>${esc(r.seviye)}</span><span>${esc(r.ucret)}</span><span>${esc(r.dil)}</span></div></div>
      <p>${esc(r.nasil)}</p></div>`).join("") || `<p class="empty">Aramana uyan kaynak yok.</p>`}</div>`;
  const s = $("#v-kaynak .search");
  s.addEventListener("input", e => { rf.q = e.target.value; const pos = e.target.selectionStart; renderKaynak(); const n = $("#v-kaynak .search"); n.focus(); n.setSelectionRange(pos,pos); });
  $$("#v-kaynak [data-rt]").forEach(b => b.addEventListener("click", () => { rf.tur = b.dataset.rt; renderKaynak(); }));
}

function renderAll(){ renderYol(); renderMufredat(); renderMetod(); renderMetrik(); renderProje(); renderKaynak(); }
loadLocal(); renderAll(); setSync("Bu tarayıcıda saklanıyor"); initStore();
